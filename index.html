const DATA={"P": [{"n": "T4", "tema": "Tarefa Online 4 · Aquecimento global no Brasil", "textos": [{"label": "Texto 1", "titulo": "Clima: aquecimento no Brasil já é maior que a média global", "autor": "", "paras": ["Entre 1961 e 1990, o número de dias com ondas de calor no Brasil não passava de sete. Esse número subiu para 20 dias entre 1991 e 2000; para 40 dias de 2001 a 2010, e para cerca de 52 dias, de 2011 a 2020. O aquecimento em várias regiões do Brasil já é maior que a média global: em alguns pontos do país, as médias das temperaturas máximas aumentaram em até 3°C nos últimos 60 anos - um aquecimento maior que a média global. Em todo o hemisfério Sul, os maiores aumentos de temperatura acontecem nas regiões subtropicais da América Latina, onde o Brasil se localiza.", "Essa elevação de temperatura faz com que a água evapore mais, tornando as estações e áreas secas ainda mais secas, e, ao mesmo tempo, carregando mais umidade, o que provoca chuvas mais intensas, em menor espaço de tempo, nas regiões úmidas e estações chuvosas. O Nordeste, a região amazônica e o Centro-Oeste têm sofrido secas mais prolongadas, o que aumenta a incidência de incêndios. Já as regiões Sul e Sudeste, principalmente em áreas urbanas, têm sido afetadas por mais chuva, com inundações, enxurradas e deslizamentos de terra. Ao mesmo tempo, o aumento do nível do mar e a erosão atingem cerca de 35% da costa, com maior concentração nas praias do Norte, Nordeste e Rio Grande do Sul. Suas consequências são a redução da largura das praias, destruição de infraestrutura e impactos na economia local.", "Esses são alguns dos dados de estudos nacionais e internacionais mais recentes e dos relatórios do IPCC (Painel Intergovernamental sobre Mudanças Climáticas) produzidos ao longo do Sexto Ciclo de Avaliação (AR6) que foram reunidas no compêndio Mudança do Clima no Brasil – síntese atualizada e perspectivas para decisões estratégicas. Trata-se de um documento-síntese elaborado pelo MCTI (Ministério da Ciência, Tecnologia e Inovação), a Rede Clima, o WWF-Brasil e o Instituto Alana com o objetivo de facilitar o acesso aos dados sobre o impacto da mudança do clima sobre o Brasil para formuladores de políticas públicas, pesquisadores, cientistas, professores, estudantes e imprensa. O esforço em consolidar este relatório reuniu sociedade civil, academia e governo com o objetivo de mobilizar a sociedade em torno do tema.", "Considerando um aumento de 2ºC na temperatura média global, até 2050, na Amazônia cerca de 50% da cobertura florestal pode ser perdida pela combinação de desmatamento, condições mais secas e aumento dos incêndios. Isso levaria a floresta tropical úmida a um ponto de não retorno, alterando todo o ciclo de chuvas no Brasil e na América do Sul. Os principais rios da bacia amazônica terão seu fluxo reduzido, com uma maior extensão geográfica da seca nos Estados do Amazonas, Acre, Rondônia e Roraima, impactando no acesso à água, alimentos e produção de energia elétrica. O Nordeste, que abriga cerca de 60 milhões de pessoas (dados de 2010), pode ter 94% do território transformado em deserto.", "O relatório destaca que aumentará entre 100 e 200% a população afetada por enxurradas no Brasil. Com a população brasileira envelhecendo e residindo em áreas urbanas (as projeções dizem que haverá aumento de 87% (2020) para 92,4% da população vivendo em cidades), grande parte dessas pessoas estará concentrada em assentamentos precários, sem preparo diante de tempestades, ondas de calor etc. Também haverá mais mortes e mais doenças transmitidas por vetores como dengue e malária.", "Estima-se um declínio de 77% dos estoques pesqueiros, com a possibilidade de até 2050, haver uma queda de até 30% na receita (em relação ao PIB) e diminuição de 30% a 50% dos empregos relacionados à pesca.", "Projeta-se também a quebra de safras e dificuldades no abastecimento de comida e água em vários pontos do país com um impacto esperado em até 21,5 milhões de pessoas vivendo nas grandes Os melhores passam por aqui!!!!!", "Página 1 cidades brasileiras, São Paulo, Rio de Janeiro e Belo Horizonte, que estarão expostas à escassez de água.", "Neste cenário, a demanda por energia tende a aumentar dada as necessidades de aumento de conforto térmico (resfriamento pelo uso de ar-condicionado) e para irrigação em sistemas agropecuários, mas potenciais danos à infraestrutura do sistema elétrico, incluindo usinas eólicas e solares, aumentará por causa dos desastres climáticos."]}, {"label": "Textos 2 e 3", "titulo": "Infográfico e charge (descrição das imagens)", "autor": "", "paras": ["<b>Texto 2 (infográfico “Efeito estufa e aquecimento global”):</b> à esquerda, o efeito estufa é um fenômeno natural em que alguns gases da atmosfera seguram o calor do sol refletido pela superfície, aquecendo o planeta (sem isso a Terra seria muito mais fria). À direita, o aquecimento global ocorre, principalmente, devido à intensificação do efeito estufa: ações humanas aumentam a presença de gases na atmosfera e elevam a temperatura média do planeta.", "<b>Texto 3 (charge de Gilmar):</b> um pai, de guarda-chuva sob o sol e a chuva, em um barco no mar, diz: “Não entendo mais esse clima, filho!”. O filho responde: “Se quiser posso explicar, pai!”. Ao fundo: fábricas soltando fumaça, árvores cortadas e um pinguim sobre um pedaço de gelo."]}], "qs": [{"q": "Segundo o Texto 1,", "pre": "", "o": ["a situação do aquecimento global ainda poderia piorar.", "a situação ambiental e a econômica vão piorar nas três próximas décadas.", "a população rural vai aumentar até 2050.", "a onda de calor tende a diminuir na próxima década."], "a": 0, "e": "Os dados mostram aumento de dias de ondas de calor e projeções piores; o texto usa “pode” e “projeta-se”, ou seja, a situação ainda poderia piorar. B, C e D não aparecem no texto.", "c": "I"}, {"q": "A palavra ESSE, em negrito, no primeiro parágrafo do Texto 1, é:", "pre": "", "o": ["um pronome relativo e se refere a algo já citado.", "um pronome demonstrativo e se refere a algo que será citado.", "um pronome relativo e se refere a algo que será citado.", "um pronome demonstrativo e se refere a algo já citado."], "a": 3, "e": "“Esse número” = demonstrativo (indica) que retoma algo já citado (“número de dias com ondas de calor”). Não é relativo.", "c": "C"}, {"q": "As palavras destacadas em (1), (2) e (3), respectivamente, pertencem às classes dos", "pre": "Neste cenário, a demanda (1) por energia tende a aumentar dada as necessidades de aumento de conforto térmico (resfriamento pelo uso de ar-condicionado) e para irrigação em sistemas agropecuários, mas (2) potenciais danos à infraestrutura do sistema elétrico, incluindo usinas eólicas (3) e solares, aumentará por causa dos desastres climáticos.", "o": ["advérbios, conjunções e substantivos.", "substantivos, advérbios e adjetivos.", "adjetivos, preposições e substantivos.", "substantivos, conjunções e adjetivos."], "a": 3, "e": "Demanda = substantivo; mas (nesse contexto) = conjunção; eólicas = adjetivo de “usinas”.", "c": "S"}, {"q": "O elemento linguístico MAS (2) cumpre o papel de:", "pre": "", "o": ["explicitar uma opinião que não se sustenta no texto.", "acrescentar uma informação a outra anteriormente enunciada.", "antecipar uma informação que será posteriormente introduzida.", "introduzir uma opinião contrária à informação anteriormente apresentada."], "a": 3, "e": "“Mas” introduz uma ideia contrária à anterior (aumenta a demanda, mas há danos à infraestrutura).", "c": "C"}, {"q": "No fragmento textual acima, as palavras que são acentuadas pela mesma regra são", "pre": "", "o": ["agropecuários e eólicas.", "eólicas e aumentará.", "climáticos e elétrico.", "cenário e climáticos."], "a": 2, "e": "Climáticos e elétrico são proparoxítonas. Agropecuários e cenário são paroxítonas com ditongo; eólicas é proparoxítona; aumentará é oxítona.", "c": "A"}, {"q": "A palavra QUE foi empregada para retomar um substantivo em:", "pre": "", "o": ["Três séculos atrás, o economista inglês Thomas Malthus vaticinava que, sem controle de natalidade, o mundo estaria destinado à fome.", "Cafiero sugere que o encarecimento das contas de luz na Europa, motivado pela suspensão do fornecimento do gás natural russo, afeta muito mais a população do continente do que o conflito em si.", "A produção do cereal era subsidiada pelos Estados Unidos, que começaram a escoar o excedente a países em desenvolvimento a título de ajuda internacional.", "Hoje vemos vários países da África dependendo da importação de trigo da Ucrânia, sendo que isso nem fazia parte da cultura alimentar deles."], "a": 2, "e": "Em C, “que” retoma “Estados Unidos” (pronome relativo, retoma um substantivo). Em A, B e D “que” é conjunção integrante.", "c": "S"}, {"q": "Pela leitura do trecho, podemos inferir que", "pre": "O relatório (1) destaca que aumentará entre 100 e 200% a população afetada por enxurradas no Brasil. Com a população brasileira envelhecendo e residindo em áreas urbanas (as projeções dizem que haverá aumento de 87% (2020) para 92,4% da população vivendo em cidades), grande parte dessas pessoas estará concentrada em assentamentos precários, sem preparo diante de tempestades, ondas de calor etc. Também haverá mais mortes e mais doenças transmitidas por vetores como dengue e malária.", "o": ["há uma tendência de estabilização da população que atualmente é atingida consequências adversas dos fenômenos naturais.", "o crescimento urbano desordenado e as condições as moradias em áreas inadequadas podem acentuar os problemas decorrentes das alterações climáticas.", "não há relação direta entre as alterações climáticas e o crescimento dos casos de doenças provocadas por mosquitos.", "há uma previsão de crescimento exagerado da população brasileira para próxima década."], "a": 1, "e": "O texto fala de população urbana em assentamentos precários sem preparo: urbanização desordenada e moradia inadequada agravam os efeitos do clima.", "c": "I"}, {"q": "O termo destacado O RELATÓRIO faz referência", "pre": "", "o": ["ao compêndio Mudança do Clima no Brasil.", "ao Sexto Ciclo de Avaliação (AR6).", "ao MCTI (Ministério da Ciência, Tecnologia e Inovação).", "à Rede Clima."], "a": 0, "e": "“O relatório” = o documento-síntese citado no parágrafo anterior: o compêndio “Mudança do Clima no Brasil”.", "c": "C"}, {"q": "Segundo o texto", "pre": "", "o": ["o número de dias com ondas de calor no Brasil vem diminuindo nos últimos 40 anos.", "as alterações climáticas influenciam negativamente na produção de alimentos e no abastecimento de água.", "um aumento de até 2ºC na temperatura média global até 2025 seria aceitável, pois não traria nenhuma consequência grave para o meio ambiente.", "a Região Nordeste brasileira poderá ter um aumento na onda de calor em até 94% em relação à temperatura média atual."], "a": 1, "e": "O texto cita quebra de safras e dificuldade no abastecimento de comida e água por causa das alterações climáticas.", "c": "I"}, {"q": "A principal intenção comunicativa do texto 1 é", "pre": "", "o": ["provocar o pânico na população diante das previsões de uma catástrofe climática.", "defender o ponto de vista de que as mudanças no clima estão provocando a destruição da Amazônia e a seca no Nordeste.", "discutir o papel do Estado brasileiro no combate às ações humanas que prejudicam o meio ambiente e provocam os desastres climáticos.", "Informar, através de dados científicos, que o aquecimento no Brasil está acima da média mundial."], "a": 3, "e": "O texto informa, com dados científicos, que o aquecimento no Brasil é maior que a média global (intenção informativa).", "c": "I"}, {"q": "“O aquecimento em várias regiões do Brasil já é maior que a média global”. O acento gráfico na palavra JÁ se justifica, pois", "pre": "", "o": ["é um monossílabo átono.", "é uma oxítona terminada em “a”.", "é um monossílabo tônico.", "possui apenas uma sílaba."], "a": 2, "e": "“Já” é monossílabo tônico terminado em -a: leva acento (regra dos monossílabos tônicos terminados em a, e, o).", "c": "A"}, {"q": "No trecho: “Estima-se um declínio de 77% dos estoques pesqueiros”, a palavra DECLÍNIO pode ser substituída, mantendo seu sentido original, por:", "pre": "", "o": ["retrocesso.", "avanço.", "aumento.", "enriquecimento."], "a": 0, "e": "Declínio = diminuição, queda; o sinônimo é retrocesso. Avanço, aumento e enriquecimento são o oposto.", "c": "M"}, {"q": "Quanto ao gênero textual, o Texto 2 configura-se como: A) artigo de opinião. C) tirinha. B) charge. D) infográfico.", "pre": "", "o": ["artigo de opinião.", "charge.", "tirinha.", "infográfico."], "a": 3, "e": "Texto 2 é um infográfico (imagem + texto que explica um fenômeno).", "c": "G"}, {"q": "O texto 2 é predominantemente", "pre": "", "o": ["narrativo.", "descritivo", "expositivo", "argumentativo"], "a": 2, "e": "O infográfico explica o que é efeito estufa e aquecimento global: sequência expositiva.", "c": "G"}, {"q": "O vocábulo FENÔMENO (Texto 2) é acentuado pelo mesmo motivo de:", "pre": "", "o": ["média.", "climáticas.", "incidência.", "relatório."], "a": 1, "e": "Fenômeno é proparoxítona. Climáticas também. Média, incidência e relatório são paroxítonas.", "c": "A"}, {"q": "Observe o trecho a seguir Ao mesmo tempo, o aumento do nível do mar e a erosão atingem cerca de 35% da costa, com maior concentração nas praias do Norte, Nordeste e Rio Grande do Sul. Suas consequências são a redução da largura das praias, destruição de infraestrutura e impactos na economia local. O termo em destaque é um pronome possessivo que indica que algo pertence a uma pessoa do discurso, no caso do texto, a palavra SUAS se refere:", "pre": "", "o": ["o aumento do nível do mar.", "a erosão.", "o aumento do nível do mar e a erosão.", "as praias do Norte."], "a": 2, "e": "“Suas” retoma os dois elementos: o aumento do nível do mar e a erosão.", "c": "C"}, {"q": "O propósito comunicativo prioritário do Texto 3 é", "pre": "", "o": ["criticar a falta de consciência ambiental diante do declínio da natureza.", "explicar o aquecimento global a partir do descontrole climático no planeta.", "informar sobre o declínio ambiental do planeta a partir dos distúrbios climáticos.", "refletir sobre o relacionamento amigável entre pai e filho diante do declínio ambiental."], "a": 0, "e": "A charge critica a falta de consciência: o pai não entende o clima enquanto a fábrica e o desmatamento aparecem ao lado.", "c": "I"}, {"q": "A leitura do Texto 3 permite inferir que", "pre": "", "o": ["as mudanças climáticas são menos percebidas no mar.", "os pinguins são os animais que mais têm sofrido com as mudanças climáticas.", "as ações humanas têm provocado mudanças climáticas.", "os jovens não entendem a relação entre suas ações e as mudanças climáticas."], "a": 2, "e": "A charge liga ações humanas (poluição, desmatamento) às mudanças climáticas.", "c": "I"}, {"q": "Os textos 1 e 3 desta prova, respectivamente, são", "pre": "", "o": ["notícia e cartum.", "editorial e quadrinhos.", "entrevista e cartaz.", "reportagem e charge."], "a": 3, "e": "Texto 1: reportagem. Texto 3: charge (humor crítico, quadro único).", "c": "G"}, {"q": "Os textos que formam essa prova têm em comum", "pre": "", "o": ["a intenção comunicativa.", "a crítica ao aquecimento global.", "a tipologia textual.", "a linguagem verbal. QUESTÕES DE MÚLTIPLA ESCOLHA – MATEMÁTICA"], "a": 3, "e": "Todos os textos usam linguagem verbal (palavras). Não têm o mesmo gênero nem a mesma tipologia.", "c": "G"}, {"q": "Segundo informações contidas no 4° parágrafo do Texto 1, O Nordeste, que abriga cerca de 60 milhões de pessoas (dados de 2010), pode ter 94% do território transformado em deserto. A representação desse quantitativo de pessoas em notação cientifica é dada por:", "pre": "", "o": ["60 X 107.", "6,0 X 107.", "6,0 X 106.", "6,0 X 108."], "a": 1, "e": "60 milhões = 60.000.000 = 6,0 × 10⁷.", "c": "n"}, {"q": "o Rio Grande do Sul foi o estado brasileiro mais afetado por enchentes em 2024. Suponha que, no Rio Grande do Sul, temos três estradas paralelas, RS-101, RS-118 e RS-235, que são cortadas por duas estradas transversais, RS-436 e RS-226, como mostrado na figura abaixo: O trecho da RS-436 entre as estradas RS-101 e RS-118 mede 12 km, enquanto o trecho entre as estradas RS-118 e RS-235 se estende por 36 km. Além disso, o trecho da RS-226 entre as estradas RS101 e RS118 tem uma extensão de 9 km. A distância, em quilômetros, do trecho da RS-226 entre as estradas RS118 e RS-235 é (Figura: três estradas paralelas, RS-101, RS-118 e RS-235, cortadas pelas transversais RS-436 e RS-226.)", "pre": "", "o": ["27.", "25.", "29.", ""], "a": 0, "e": "Tales (razão e proporção): 12/36 = 9/x → x = 36·9/12 = 27 km.", "c": "g"}, {"q": "O Texto 1 menciona que o número de dias com ondas de calor no Brasil aumentou da seguinte forma: ✓ 1961 a 1990: 7 dias ✓ 1991 a 2000: 20 dias ✓ 2001 a 2010: 40 dias ✓ 2011 a 2020: 52 dias Qual é a média aritmética do número de dias com ondas de calor no Brasil entre os anos de 1961 a 2020?", "pre": "", "o": ["24,75 dias.", "29,75 dias.", "29 dias.", "26,5 dias."], "a": 1, "e": "Média aritmética = (7 + 20 + 40 + 52)/4 = 119/4 = 29,75 dias.", "c": "t"}, {"q": "Considerando a quantidade de dias de ondas de calor no Brasil no período de 1961 a 2011, citado no 1º parágrafo do Texto 1, o valor total desses dias em algarismo romano é:", "pre": "", "o": ["CIX", "CXXIX", "CXVII", "CXIX"], "a": 3, "e": "Soma = 7 + 20 + 40 + 52 = 119. Em algarismos romanos: 100 = C, 10 = X, 9 = IX → CXIX.", "c": "n"}, {"q": "Durante a enchente no Rio Grande do Sul, um boletim das 12h registrou que havia 232,6 mil pessoas fora de casa. No boletim das 18h do mesmo dia, esse número aumentou para 485,6 mil pessoas. O número de pessoas adicionais que ficaram fora de casa no período das 12h às 18h foi de", "pre": "", "o": ["253 mil.", "163 mil.", "628,2 mil.", "174,6 mil."], "a": 0, "e": "485,6 − 232,6 = 253 mil pessoas.", "c": "q"}, {"q": "Segundo o texto 1, entre 1961 e 1990, o número de dias com ondas de calor no Brasil não passava de sete. Porém atingiu a marca de cerca de 52 dias, de 2011 a 2020. A diferença percentual entre as datas referidas se aproxima de", "pre": "", "o": ["742%", "642%", "542%", "442%"], "a": 1, "e": "Aumento = 52 − 7 = 45. 45/7 = 6,43 = 643% (≈ 642%).", "c": "p"}, {"q": "Marina resolveu confeccionar um letreiro da frase do Texto 2, EFEITO ESTUFA. Sabendo que cada letra que for confeccionada apenas uma vez custa R$ 180,00, cada letra que for confeccionada duas vezes custa R$ 150,00, cada letra confeccionada três ou mais vezes custa R$ 80,00, então, o custo total para confeccionar esse letreiro, em reais, será de:", "pre": "", "o": ["R$ 1.440,00.", "R$ 1.560,00.", "R$ 1.740,00.", "R$ 1.700,00."], "a": 2, "e": "EFEITO ESTUFA: E (3×) = 3 × 80 = 240; F (2×) = 2 × 150 = 300; T (2×) = 300; I, O, S, U, A (1× cada) = 5 × 180 = 900. Total = 240 + 300 + 300 + 900 = 1.740.", "c": "b"}, {"q": "Durante as recentes enchentes no estado do Rio Grande do Sul, 327.105 pessoas ficaram desalojadas, enquanto 68.519 encontraram abrigo em locais seguros. O número de vezes a mais que pessoas ficaram desalojadas do que foram abrigadas durante as enchentes, aproximadamente, foi", "pre": "", "o": ["4,63.", "4,77.", "4,84.", "4,71."], "a": 1, "e": "327.105 ÷ 68.519 ≈ 4,77.", "c": "q"}, {"q": "Após uma enchente devastadora no Rio Grande do Sul, uma equipe de resgate distribuiu suprimentos para os moradores afetados. Foi entregue 3/5 da quantidade total de água potável disponível em um centro de distribuição para uma comunidade. No entanto, após a distribuição, perceberam que ainda restavam 120 litros de água não distribuídos. Considerando que a enchente afetou várias comunidades, a quantidade total de água potável disponível, em litros, antes da distribuição para a comunidade, no centro de distribuição após a enchente é de", "pre": "", "o": ["200.", "500.", "300.", "180."], "a": 2, "e": "3/5 distribuídos, sobram 2/5 = 120 L → 1/5 = 60 L → total = 300 L.", "c": "q"}, {"q": "Na tentativa de conscientizar a população sobre as mudanças climáticas e a necessidade de um consumo mais sustentável, o governo de um país decidiu veicular uma propaganda nas 3 principais redes de televisão do país. Na primeira rede, a propaganda ocorre a cada 3 horas; na segunda, a cada 4 horas; e, na terceira, a cada 5 horas. Se as propagandas, nas 3 emissoras, foram veiculadas pela primeira vez no mesmo instante, a próxima vez que elas serão transmitidas, concomitantemente, pelas 3 emissoras ocorrerá após", "pre": "", "o": ["60 horas.", "50 horas.", "40 horas.", "30 horas."], "a": 0, "e": "MMC(3, 4, 5) = 60 horas.", "c": "m"}, {"q": "Um grupo de alunos do 9º ano desenvolveram cartões para divulgar na feira de Ciências da escola com o seguinte tema: “Aquecimento Global”. Eles utilizaram como material um papel com 120cm de comprimento por 80cm de largura. O papel foi recortado em cartões de formato quadrado com a maior dimensão possível e sem deixar sobras. Assim, o lado de cada cartão recortado foi de:", "pre": "", "o": ["45cm.", "40cm.", "30cm.", "50cm."], "a": 1, "e": "Lado do maior quadrado possível sem sobras = MDC(120, 80) = 40 cm.", "c": "m"}, {"q": "Maria Clara é aluna do 9º ano e estar se preparando para fazer o Exame de Seleção do IFRN. Ela ficou com dúvida na seguinte questão: “Numa divisão, o quociente é 10, o divisor é 25 e o resto é o maior possível”. Então, o dividendo será igual a:", "pre": "", "o": ["250.", "274.", "254.", "276."], "a": 1, "e": "Dividendo = divisor × quociente + resto. Resto máximo = divisor − 1 = 24. D = 25 × 10 + 24 = 274.", "c": "q"}, {"q": "Devido as altas temperaturas, o gerente de uma loja de aparelhos domésticos, apaixonado por matemática, colocou um determinado ar-condicionado em promoção relâmpago, e que seu preço foi dado em reais pelo produto entre o MMC e MDC de (36,42). Por quanto esses aparelhos foram vendidos?", "pre": "", "o": ["R$ 1.612,00.", "R$ 1.712,00.", "R$ 2.112,00.", "R$ 1.512,00."], "a": 3, "e": "MMC(36, 42) = 252 e MDC(36, 42) = 6. Produto = 252 × 6 = 1.512 (também é igual a 36 × 42).", "c": "m"}, {"q": "Com essa onda de calor que atinge todo o país acaba adoecendo as pessoas. Fernanda que é aluna do IFRN campus SPP foi uma delas. Ela, após ser atendida em uma unidade hospitalar, o médico prescreveu três medicamentos: um deles deve ser ingerido de 6 em 6 horas, outro de 8 em 8 horas e terceiro de 10 em 10 horas. Supondo que Fernanda ingeriu os três medicamentos às 10 horas da segunda-feira, então, a próxima vez que tomará os três medicamentos juntos novamente:", "pre": "", "o": ["sábado, às 10 horas.", "domingo, às 10 horas.", "sexta-feira, às 10 horas.", "quinta-feira, às 10 horas."], "a": 0, "e": "MMC(6, 8, 10) = 120 horas = 5 dias. Segunda-feira 10h + 5 dias = sábado, 10h.", "c": "m"}, {"q": "A quantidade de divisores do número 100 que aparece no início do 5º parágrafo do Texto 1, é igual a:", "pre": "", "o": ["12.", "10.", "8.", ""], "a": 3, "e": "100 = 2² × 5². Número de divisores = (2+1)(2+1) = 9.", "c": "m"}, {"q": "Considerando a quantidade de pessoas que vivem nas cidades de São Paulo, Rio de Janeiro e Belo Horizonte, conforme o trecho acima, então a representação desse número em Notação Científica é:", "pre": "Projeta-se também a quebra de safras e dificuldades no abastecimento de comida e água em vários pontos do país com um impacto esperado em até 21,5 milhões de pessoas vivendo nas grandes cidades brasileiras, São Paulo, Rio de Janeiro e Belo Horizonte, que estarão expostas à escassez de água.", "o": ["215 ● 105.", "21,5 ● 106.", "2,15 ● 107.", "2,15 ● 106."], "a": 2, "e": "21,5 milhões = 21.500.000 = 2,15 × 10⁷.", "c": "n"}, {"q": "Durante um tsunami nas Filipinas, Às 12 horas, havia 232,6 mil pessoas fora de casa, enquanto às 18 horas, o número aumentou para 395,6 mil pessoas. Com base nesses dados, a variação percentual do número de pessoas fora de casa, no período das 12h às 18h, aproximadamente, foi de", "pre": "", "o": ["59%.", "63%.", "70%.", "66%."], "a": 2, "e": "Variação = (395,6 − 232,6)/232,6 = 163/232,6 ≈ 0,70 = 70%.", "c": "p"}, {"q": "Imagine que a média das idades de uma equipe de 6 cientistas participantes de uma pesquisa sobre “Aquecimento Global” é de 32 anos. Um novo participante integrou-se ao grupo, passando essa equipe a ter 7 cientistas. Consequentemente, a média das idades da equipe aumentou para 34 anos. Nesse caso, a idade do novo CIENTISTA é:", "pre": "", "o": ["42 anos.", "40 anos.", "46 anos.", "38 anos."], "a": 2, "e": "Soma dos 6 cientistas = 6 × 32 = 192. Soma dos 7 = 7 × 34 = 238. Idade do novo = 238 − 192 = 46 anos.", "c": "t"}, {"q": "no Rio Grande do Sul, em determinado período, há um total de 107 mortos e 134 desaparecidos devido às enchentes. Considerando esses dados, a opção que melhor representa a aproximação da razão entre o número de mortos e o número de desaparecidos é", "pre": "", "o": ["8/9.", "6/7.", "10/13.", "4/5."], "a": 3, "e": "107/134 ≈ 0,80 = 4/5. (8/9 ≈ 0,89; 6/7 ≈ 0,86; 10/13 ≈ 0,77)", "c": "q"}, {"q": "O número de pessoas fora de casa devido aos temporais que atingem uma determinada região da China desde 29 de abril, na quinta-feira, 9 de maio, chegou a 395,6 mil. Considerando o período do final de 29 de abril até o final de 9 de maio como sendo de 10 dias, e supondo que a quantidade de novas pessoas fora de casa seja a mesma a cada dia, qual foi a quantidade diária de novas pessoas que ficaram fora de casa a cada dia?", "pre": "", "o": ["35964.", "42550.", "37228.", "395"], "a": 3, "e": "395.600 pessoas ÷ 10 dias = 39.560 por dia.", "c": "q"}]}, {"n": "T17", "tema": "Tarefa Online 17 · Racismo ambiental", "textos": [{"label": "Texto 1", "titulo": "O que é racismo ambiental e como ele ocorre no Brasil", "autor": "", "paras": ["Será que todas as pessoas sentem da mesma forma as ondas de calor? E as enchentes e deslizamentos, afetam mais quais grupos?", "Temperaturas extremas, enchentes, rompimento de barragens, deslizamentos de terra e secas por longos períodos são apenas alguns exemplos dos efeitos de mudanças climáticas desencadeadas por ações humanas, que causam uma série de problemas para a população.", "No geral, comunidades mais vulneráveis, que vivem em áreas marginalizadas e já enfrentam dificuldades econômicas e sociais – como pessoas negras, indígenas, quilombolas e ribeirinhas, por exemplo –, sofrem mais com as consequências da crise climática. Com um acesso precário a serviços básicos, como moradia, infraestrutura, tratamento de água e esgoto, esses locais frequentemente são palco de grandes tragédias.", "Para se ter uma ideia, moradores de favelas e periferias são vítimas de tragédias ambientais 15 vezes mais do que aqueles que residem em áreas seguras, segundo um relatório divulgado em 2022 pelo IPCC o Painel Intergovernamental sobre Mudanças Climáticas das Nações Unidas (ONU). Todo esse impacto sofrido principalmente por grupos marginalizados que compartilham uma mesma identidade racial ou étnica é chamado de racismo ambiental. Afinal, o que é racismo ambiental?", "O racismo ambiental se expressa de diferentes formas. Uma delas, como já explicamos, ocorre quando populações mais pobres e marginalizadas são afetadas de forma sistemática e desproporcional por questões ambientais negativas, como poluição do ar, queimadas e contaminação da água.", "Um exemplo são favelas e outras habitações construídas em encostas ou margens de rios, consideradas zonas de risco. Todos os anos, repetem-se nos noticiários histórias de deslizamentos de terra e enchentes nestes locais em épocas de fortes chuvas. Para piorar, a falta de acesso a serviços básicos, como água potável e saneamento, agrava ainda mais os impactos negativos do racismo ambiental negativos do racismo ambiental nessas áreas, afetando a saúde e bem-estar da população.", "Uma outra expressão do racismo ambiental ocorre em comunidades tradicionais e protegidas por leis, como territórios indígenas e quilombolas. Essas populações vivem em áreas de grande valor ecológico, como florestas e reservas naturais e, embora conheçam bem as peculiaridades da natureza local, têm pouca – ou nenhuma – influência sobre as decisões políticas que afetam seus territórios. Enquanto isso, industrias e latifúndios avançam sobre essas regiões, desmatando, poluindo rios, contaminando o solo e expondo a população local a substâncias nocivas.", "Exemplos de racismo ambiental no Brasil Para ilustrar melhor como o racismo ambiental se manifesta, separamos alguns casos que aconteceram no Brasil – embora esta seja uma prática cotidiana e muito recorrente.", "Um dos mais emblemáticos ocorreu em 2015: o rompimento da barragem da mineradora Samarco em Mariana (Minas Gerais). Rejeitos da mineração formaram uma lama tóxica que poluiu a bacia do Rio Doce por 600 km e matou 19 pessoas – 84,5% das vítimas imediatas eram negras. A poluição também prejudicou a subsistência de comunidades ribeirinhas, como o povo Krenak, que usava a água para pescar e irrigar plantações. Casas de regiões próximas também foram destruídas.", "Apenas quatro anos depois, a mesma história se repetiu. Em 25 de janeiro de 2019, uma barragem da Vale se rompeu em Brumadinho (Minas Gerais). Nesse caso, 259 pessoas foram mortas e 11 desapareceram. Entre as vítimas, 58,8% dos mortos e 70,3% dos desaparecidos não se declaravam como brancos e tinham renda média abaixo de dois salários mínimos.", "Como combater?", "Não há dúvidas de que eventos climáticos extremos e desastres da natureza impactam a população como um todo. Mas como há um recorte da população que sofre as consequências desses acontecimentos de forma sistemática e amplificada, é preciso pensar em soluções nesta mesma chave.", "Assim, para a desigualdade socioambiental ser efetivamente combatida, é necessário um esforço conjunto de diferentes esferas da sociedade. Essas ações devem envolver o poder público, organizações não governamentais, empresas, as populações afetadas e mesmo cada indivíduo."]}, {"label": "Texto 2", "titulo": "Charge (descrição da imagem)", "autor": "", "paras": ["Em um barco a vela, durante uma tempestade, um casal branco diz: “Agora inventaram um tal de ‘racismo ambiental’” e “Sério, de onde o povo tira essas ideias?”. Debaixo d’água, ao lado do barco, aparecem casas alagadas e pessoas negras se afogando."]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["Eventos climáticos extremos — como enchentes e ondas de calor — afetam primeiro e de forma mais destrutiva quem não tem acesso à infraestrutura urbana básica e moradia digna.", "por atuarem como guardiãs naturais do ecossistema onde vivem, indígenas, quilombolas e ribeirinhos são tratados como protagonistas no processo democrático de gestão desses espaços.", "mudanças climáticas, desencadeadas pelo ciclo natural, desestabilizam o meio ambiente provocando consequências graves e igualitárias para toda a população.", "a ocupação de áreas consideradas como zonas de risco ambiental caracteriza a irresponsabilidade das pessoas que se submetem a um ciclo recorrente de tragédias."], "a": 0, "e": "O texto mostra que enchentes, ondas de calor e deslizamentos atingem primeiro quem vive sem moradia digna, esgoto e infraestrutura. B inverte a ideia (povos tradicionais têm pouca influência), C fala em consequências “igualitárias”, D culpa as vítimas.", "c": "I"}, {"q": "O Texto", "pre": "", "o": ["noticia, de forma imparcial, desastres ambientais ocorridos no Brasil.", "descreve, de forma imparcial, o significado do termo “racismo ambiental.”", "combina a informação de fatos e a defesa de uma posição sobre o racismo ambiental.", "defende, de forma velada, a inexistência do racismo ambiental."], "a": 2, "e": "Há informação (dados, exemplos) e também defesa de uma posição (combater a desigualdade socioambiental). Por isso não é só notícia nem só definição.", "c": "G"}, {"q": "No último parágrafo do Texto 1, predomina a", "pre": "", "o": ["narração, devido à presença de verbos no presente.", "argumentação, devido à presença de progressão textual.", "narração, pois há uma relação temporal entre os enunciados.", "argumentação, pois há um posicionamento sobre a temática."], "a": 3, "e": "No último parágrafo o autor se posiciona (“é necessário um esforço conjunto…”). Isso é argumentação, não narração.", "c": "G"}, {"q": "De acordo com o texto", "pre": "", "o": ["industrias e latifúndios são exemplos de intervenções positivas não governamentais no combate à desigualdade ambiental.", "a maioria das vítimas de tragédias ambientais se identificava como pessoas de etnia branca e de médio poder econômico.", "o fato de viver em regiões legalmente protegidas não significa a inexistência da desigualdade ambiental para as etnias indígenas e quilombolas.", "desastres ambientais de grandes proporções são incomuns e fortuitos no Brasil."], "a": 2, "e": "O texto diz que territórios protegidos (indígenas e quilombolas) também sofrem com desmatamento, poluição e pouca influência política. Logo, proteção legal não elimina a desigualdade.", "c": "I"}, {"q": "Sobre a acentuação de palavras no trecho, é correto afirmar que", "pre": "No geral, comunidades mais vulneráveis (1), que vivem em áreas (2) marginalizadas e já enfrentam dificuldades econômicas e sociais – como pessoas negras, indígenas (4), quilombolas e ribeirinhas, por exemplo –, sofrem mais com as consequências (5) da crise climática (6).", "o": ["4 e 5 são acentuadas pela mesma regra.", "6 é acentuada por ser paroxítona.", "1, 2 e 4 é acentuada por serem paroxítonas.", "1, 2 e 5 são acentuadas pela mesma regra."], "a": 3, "e": "Vulneráveis, áreas e consequências são paroxítonas terminadas em ditongo (vul-ne-rá-veis, á-re-as, con-se-quên-ci-as). Indígenas e climática são proparoxítonas.", "c": "A"}, {"q": "Pertencem a mesma classe gramatical", "pre": "", "o": ["vulneráveis e consequências.", "áreas e consequências.", "áreas e climáticas.", "indígenas e consequências."], "a": 1, "e": "Áreas e consequências são substantivos. Vulneráveis e climática são adjetivos; “indígenas” modifica “pessoas” (adjetivo) no trecho.", "c": "S"}, {"q": "Um antônimo para a palavra VULNERÁVEIS (1) é", "pre": "", "o": ["enfraquecidas.", "suscetíveis.", "perecíveis.", "fortalecidas."], "a": 3, "e": "Vulnerável = frágil, exposto. O contrário é “fortalecidas”. As demais são sinônimos ou palavras próximas.", "c": "M"}, {"q": "De acordo com o texto 1, qual das alternativas a seguir melhor explica a relação entre o perfil da população atingida pelas desigualdades sociais nas cidades e os riscos socioambientais?", "pre": "", "o": ["há uma relação direta entre raça e etnia quando se observa a composição humana de áreas vulneráveis mais expostas a desastres naturais e poluição.", "as desigualdades sociais não influenciam os riscos socioambientais, pois todos os grupos populacionais são igualmente afetados.", "o acesso à educação e à informação reduz os riscos socioambientais, independentemente da condição socioeconômica.", "as políticas públicas são suficientes para mitigar os riscos socioambientais, independentemente do perfil da população."], "a": 0, "e": "Os dados mostram que negros, indígenas e quilombolas são maioria nas áreas de risco: há relação entre raça/etnia e exposição a desastres.", "c": "I"}, {"q": "Sobre o trecho, é correto afirmar que", "pre": "Não há dúvidas de que eventos climáticos extremos e desastres da natureza impactam a população (1) como um todo. Mas como há um recorte da população que sofre as consequências desses acontecimentos de forma sistemática e amplificada (2), é preciso pensar em soluções nesta mesma chave (3).", "o": ["a segunda oração do primeiro período cumpre a função sintática de completar o sentido de um nome.", "o primeiro período, sintaticamente, organiza-se a partir de três orações subordinadas.", "o segundo período é composto por coordenação com três orações.", "a segunda oração do segundo período tem a função sintática de objeto direto."], "a": 0, "e": "A segunda oração (“de que eventos… impactam a população”) completa o nome “dúvidas”: oração subordinada substantiva completiva nominal. O período 1 tem 2 orações; no 2º período há subordinação, não coordenação.", "c": "S"}, {"q": "Observando a norma-padrão da língua portuguesa, o primeiro período está corretamente reescrito e mantém seu sentido original na opção", "pre": "", "o": ["No conjunto, não existe dúvidas de que eventos climáticos extremos e desastres da natureza danificam a população.", "Em sua totalidade, não existem dúvidas de que eventos climáticos extremos e desastres da natureza afetam a população.", "Não tem dúvidas de que eventos climáticos extremos e desastres da natureza corrompem a população como um todo.", "No conjunto, não haviam dúvidas de que eventos climáticos extremos e desastres da natureza destroem a população."], "a": 1, "e": "“Não há dúvidas” = “não existem dúvidas” (haver impessoal = existir; plural “existem”). Em B a troca de “impactam” por “afetam” mantém o sentido. A, C e D têm erros de concordância ou mudam o sentido.", "c": "S"}, {"q": "A expressão A POPULAÇÃO (1) classifica-se como", "pre": "", "o": ["adjunto adnominal.", "complemento verbal.", "locução adverbial.", "sujeito."], "a": 1, "e": "“A população” completa o verbo “impactar” sem preposição: objeto direto (complemento verbal).", "c": "S"}, {"q": "Pela leitura do trecho, podemos inferir que", "pre": "", "o": ["apenas a população pobre e negra sofre com os impactos das crises climáticas.", "a população mais favorecida socioeconomicamente não sofre os efeitos das crises climáticas.", "os efeitos das crises climáticas são mais recorrentes e mais amplos para determinadas camadas sociais.", "os impactos das crises climáticas ocorrem, principalmente, por fatores geográficos."], "a": 2, "e": "O trecho diz que as consequências são sistemáticas e amplificadas para parte da população: os efeitos são mais recorrentes e amplos em certos grupos.", "c": "I"}, {"q": "A expressão destacada, QUE SOFRE AS CONSEQUÊNCIAS DESSES ACONTECIMENTOS DE FORMA SISTEMÁTICA E AMPLIFICADA [2], é uma oração", "pre": "", "o": ["substantiva completiva nominal, introduzida por uma conjunção integrante.", "adjetiva explicativa, introduzida por um pronome relativo.", "substantiva apositiva, introduzida por uma conjunção integrante.", "adjetiva restritiva, introduzida por um pronome relativo."], "a": 3, "e": "A oração “que sofre as consequências…” limita “recorte da população” (qual recorte?): adjetiva restritiva, introduzida pelo pronome relativo “que”.", "c": "S"}, {"q": "No trecho, o vocábulo CHAVE (3) foi utilizado de forma", "pre": "", "o": ["denotativa.", "conotativa.", "ambígua.", "polissêmica."], "a": 1, "e": "“Chave” não é objeto de metal: sentido figurado (solução). Uso conotativo.", "c": "L"}, {"q": "O primeiro período do último parágrafo do Texto 1 introduz uma ideia de", "pre": "", "o": ["conclusão de ideias previamente discutidas ao longo do texto.", "oposição em relação a algo que ainda será apresentado no texto.", "explicação de dados utilizados no desenvolvimento do texto.", "concessão em relação a algo que foi discutido anteriormente no texto."], "a": 0, "e": "“Assim” introduz uma conclusão do que foi dito antes no texto.", "c": "C"}, {"q": "Assinale a opção em que o vocábulo do último parágrafo foi formado por justaposição.", "pre": "", "o": ["desigualdade.", "governamentais.", "efetivamente.", "socioambiental."], "a": 3, "e": "Socioambiental = sócio + ambiental: dois radicais unidos (composição). Os demais são formados por prefixo/sufixo (derivação).", "c": "F"}, {"q": "O texto 2 utiliza linguisticamente", "pre": "", "o": ["a variante histórica.", "o registro formal.", "a variante social.", "a variante informal."], "a": 3, "e": "Linguagem informal: “um tal de”, “Sério, de onde o povo tira…”.", "c": "L"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["refletir sobre o relacionamento amigável entre a população diante as tragédias ambientais.", "ironizar as pessoas que acreditam na existência do racismo ambiental.", "criticar o negacionismo em relação ao racismo ambiental.", "informar sobre o declínio ambiental do planeta a partir dos distúrbios climáticos."], "a": 2, "e": "O casal rico ironiza a expressão “racismo ambiental” enquanto pessoas negras se afogam: a charge critica quem nega o problema (negacionismo).", "c": "I"}, {"q": "A leitura do Texto 2 permite inferir que", "pre": "", "o": ["as mudanças climáticas são menos desfavoráveis para o povo negro.", "as desigualdades étnicas e sociais são acentuadas nas crises climáticas.", "a população branca é a que mais têm sofrido com as mudanças climáticas.", "as pessoas deveriam ser mais solidárias durante as tragédias climáticas."], "a": 1, "e": "Os dois textos tratam do mesmo recorte: desigualdade ambiental e racismo. Não há dúvida nessa relação.", "c": "I"}, {"q": "Os textos 1 e 2 desta prova, respectivamente, são", "pre": "", "o": ["reportagem e charge.", "editorial e quadrinhos.", "reportagem e tirinha.", "entrevista e cartaz."], "a": 0, "e": "Texto 1: reportagem (informa e aprofunda). Texto 2: charge (humor crítico com fato atual).", "c": "G"}, {"q": "Os países em desenvolvimento precisam de financiamentos a juros baixos para enfrentarem os desafios ambientais. Pensando nesse apoio, um banco de desenvolvimento oferece pacotes de ajuda financeira em bilhões de dólares para ações ambientais nesses países a uma taxa de juros simples anual de 3%. Se uma nação pegar um empréstimo de 10 bilhões, para pagar após cinco anos, o montante a ser pago será", "pre": "", "o": ["12,5 bilhões.", "15 bilhões.", "11,5 bilhões.", "14 bilhões."], "a": 2, "e": "Juros simples: J = C·i·t = 10 × 0,03 × 5 = 1,5. Montante = 10 + 1,5 = 11,5 bilhões.", "c": "j"}, {"q": "Para incentivar a discussão sobre o racismo ambiental, um professor produziu uma maquete retratando um ambiente afetado pela poluição. Sabendo que a maquete foi construída em um recipiente em formato de paralelepípedo reto-retângulo, com 1,2m de comprimento, 0,6m de largura e 0,5m de altura, a capacidade da maquete, em litros, é de", "pre": "", "o": ["720.", "360.", "72.", ""], "a": 1, "e": "V = 1,2 × 0,6 × 0,5 = 0,36 m³ = 360 litros (1 m³ = 1000 L).", "c": "e"}, {"q": "A medida, segmento 𝑨 ̅ 𝑪̅̅ é", "pre": "Conforme relatado no texto 1, o povo indígena é uma das etnias mais afetadas pelo racismo ambiental. A Figura 1 mostra uma área de desmatamento na região Amazônica em forma de um triângulo retângulo (o ângulo reto está no vértice A). Sabe-se que as medidas AB e BC são, respectivamente, 8 e 10 metros (BC é a hipotenusa).", "o": ["13.", "9.", "6.", "12. em metros, do"], "a": 2, "e": "Triângulo retângulo com hipotenusa BC = 10 e cateto AB = 8: AC² = 10² − 8² = 36, logo AC = 6 m.", "c": "g"}, {"q": "A área, em m², da região desmatada é", "pre": "(Use a mesma Figura 1 da questão anterior: triângulo retângulo com AB = 8 m, BC = 10 m e ângulo reto em A.)", "o": ["30.", "27.", "40.", "24."], "a": 3, "e": "Área = (cateto × cateto)/2 = (8 × 6)/2 = 24 m².", "c": "g"}, {"q": "O racismo ambiental descreve como populações periféricas e marginalizadas sofrem de forma desproporcional com a degradação ambiental, como a poluição de rios e o acúmulo de lixo, devido à falta de saneamento básico e de investimentos públicos. Uma organização socioambiental realiza a limpeza de áreas afetadas pelo descarte irregular de resíduos. O custo diário (em Reais) para manter as equipes de limpeza atuando nessas comunidades é dado pela função afim: c(x)= 500+ 250x Onde: C(x) é o custo total diário da operação (em Reais); (x) é a quantidade de toneladas de lixo recolhidas e tratadas. 8 Se a organização recolher 4toneladas de lixo em um dia, qual será o custo total da operação?", "pre": "", "o": ["RS 2.000,00", "RS 1.500,00", "RS 1.300,00", "RS 1.200,00"], "a": 1, "e": "c(4) = 500 + 250×4 = 500 + 1000 = R$ 1.500,00.", "c": "f"}, {"q": "Em um município, a expansão industrial e a especulação imobiliária têm provocado graves episódios de racismo ambiental. Uma comunidade quilombola tradicional ocupa um território retangular de com área total de 12.000 m². Essa área está sendo objeto de disputa judicial por uma grande construtora que quer construir prédios residenciais nela. Sabendo que a medida do comprimento dessa área é maior 70 metros em relação ao cumprimento, as medidas do cumprimento e da largura desse terreno, respectivamente, são", "pre": "", "o": ["200m e 60m.", "120m e 100m.", "150m e 80m.", "145m e 75m."], "a": 2, "e": "x·(x + 70) = 12.000 → x² + 70x − 12.000 = 0. Δ = 4.900 + 48.000 = 52.900; √Δ = 230; x = (−70 + 230)/2 = 80 (largura) e comprimento = 150 m.", "c": "x"}, {"q": "Em uma determinada região metropolitana com 2.000.000 de habitantes, as áreas de risco são compostas quase exclusivamente por populações periféricas e de baixa renda. A distribuição demográfica da região indica que a população negra representa 3/4 do total de habitantes. Estudos recentes de saneamento e infraestrutura urbana revelam que, durante a época de chuvas fortes, 2/3 das pessoas negras residentes nessa área sofrem diretamente com alagamentos e deslizamentos de terra. Assim, os habitantes negros que sofrem com os alagamentos e deslizamentos nesta região é", "pre": "", "o": ["1.000.000", "1.100.000", "1.200.000", "1.300.000"], "a": 0, "e": "Negros: 3/4 de 2.000.000 = 1.500.000. Sofrem: 2/3 de 1.500.000 = 1.000.000.", "c": "q"}, {"q": "Para mitigar o racismo climático, a Defesa Civil de uma grande região metropolitana instalou sirenes de alerta contra deslizamentos e enchentes nas três comunidades periféricas mais vulneráveis: • Comunidade A: O sistema emite um alerta sonoro a cada (12 minutos). • Comunidade B: O sistema emite um alerta sonoro a cada (15 minutos). 9 Comunidade C: O sistema emite um alerta sonoro a cada (18 minutos). Em um cenário de tempestade e emergência climática, as sirenes soaram simultaneamente às 06h00. A partir desse horário, qual será o próximo horário exato em que as sirenes tocarão juntas novamente?", "pre": "", "o": ["08h00.", "09h00.", "10h00.", "11h00. •"], "a": 1, "e": "MMC(12, 15, 18) = 180 minutos = 3 horas. 06h00 + 3h = 09h00.", "c": "m"}, {"q": "Em um município baiano, o sistema de saneamento básico e as áreas de risco de inundação apresentam profunda desigualdade racial e social. As autoridades locais mapearam as regiões mais vulneráveis, dividindo-as em três territórios principais. Os dados revelam as seguintes quantidades de famílias negras e periféricas sofrendo com o racismo ambiental (falta de saneamento e risco de desastres): • Território A (Baixada Esperança): (48) famílias; • Território B (Vila Batalha): (72) famílias; • Território C (Morro do Céu Azul): (60) famílias. Para criar comitês emergenciais de defesa civil, assistência social e saúde, o poder público precisa organizar grupos de apoio com o mesmo número máximo de famílias em cada grupo, sem misturar os territórios, garantindo que o maior número de pessoas seja atendido simultaneamente. No total, serão formados", "pre": "", "o": ["12 grupos.", "13 grupos.", "14 grupos.", "15 grupos."], "a": 3, "e": "Para o mesmo número máximo de famílias por grupo sem misturar territórios, calcule o MDC(48, 72, 60) = 12. Grupos: 48/12 + 72/12 + 60/12 = 4 + 6 + 5 = 15.", "c": "m"}, {"q": "A representação reproduz uma área de um bairro periférico que sofre constantemente alagamentos durante o inverno. As retas t, u e v são paralelas e cortadas pelas transversais r e s. Na transversal r, os segmentos entre as paralelas medem 3 cm (entre t e u) e 9 cm (entre u e v). Na transversal s, o segmento entre t e u mede 7 cm e o segmento entre u e v mede x cm. Determine o valor da medida do segmento x.", "pre": "", "o": ["18 cm.", "20 cm.", "21 cm.", "23 cm."], "a": 2, "e": "Tales: 3/9 = 7/x → 3x = 63 → x = 21 cm.", "c": "g"}, {"q": "Em uma região metropolitana brasileira, um estudo analisou a distribuição da população e o risco de desabamentos e enchentes em duas áreas distintas: a Área Alfa (composta por bairros centrais e planejados) e a Área Beta (composta por ocupações periféricas). Os dados coletados pelo estudo revelaram que: • Na Área Alfa, residem 800.000 pessoas, e a proporção de indivíduos autodeclarados negros é de 20%. • Na Área Beta, residem 300.000 pessoas, e a proporção de indivíduos autodeclarados negros é de 80%. Pelos dados coletados, depreende-se que", "pre": "", "o": ["Na área Alfa residem mais negros do que na área Beta.", "o número de negros que residem na área Beta é quatro vezes maior do que o número de negros que vivem na área Alfa.", "640.000 pessoas que vivem na área Alfa não se autodeclararam negros.", "a maioria da população autodeclarada da área Beta é branca."], "a": 2, "e": "Alfa: 20% de 800.000 = 160.000 negros; não negros = 640.000 (C). Beta: 80% de 300.000 = 240.000 negros, que é 1,5 vez os de Alfa (não 4 vezes).", "c": "p"}, {"q": "Uma cooperativa de reciclagem recolheu 150 (quilos) de resíduos plásticos retirados de um lixão localizado próximo a uma área quilombola. O material foi dividido em dois tipos para a venda: plástico rígido e plástico flexível. Sabendo que a quantidade de plástico flexível recolhida é o dobro da quantidade de plástico rígido, foram recolhidos", "pre": "", "o": ["40 quilos de plástico rígido.", "80 quilos de plástico flexível.", "60 quilos de plástico rígido.", "100 quilos de plástico flexível."], "a": 3, "e": "Total 150 kg; flexível = 2 × rígido → rígido = 50 kg e flexível = 100 kg. (O enunciado omitiu a unidade; as alternativas usam quilos.)", "c": "q"}, {"q": "O número de vítimas negras imediatas dessa tragédia ambiental foi", "pre": "Rejeitos da mineração formaram uma lama tóxica que poluiu a bacia do Rio Doce por 600 km e matou 19 pessoas – 84,5% das vítimas imediatas eram negras.", "o": ["14", "15", "16", "17"], "a": 2, "e": "84,5% de 19 = 0,845 × 19 = 16,055 ≈ 16 vítimas.", "c": "p"}, {"q": "Transformado em notação científica, o total em metros da área do Rio Doce que foi atingida pela lama tóxica é representado na opção", "pre": "", "o": ["6 x 105", "5 x 105", "0,6 x 10³", "6 x 10²"], "a": 0, "e": "600 km = 600.000 m = 6 × 10⁵ m.", "c": "n"}, {"q": "Um mutirão de saúde comunitária foi montado para atender as vítimas de problemas respiratórios causados pela fumaça de indústrias instaladas próximo a uma comunidade quilombola de Jundiá. Com uma equipe de 4 médicos trabalhando juntos, o tempo total para atender todas as pessoas da comunidade é de 12 dias. A organização do mutirão quer contratar mais médicos para que o tempo de atendimento caia para 8 dias. O número de médicos adicionais que deve ser contratado para se atingir esse objetivo é", "pre": "", "o": ["6", "4", "3", "2"], "a": 3, "e": "Trabalho total: 4 médicos × 12 dias = 48. Em 8 dias: 48/8 = 6 médicos. Faltam 6 − 4 = 2. (grandezas inversamente proporcionais)", "c": "r"}, {"q": "Em uma escola, 3/5 dos 400 alunos matriculados vivem em áreas de risco ambiental e sujeitos a desastres ambientais. A fração de alunos que não vivem em áreas de risco ambiental, na forma decimal é", "pre": "", "o": ["0,4", "0,3", "0,5", "0,7"], "a": 0, "e": "3/5 de 400 = 240 vivem em risco. Os demais: 160 = 160/400 = 0,4.", "c": "q"}, {"q": "Em um acampamento improvisado que abrigava pessoas que tiveram suas casas alagadas pela enchente ocorrida em uma lagoa de captação no bairro de Felipe Camarão, em Natal, havia alimentos suficientes para 20 pessoas durante 30 dias. O gerente do acampamento, após a contagem das pessoas, observou que o total 12 de pessoas provisoriamente vivendo no local eram 24. Nessa situação, a quantidade de alimentos será suficiente para", "pre": "", "o": ["23 dias.", "22 dias.", "24 dias.", "25 dias."], "a": 3, "e": "Alimento total = 20 × 30 = 600 pessoas-dia. Com 24 pessoas: 600/24 = 25 dias.", "c": "r"}, {"q": "Para combater o problema da falta de água na comunidade do Curralinho, a prefeitura de Espírito Santo construiu um reservatório com capacidade de 18.000 litros. Esse reservatório está com 3/5 da sua capacidade ocupados com água. O volume de água que ainda cabe nesse reservatório é", "pre": "", "o": ["10.800 L", "9.800 L", "7.200 L", "6.800 L"], "a": 2, "e": "Falta 2/5 da capacidade: 2/5 × 18.000 = 7.200 L (3/5 = 10.800 L já ocupados).", "c": "q"}, {"q": "Em uma escola de ensino médio e fundamental, localizada no Bairro de Mãe Luíza, em Natal, houve muitas paralisações durante o ano letivo de 2024 devido a problemas climáticos como chuvas, goteiras e inundações. Dos alunos frequentes, sabemos que 2/9 ficaram de recuperação ao final do ano, totalizando 144 estudantes de recuperação final. O total de alunos matriculados dessa escola era", "pre": "", "o": ["584.", "648.", "692.", "702."], "a": 1, "e": "2/9 do total = 144 → total = 144 × 9/2 = 648 alunos.", "c": "q"}, {"q": "Dona Marta, moradora de uma comunidade atingida por desastres ambientais, precisou recorrer a um empréstimo de R$ 2.400,00 para reformar sua casa após fortes chuvas que alagaram sua rua. A linha de crédito especial cobrava uma taxa de juros simples de 3,5% ao mês, durante um período de 8 meses. O valor total dos juros que Dona Marta pagará ao final desse período será", "pre": "", "o": ["RS 672,00", "RS 762,00", "RS 846,00", "RS 972,00"], "a": 0, "e": "J = C·i·t = 2.400 × 0,035 × 8 = R$ 672,00.", "c": "j"}]}, {"n": "T20", "tema": "Tarefa Online 20 · Lei Maria da Penha, 20 anos", "textos": [{"label": "Texto 1", "titulo": "Vinte anos da Lei Maria da Penha: da proteção à autonomia", "autor": "", "paras": ["Ao completar 20 anos de sua promulgação, em 7 de agosto, a Lei Maria da Penha consolida-se como uma das mais importantes conquistas da democracia brasileira. Mais do que aperfeiçoar a legislação, transformou a forma como o Estado brasileiro compreende e enfrenta a violência doméstica e familiar contra as mulheres, rompendo com a lógica de que a violência ocorrida dentro de casa era um problema privado e afirmando que proteger as mulheres é um dever público.", "Ao longo dessas duas décadas, essa importante conquista jurídica e social fortaleceu mecanismos de proteção, ampliou o acesso à Justiça e contribuiu para que a violência de gênero passasse a ocupar um espaço central no debate público.", "Os resultados da pesquisa realizada pelos institutos Patrícia Galvão e Locomotiva, que faz um balanço sobre os 20 anos de vigência da lei, mostram que essa transformação é reconhecida pela sociedade. Sete em cada 10 mulheres afirmam que a Lei Maria da Penha teve impacto real em suas vidas, 73% consideram que ela protege as mulheres e 3 em cada 4 dizem que a legislação ampliou sua consciência sobre os riscos de sofrer violência. Ao mesmo tempo, a pesquisa revela um desafio que precisa orientar a próxima etapa dessa agenda. Oito em cada 10 brasileiras afirmam que a lei ainda não funciona na prática como deveria, e 82% entendem que, sozinha, ela não é suficiente para enfrentar a violência contra as mulheres.", "Entre os principais obstáculos apontados estão o medo de denunciar por represálias ou falta de proteção, mencionado por 68% das entrevistadas, seguido pela impunidade dos agressores e pela lentidão da Justiça. Esses dados não diminuem a importância da Lei Maria da Penha. Ao contrário, revelam a maturidade do debate. O desafio agora é garantir que os direitos assegurados pela lei possam ser efetivamente exercidos. Mas direitos formais só produzem liberdade real quando as mulheres têm condições materiais e sociais para exercê-los. A violência doméstica também se sustenta por relações de dependência, isolamento e controle que restringem possibilidades de escolha. Essa compreensão ganhou um significado muito concreto para mim durante minha atuação como Secretária-Adjunta de Mulheres, Igualdade Racial e Direitos Humanos do Distrito Federal. Os desafios dos próximos 20 anos passam por fortalecer a rede de proteção, garantir uma Justiça mais acessível e célere, investir em educação para a igualdade, enfrentar novas formas de violência, como a violência digital, e ampliar a coordenação entre União, estados e municípios. Passam também por assegurar que mais mulheres tenham acesso ao trabalho, à qualificação, ao empreendedorismo, ao crédito e à proteção social.", "Há 20 anos, o Brasil deu um passo histórico ao afirmar que a violência contra a mulher não era um problema privado, mas uma responsabilidade do Estado. A Lei Maria da Penha garantiu às mulheres o direito de sair da violência. O desafio dos próximos 20 anos é garantir que elas tenham as condições para fazê-lo."]}, {"label": "Texto 2", "titulo": "Charge “20 anos da Lei Maria da Penha” (Carol Ito)", "autor": "", "paras": ["Uma escada tem, no alto, a palavra “PREVENÇÃO” e, na base, “CRIMINALIZAÇÃO”. Um homem de braços cruzados, parado nos primeiros degraus, diz: “Mas nem todo homem…”."]}], "qs": [{"q": "Quanto à organização tipológica, o Texto 1 é predominantemente", "pre": "", "o": ["argumentativo, por explicitar o quadro dos resultados de duas décadas da existência da Lei Maria da Penha no Brasil.", "narrativo, por contar como se deu o processo de instituição da Lei Maria da Penha.", "argumentativo, por defender um ponto de vista favorável aos efeitos da Lei Maria da Penha no Brasil.", "narrativo, por informar o leitor sobre os impactos causados pela instituição da Lei Maria da Penha no Brasil."], "a": 2, "e": "O texto defende um ponto de vista favorável à Lei Maria da Penha (conquista importante), usando dados como argumento. Daí a tipologia argumentativa.", "c": "G"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["artigo de opinião.", "reportagem.", "editorial.", "notícia."], "a": 0, "e": "É texto assinado que defende uma opinião sobre um tema atual: artigo de opinião.", "c": "G"}, {"q": "De acordo com o Texto 1, após a Lei Maria da Penha", "pre": "", "o": ["o Estado assumiu a obrigação legal de intervir para garantir a integridade da mulher.", "reduziu drasticamente os casos de violência contra a mulher, provando a sua eficiência.", "a residência passou a ser um ambiente seguro e livre de violência doméstica.", "esgotou suas possibilidades de alcance social, sendo plenamente aceita e respeitada por todos."], "a": 0, "e": "O texto diz que a lei rompeu com a ideia de que a violência doméstica é problema privado: proteger as mulheres passou a ser dever público, obrigação do Estado.", "c": "I"}, {"q": "O Texto 1 permite inferir que", "pre": "", "o": ["o protagonismo das mulheres na sociedade brasileira foi plenamente assegurado pela Lei Maria da Penha.", "a igualdade dos direitos da mulher previstos constitucionalmente, há muito tempo, vem sendo cumprida no Brasil.", "as políticas de proteção à mulher no Brasil vão além da proteção contra agressões verbais ou físicas.", "Durante esses 20 anos de existência, a Lei Maria da Penha assegurou às mulheres brasileira um período sem ocorrência de feminicídios."], "a": 2, "e": "“Políticas de proteção” incluem rede de proteção, acesso à Justiça, trabalho, crédito e proteção social, não só contra agressões verbais ou físicas.", "c": "I"}, {"q": "O termo AO COMPLETAR 20 ANOS (1) se classifica como", "pre": "Ao completar 20 anos (1) de sua promulgação, em 7 de agosto, a Lei Maria da Penha consolida-se como uma das mais importantes conquistas da democracia brasileira.", "o": ["oração subordinada adverbial temporal.", "oração subordinada adverbial condicional.", "oração subordinada adjetiva.", "oração subordinada substantiva."], "a": 0, "e": "“Ao completar 20 anos” = “quando completa 20 anos”: oração reduzida de infinitivo, subordinada adverbial temporal.", "c": "S"}, {"q": "A leitura do trecho permite inferir que", "pre": "", "o": ["a Lei Maria da Penha foi o marco inicial da proteção à mulher no Brasil.", "a Lei Maria da Penha coexiste com outras pautas, direitos e marcos legais de proteção à mulher no Brasil.", "antes da Lei Maria da Penha a mulher era totalmente desprotegida de seus direitos no Brasil.", "as leis de proteção à mulher no Brasil, antes da promulgação da Lei Maria da Penha, eram irrelevantes."], "a": 1, "e": "“Uma das mais importantes conquistas” sugere que há outras: a lei convive com outros marcos e direitos.", "c": "I"}, {"q": "O termo em destaque PELOS INSTITUTOS PATRÍCIA GALVÃO E LOCOMOTIVA (1) exerce função de", "pre": "Os resultados da pesquisa realizada pelos institutos Patrícia Galvão e Locomotiva (1), que (2) faz um balanço sobre os 20 anos de vigência da lei, mostram (3) que essa transformação é reconhecida pela sociedade. Sete em cada 10 mulheres afirmam que a Lei Maria da Penha teve impacto (4) real em suas vidas, 73% consideram que (5) ela (6) protege as mulheres (7) e 3 em cada 4 dizem que (8) a legislação ampliou sua consciência sobre os riscos de sofrer violência (9).", "o": ["partícula apassivadora", "agente da passiva.", "complemento nominal.", "adjunto adnominal."], "a": 1, "e": "“Realizada pelos institutos…” indica quem pratica a ação na voz passiva: agente da passiva.", "c": "S"}, {"q": "Nas ocorrências destacadas, o elemento linguístico QUE tem valor de", "pre": "", "o": ["conjunção subordinativa nas ocorrências 2 e 5.", "conjunção coordenativa apenas na primeira ocorrência.", "pronome relativo apenas na segunda ocorrência.", "conjunção subordinativa nas ocorrências 5 e 8."], "a": 3, "e": "Em (2) “que faz um balanço” é pronome relativo. Em (5) “que ela protege” e (8) “que a legislação ampliou” são conjunções integrantes (subordinativas).", "c": "S"}, {"q": "Nesse contexto, o verbo “MOSTRAM (3)” revela que o autor do texto", "pre": "", "o": ["atribui a responsabilidade dos fatos apresentados à pesquisa.", "manifesta uma opinião pessoal sobre os avanços da lei.", "demonstra dúvida quanto às conclusões da pesquisa.", "procura minimizar a importância dos dados estatísticos apresentados pela pesquisa."], "a": 0, "e": "“Mostram” atribui a informação aos resultados da pesquisa; o autor apresenta o dado como fato apurado, não como opinião sua.", "c": "I"}, {"q": "O vocábulo IMPACTO (4) produz sentido de", "pre": "", "o": ["fragilidade.", "condição.", "emoção.", "ação."], "a": 3, "e": "“Impacto real em suas vidas” = efeito, influência: entre as opções, o sentido é de ação (efeito de uma ação).", "c": "M"}, {"q": "Sobre a formação do parágrafo é correto afirmar que", "pre": "", "o": ["o primeiro período é formado por duas orações.", "o primeiro período é formado por cinco orações.", "o segundo período é formado por cinco orações.", "o trecho é formado por dois períodos compostos e onze orações."], "a": 3, "e": "Contando também as orações reduzidas (“realizada pelos…” e “de sofrer violência”), o trecho tem 2 períodos compostos e 11 orações.", "c": "S"}, {"q": "O termo AS MULHERES (7) tem função de", "pre": "", "o": ["sujeito.", "complemento nominal.", "complemento verbal.", "adjunto adnominal."], "a": 2, "e": "“Protege as mulheres”: “as mulheres” completa o verbo “proteger” sem preposição: complemento verbal (objeto direto).", "c": "S"}, {"q": "O termo DE SOFRER VIOLÊNCIA (8) exerce função sintática de", "pre": "", "o": ["objeto indireto.", "adjunto adverbial.", "complemento nominal.", "adjunto adnominal."], "a": 2, "e": "“Riscos de sofrer violência”: completa o nome “riscos” (substantivo): complemento nominal.", "c": "S"}, {"q": "No trecho, os dados estatísticos da pesquisa foram utilizados com a finalidade de", "pre": "", "o": ["fazer uma contraposição em relação ao ponto de vista do autor.", "gerar controvérsias acerca da aceitação positiva da Lei Maria da Penha pelas mulheres.", "dar veracidade aos argumentos do autor com relação à linha argumentativa defendida por ele.", "refutar a ideia de aceitação da Lei Maria da Penha pelas mulheres brasileiras."], "a": 2, "e": "Os números dão veracidade à tese do autor: a lei é reconhecida e tem impacto.", "c": "I"}, {"q": "Segundo o texto 1, a violência contra a mulher", "pre": "", "o": ["se caracteriza apenas de forma física.", "muitas vezes, se sustenta por uma engrenagem de poder e controle.", "tem impacto apenas físico ou metal.", "saiu do âmbito do controle do estado para o controle das pessoas envolvidas."], "a": 1, "e": "O texto diz que a violência “se sustenta por relações de dependência, isolamento e controle”: engrenagem de poder e controle.", "c": "I"}, {"q": "O uso do verbo haver na expressão \"Há 20 anos\"", "pre": "Há (1) 20 anos, o Brasil deu um passo histórico ao afirmar que a violência contra a mulher não era um problema privado, mas uma responsabilidade do Estado.", "o": ["indica tempo decorrido ou passado.", "na norma padrão, poderia ser substituído pelo verbo TER.", "“Há 20 anos atrás” traria mais clareza a frase.", "possui como sujeito a expressão “20 anos”."], "a": 0, "e": "“Há 20 anos” indica tempo decorrido (passado). Haver é impessoal aqui; “há 20 anos atrás” é redundante.", "c": "V"}, {"q": "O elemento linguístico MAS (2)", "pre": "", "o": ["interliga períodos, estabelecendo relação de oposição.", "interliga orações, estabelecendo relação de concessão.", "interliga períodos, estabelecendo relação de concessão.", "interliga orações coordenadas adversativas."], "a": 3, "e": "“Mas” liga orações coordenadas (a segunda, elíptica: “[era] uma responsabilidade do Estado”) e dá ideia de oposição: coordenada adversativa.", "c": "C"}, {"q": "A partir da leitura do texto 2, podemos inferir que o ponto de vista implícito presente é", "pre": "", "o": ["a sociedade tem noção da responsabilidade coletiva no combate à violência contra a mulher.", "apenas a criminalização da violência contra a mulher resolverá o problema no Brasil.", "o fato de não ser um agressor, anula o dever social e legal de combater a violência de gênero.", "a criminalização deve estar no topo das atitudes no combate à violência contra a mulher."], "a": 2, "e": "O personagem diz “Mas nem todo homem…” como se não ser agressor anulasse o dever de combater a violência; é o ponto de vista presente na charge (que a imagem critica).", "c": "I"}, {"q": "Pela análise do texto 2, podemos deduzir que", "pre": "", "o": ["a principal medida contra a violência de gênero é a prevenção para que a violência nem chegue a acontecer.", "o personagem masculino simboliza a participação efetiva da sociedade no combate à violência de gênero.", "A Escada metaforiza a regressão das políticas públicas de combate à violência de gênero.", "A Frase \"Mas nem todo homem” simboliza a responsabilidade social do combate à violência de gênero."], "a": 0, "e": "Na escada, prevenção está no topo e criminalização na base: o foco principal deve ser evitar que a violência aconteça.", "c": "I"}, {"q": "Os textos 1e 2 apresentam em comum", "pre": "", "o": ["o gênero textual.", "a intenção comunicativa.", "a alusão temática à Lei Maria da Penha.", "a linguagem não verbal."], "a": 2, "e": "Os dois textos tratam dos 20 anos da Lei Maria da Penha (mesmo tema). Gênero e linguagem diferem.", "c": "I"}, {"q": "Uma pesquisa realizada com um grupo de 1.200 mulheres avaliou a percepção sobre a Lei Maria da Penha. Com base nos índices da pesquisa, e de acordo com o texto 1, quantas mulheres pesquisadas disseram que a legislação ampliou sua consciência sobre os riscos de sofrer violência?", "pre": "", "o": ["800 mulheres.", "860 mulheres.", "900 mulheres.", "960 mulheres."], "a": 2, "e": "3/4 de 1.200 = 900 mulheres.", "c": "p"}, {"q": "Após uma denúncia de tentativa de feminicídio, a justiça determinou que o agressor não poderia ficar a menos de 5,2 km da vítima que sofreu a agressão. Se a vítima se encontra 3 km ao sul de uma biblioteca da cidade e o agressor se encontra a 4 km a oeste dessa mesma biblioteca, então", "pre": "", "o": ["a determinação judicial está sendo cumprida, pois o agressor está a 5,5 km da vítima.", "a determinação judicial está sendo descumprida, pois o agressor está a 5 km da vítima.", "a determinação judicial está sendo cumprida, pois o agressor está a 6 km da vítima.", "a determinação judicial está sendo descumprida, pois o agressor está a 4,5 km da vítima."], "a": 1, "e": "Distância = hipotenusa: √(3² + 4²) = 5 km. Como 5 < 5,2, a determinação está sendo descumprida.", "c": "g"}, {"q": "Uma manifestação repudiando a violência contra as mulheres foi realizada em uma praça, construída no formato de um trapézio isósceles de base menor medindo 120 m, base maior medindo 280 m, e os lados não paralelos medindo 100 m. Sabendo que a praça ficou totalmente ocupada pelos manifestantes e que cada 𝑚2 foi ocupado por 4 pessoas, o número de pessoas presentes na manifestação foi", "pre": "", "o": ["40.000.", "50.000.", "48.000.", "58.000."], "a": 2, "e": "Trapézio isósceles: altura = √(100² − 80²) = 60 (80 = (280 − 120)/2). Área = (120 + 280)/2 × 60 = 12.000 m². 12.000 × 4 = 48.000 pessoas.", "c": "g"}, {"q": "Duas equipes de patrulhamento comunitário e apoio à mulher em situação de vulnerabilidade iniciam seus plantões periódicos em uma região às 08h00 de uma segunda-feira. A Equipe A realiza visitas de checagem a cada 12 dias, e a Equipe B realiza rondas de fiscalização de medidas protetivas a cada 18 dias. Considerando que ambas cumpriram seus cronogramas rigorosamente, após quantos dias as duas equipes se encontrarão novamente no mesmo dia de partida para realizar uma ação integrada de conscientização e panfletagem da campanha do Ligue 180", "pre": "", "o": ["24 dias.", "28 dias.", "32 dias.", "36 dias."], "a": 3, "e": "MMC(12, 18) = 36 dias.", "c": "m"}, {"q": "Um abrigo de apoio a mulheres vítimas de violência registrou 15 atendimentos no primeiro mês de funcionamento. Devido à expansão do projeto e à divulgação da rede de proteção, o número de atendimentos cresceu de forma constante, aumentando em 8 novos casos a cada mês. O total de atendimentos no 12º mês foi de", "pre": "", "o": ["103 casos.", "115 casos.", "123 casos.", "129 casos."], "a": 0, "e": "PA: a₁ = 15, razão 8. a₁₂ = 15 + 11 × 8 = 103 atendimentos.", "c": "f"}, {"q": "Um levantamento feito por um banco de dados global entre 2000 e 2019 estimou que 27% das mulheres de 15 a 49 anos sofreram algum tipo de violência de seus parceiros. Em uma cidade com 8 000 000 de mulheres de 15 a 49 anos, se a estimativa do levantamento global se mantiver, o número esperado de mulheres que sofrerão algum tipo de violência, em notação científica é", "pre": "", "o": ["2,16 · 10<sup>6</sup>.", "2,16 · 10<sup>5</sup>.", "2,7 · 10<sup>6</sup>.", "2,7 · 10<sup>5</sup>."], "a": 0, "e": "27% de 8.000.000 = 2.160.000 = 2,16 × 10⁶.", "c": "n"}, {"q": "Uma sala de aula tem ao todo 33 estudantes. O número de mulheres é a metade do número de homens e seis delas relataram já ter sofrido algum tipo de violência física por parte dos seus parceiros. A quantidade de mulheres desta sala que não relataram nenhum caso de violência foi um total de", "pre": "", "o": ["11.", "8.", "5.", "10."], "a": 2, "e": "M = H/2 e H + M = 33 → 3H/2 = 33 → H = 22 e M = 11. Sem relato: 11 − 6 = 5.", "c": "x"}, {"q": "Em uma cidade, o tempo (T) de resposta a uma ligação telefônica de emergência para a polícia, em minutos, é dada pela função T(x) = 2x + 5, onde x representa a distância, em quilômetros, da viatura policial ao local da ocorrência. Se uma emergência ocorreu a 12 km de uma viatura, o tempo de resposta a essa emergência foi de", "pre": "", "o": ["28 minutos.", "30 minutos.", "31 minutos.", "29 minutos."], "a": 3, "e": "T(12) = 2 × 12 + 5 = 29 minutos.", "c": "f"}, {"q": "Segundo o Texto 1, oito em cada 10 brasileiras afirmam que a lei ainda não funciona na prática como deveria. Suponha que essa proporção foi obtida a partir de uma pesquisa realizada com 2450 pessoas. Nessa pesquisa, o número de pessoas que consideram que a lei de proteção às mulheres funciona na prática foi", "pre": "", "o": ["1960.", "1600.", "800.", "4"], "a": 3, "e": "Oito em cada dez: não funciona (80%). Funciona: 20% de 2.450 = 490.", "c": "q"}, {"q": "Suponha que em determinada cidade, houve 13.452 atendimentos de mulheres vítimas de violência. Levando em conta os dados da tabela, o número de mulheres atendidas seria, aproximadamente Gráfico (cinco tipos mais comuns, em %): física 48,7; psicológica 23; sexual 11,9; abandono 6,7; outras 6,2.", "pre": "", "o": ["6351 casos de violência física.", "898 casos de abandono.", "1600 casos de violência sexual.", "830 casos de violência por causas indeterminadas na tabela."], "a": 2, "e": "Sexual: 11,9% de 13.452 ≈ 1.601 (alternativa C, 1.600). Física: 48,7% ≈ 6.551 (não 6.351). Abandono: 6,7% ≈ 901; outras: 6,2% ≈ 834.", "c": "p"}, {"q": "Em uma cidade, no ano de 2024 foram abertos 13.245 casos de violência contra a mulher. No ano seguinte, após uma forte campanha pública e social o número de casos registrados caiu para 10.873. A redução percentual aproximada de casos registrados nesse período foi de", "pre": "", "o": ["18,7%", "18,5%", "17,9%", "17,3%"], "a": 2, "e": "Redução = 13.245 − 10.873 = 2.372. 2.372/13.245 ≈ 0,179 = 17,9%.", "c": "p"}, {"q": "Em Goianinha, uma delegacia registrou 45 casos de violência contra a mulher em um mês. Se a razão entre o número de casos de violência física e psicológica foi de 4 para 5, o número de casos de violência psicológica foi de", "pre": "", "o": ["25", "20", "15", "30"], "a": 0, "e": "Razão 4:5 → 4k + 5k = 45 → k = 5. Psicológica = 5 × 5 = 25.", "c": "q"}, {"q": "Uma prefeitura deseja lançar uma campanha, a ser veiculada tanto em redes sociais quanto em emissoras de TV, para promover uma campanha contra a violência de gênero. O custo para veicular a campanha nas redes sociais inclui uma taxa de R$ 300,00 por cada postagem, enquanto nas emissoras de TV o custo é composto por uma taxa fixa de R$ 250,00, além de R$ 360,00 por cada transmissão. A função que representa o investimento total da prefeitura, considerando a veiculação de 𝑥 postagens e 𝑦 transmissões, pode ser expressa na forma:", "pre": "", "o": ["𝐼(𝑥, 𝑦) = 250 + 300𝑥 + 360𝑦.", "𝐼(𝑥, 𝑦) = 300 + 360𝑥 + 250𝑦.", "𝐼(𝑥, 𝑦) = 360 + 250𝑥 + 300𝑦.", "𝐼(𝑥, 𝑦) = 300 + 360𝑥 + 300𝑦."], "a": 0, "e": "Investimento = fixo da TV (250) + 300 por postagem (x) + 360 por transmissão (y): I = 250 + 300x + 360y.", "c": "f"}, {"q": "Uma equipe de 4 policiais de uma Delegacia da Mulher consegue analisar um lote de denúncias em 15 dias. Se a delegacia dobrar a equipe e designar 6 policiais para essa mesma demanda, o serviço será concluído em", "pre": "", "o": ["8 dias.", "9 dias.", "10 dias.", "22,5 dias."], "a": 2, "e": "Grandezas inversas: 4 × 15 = 6 × t → t = 10 dias. (O enunciado diz “dobrar”, mas fala em 6 policiais; o cálculo usa 6.)", "c": "r"}, {"q": "Uma prefeitura decide construir um centro de atendimento e apoio psicológico para mulheres vítimas de violência doméstica. O terreno cedido tem o formato de um triângulo retângulo e será dividido em duas partes por uma calçada de segurança: uma para a recepção/assistência jurídica e outra para o acolhimento infantil. Sabe-se que a base desse terreno triangular mede 24 metros e a altura relativa a essa base mede 10 metros. Qual é a área total, em metros quadrados, destinada a esse complexo de apoio?", "pre": "", "o": ["100 m.", "120 m.", "140m.", "160m."], "a": 1, "e": "Triângulo: área = base × altura / 2 = 24 × 10 / 2 = 120 m².", "c": "g"}, {"q": "Uma campanha de conscientização contra a violência doméstica planeja ocupar uma praça pública retangular com dimensões de 20 metros de largura por 30 metros de comprimento. No centro dessa praça, será montada uma tenda de atendimento e distribuição de cartilhas informativa com formato quadrado de 8 metros de lado. O restante da praça será gramado e livre para a circulação do público. A área livre para a circulação do público será de", "pre": "", "o": ["600 m².", "564m²", "536m²", "64m²"], "a": 2, "e": "Área da praça = 20 × 30 = 600 m². Tenda = 8 × 8 = 64 m². Área livre = 536 m².", "c": "g"}, {"q": "Em uma comunidade com 400 mulheres, uma pesquisa revelou que 3/5 delas já sofreram algum tipo de violência física, psicológica ou moral ao longo da vida. Quantas mulheres dessa comunidade não sofreram esse tipo de violência?", "pre": "", "o": ["240.", "180.", "160.", "120."], "a": 2, "e": "3/5 sofreram; não sofreram 2/5 de 400 = 160.", "c": "q"}, {"q": "Em uma cidade com 80.000 habitantes, o público feminino representa exatamente 50% da população total. Um estudo policial do município indicou que, ao longo de um ano, foram registrados 40 casos de violência doméstica e familiar contra a mulher. Desses 40 casos, constatou-se que 80% foram cometidos pelo parceiro ou ex-parceiro da vítima dentro da residência. A porcentagem dessas vítimas em relação ao total de mulheres da cidade foi de", "pre": "", "o": ["1,2%", "0,8%", "0,6%", "0,08%"], "a": 3, "e": "80% de 40 = 32 vítimas por parceiros. Mulheres = 40.000. 32/40.000 = 0,0008 = 0,08%.", "c": "p"}, {"q": "Considera que, após atos de violência contra mulheres em sala de aula, uma escola está planejando a instalação de novas câmeras em suas salas de aula para garantir a segurança. Para determinar a quantidade de câmeras necessárias, a escola precisa calcular a área de cada um desses espaços e pretende instalar uma câmera para até 10 metros quadrados. 11 Considerando a sala de aula apresentada na figura acima, o número mínimo de câmeras necessárias para cobrir toda a sala é (Figura: sala de aula retangular de 6 m por 8 m.)", "pre": "", "o": ["4,8.", "5,2.", "5,0.", "4,0."], "a": 2, "e": "Área = 6 × 8 = 48 m². 48 ÷ 10 = 4,8 → como não existe 0,8 de câmera, são necessárias 5 câmeras (alternativa “5,0”).", "c": "g"}, {"q": "Uma pesquisa de opinião realizada com 180 mulheres, em um terminal rodoviário, investigou a forma de violência contra a mulher da qual elas tinham sido vítimas. De acordo com a Tabela 1, cada mulher entrevistada indicava apenas uma forma de violência. Escolhendo uma dessas mulheres, aleatoriamente, a probabilidade de ela ter sofrido violência física é de PRODUÇÃO TEXTUAL Considerando a temática em foco, a leitura dos textos desta prova e seus conhecimentos prévios sobre o tema em discussão, escreva um ARTIGO DE OPINIÃO em que se posicione sobre a seguinte questão: COMO COMBATER A PERSISTÊNCIA DA VIOLÊNCIA CONTRA A MULHER NO BRASIL? Assine o seu artigo, exclusivamente, com o pseudônimo JORGINHO DA PAZ. 12 Tabela 1 (número de mulheres por forma de violência): patrimonial 18; sexual 40; física 85; moral 17; psicológica 20; total 180. Escolhendo uma dessas mulheres, aleatoriamente, a probabilidade de ela ter sofrido violência física é de", "pre": "", "o": ["17/36.", "1/13.", "18/47.", "2/9."], "a": 0, "e": "P = 85/180 = 17/36 (divide por 5).", "c": "b"}]}, {"n": "T22", "tema": "Tarefa Online 22 · Apostas online (bets)", "textos": [{"label": "Texto 1", "titulo": "Bets: uma droga virtual perigosa", "autor": "", "paras": ["Para quem nunca viveu ou teve na família ou nas suas relações um caso de vício em bets, parece exagerada a preocupação com a sedução perigosa que os jogos eletrônicos causam nos apostadores. Mas a verdade é que, a partir da primeira aposta, muitos, centenas, milhares, milhões deles não conseguem mais largar o vício e vão se afundando e afundando suas famílias em dívidas intermináveis. Ainda recentemente, uma enfermeira de Goiânia, Raquel Negrão, publicou um vídeo com um alerta sobre o perigo das apostas em bets, ao descobrir uma dívida de quase R$ 1 milhão deixada pelo marido, após a morte dele em setembro de 2023. Para realçar a dimensão econômica do estrago, a colunista Circe Cunha, do Correio Braziliense, citou um estudo de 2024, em que a autoridade monetária estimou que os gastos em apostas variavam entre R$20 bilhões e R$30 bilhões.", "O número de brasileiros que apostam em plataformas online continua crescendo. Uma pesquisa da Associação Brasileira das Entidades dos Mercados Financeiro e de Capitais (Anbima) aponta que o percentual de apostadores pulou de 14% da população em 2023 para 17% no ano passado. E segue crescendo assustadoramente. Outra pesquisa, agora da Quaest, constatou que 29% dos brasileiros – praticam
