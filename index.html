ente um terço da população – revelaram que apostam em bets. E uma fatia expressiva, cerca de 19%, chega a comprometer a renda familiar ou o orçamento mensal com esses jogos. Uma realidade de tirar o fôlego. Nessa toada, os brasileiros já destinaram R$ 507,3 milhões para casas de apostas esportivas regularizadas desde o início da Copa, segundo levantamento da Klavi, empresa especializada em Open Finance. Esses números exibem um quadro assustador, que comprova sem qualquer margem de dúvida que as apostas em bets oferecem risco real da contração de um vício: a ludopatia. Vício igual ao tabagismo, ao alcoolismo ou à dependência em drogas. E precisamente por isso precisa ser combatido com urgência pela aplicação das ferramentas jurídicas disponíveis. Até porque, de costas para a realidade dolorosa que sua atividade provoca, as plataformas de apostas, de olho exclusivamente nos lucros – tal como um traficante de drogas ou uma fabricante de cigarros – passaram a ocupar amplos espaços na internet, dominando competições esportivas, patrocinando clubes, comprando horários na televisão ou invadindo, de maneira permanente, celulares e redes sociais de milhões de brasileiros, como aponta Circe Cunha.", "O Ministério da Justiça, ciente do quadro, mandou a Secretaria Nacional do Consumidor (Senacon) abrir investigação para apurar irregularidades durante a transmissão da Copa pela CazéTV, por incentivar as apostas durante as transmissões dos jogos. A própria CazéTV baixou a bola e reduziu a divulgação das bets depois que o Senado determinou uma averiguação contra a CazéTV Produções Ltda. Ela própria passou a recomendar cautela e mandou seus comentaristas afirmarem que as apostas só devem ser realizadas para fins de entretenimento. Anteriormente, os comentaristas até avaliavam as chances de sucesso em determinadas apostas. Providência tópica e sem qualquer efeito prático, convenhamos. A propaganda de bebidas alcoólicas nunca foi totalmente proibida na TV brasileira, mas desde 1996 os anúncios só podem ser exibidos entre 21h e 6h, excluindo a cerveja que é considerada bebida de baixo teor pela antiga legislação. Já a propaganda de cigarros foi proibida definitivamente em dezembro de 2000, quando entrou em vigor a legislação que proibiu a publicidade de tabaco nos meios de comunicação de massa. Por que a propaganda das bets não segue o mesmo caminho? O avanço da ludopatia e do endividamento das famílias exige limites mais rígidos para a propaganda das plataformas de apostas.", "Até quando Executivo e Legislativo ficarão inertes diante da devastação causada pelo vício nas apostas eletrônicas, que em nada difere do tabagismo e do alcoolismo? Até quando famílias serão devastadas financeiramente pelos jogos eletrônicos que neste momento têm publicidade irrestrita garantida em todos os meios de comunicação? Até quando o governo permanecerá de braços cruzados enquanto os ganhos suados de pais de família escorrem velozmente para os cofres dos magnatas da jogatina eletrônica?"]}, {"label": "Texto 2", "titulo": "Charge (descrição da imagem)", "autor": "", "paras": ["Sob o título “Enquanto isso no país das bets…”, a avó diz à Chapeuzinho Vermelho: “Esqueça o lobo, você tem que tomar cuidado com o tigrinho mau!”. Ao lado, um tigre sorridente, de colete, exibe cédulas de dinheiro."]}], "qs": [{"q": "O título do Texto", "pre": "", "o": ["traz uma metáfora que aponta para os riscos das apostas online.", "tangencia a ideia central apontando o enfoque diferente do qual ela será abordada.", "sinaliza o processo narrativo que será desenvolvido no restante do texto.", "induz a uma interpretação equivocada do tema desenvolvido."], "a": 0, "e": "Chamar as bets de “droga” é uma metáfora: compara o vício em apostas ao vício em drogas, apontando o risco.", "c": "I"}, {"q": "A intenção comunicativa predominante no Texto 1 é", "pre": "", "o": ["defender um ponto de vista contrário a falta de regulamentação publicitária das bets.", "analisar os aspectos positivos e lúdicos das bets no Brasil.", "informar dados de uma pesquisa sobre relações de consumo dos usuários de bets.", "narrar as ações de canais de comunicação e seu envolvimento com as bets."], "a": 0, "e": "O texto critica a falta de limites rígidos para a publicidade das bets: defende ponto de vista contrário à falta de regulamentação.", "c": "I"}, {"q": "O Texto 1 organiza-se, predominantemente, pelo tipo textual", "pre": "", "o": ["narrativo.", "descritivo.", "argumentativo.", "expositivo."], "a": 2, "e": "O texto defende uma tese (bets viciam e precisam ser combatidas) com argumentos: tipo argumentativo.", "c": "G"}, {"q": "De acordo com o Texto 1,", "pre": "", "o": ["a proibição total da publicidade das bets seria a única maneira de frear os efeitos nocivos das apostas online.", "a publicidade agressiva das empresas de apostas atua como um gatilho para o vício e o endividamento, o que torna indispensável uma intervenção estatal.", "os grandes canais de comunicação são conscientes dos perigos das bets e alertam os telespectadores sobre os riscos das apostas online.", "texto utiliza metáforas de forte impacto social e saúde pública para validar o modelo de negócios das bets e seus impactos positivos na sociedade."], "a": 1, "e": "O texto diz que a publicidade agressiva funciona como gatilho e que Executivo e Legislativo devem agir: intervenção estatal.", "c": "I"}, {"q": "Os números percentuais citados ao longo do Texto 1 têm como objetivo principal", "pre": "", "o": ["mostrar o planejamento financeiro das empresas de bets com relação ao volume de apostas.", "relacionar O hábito das apostas digitais aos lucros obtidos pelos apostadores brasileiros.", "dimensionar o impacto socioeconômico e o comprometimento financeiro direto do orçamento familiar.", "expressar como as casas de apostas online são confiáveis com relação ao pagamento das apostas."], "a": 2, "e": "Os percentuais mostram quantos brasileiros apostam e quantos comprometem a renda: dimensionam o impacto econômico e familiar.", "c": "I"}, {"q": "Segundo o texto 1, as casas de apostas online", "pre": "", "o": ["dão apoio psicológico a pessoas que tiveram graves prejuízos financeiros com as apostas online.", "têm consciência do perigo viciante dos jogos e combatem à ludopatia.", "são contrárias a saturação da publicidade em redes sociais, celulares, camisas de times e transmissões de TV.", "ignoram o impacto social negativo em troca de ganhos financeiros massivos."], "a": 3, "e": "O texto afirma que as plataformas ocupam amplos espaços, “de costas para a realidade dolorosa”, de olho só nos lucros: ignoram o impacto social.", "c": "I"}, {"q": "O elemento linguístico QUE (1) refere-se a(à)", "pre": "Para quem nunca viveu ou teve na família ou nas suas relações um caso de vício em bets, parece exagerada a preocupação com a sedução perigosa que (1) os jogos eletrônicos causam nos apostadores.", "o": ["família.", "relações.", "vício.", "sedução."], "a": 3, "e": "“A sedução perigosa que os jogos causam”: o “que” retoma “sedução”.", "c": "C"}, {"q": "O elemento linguístico QUE(1) cumpre o papel de", "pre": "", "o": ["negar uma ideia.", "acatar uma ideia.", "explicar uma ideia.", "restringir uma ideia."], "a": 3, "e": "A oração “que os jogos causam nos apostadores” especifica qual sedução: adjetiva restritiva (função de restringir).", "c": "S"}, {"q": "Sobre a organização sintática do parágrafo, é correto afirmar que", "pre": "O número de brasileiros que (1) apostam em plataformas online continua crescendo. Uma pesquisa da Associação Brasileira das Entidades dos Mercados Financeiro e de Capitais (Anbima) APONTA que (2) o percentual de apostadores pulou de 14% da população em 2023 para 17% no ano passado. E segue crescendo assustadoramente (3).", "o": ["apresenta dois períodos simples.", "apresenta dois períodos compostos e um simples.", "o primeiro período apresenta três orações.", "o segundo período apresenta quatro orações."], "a": 1, "e": "1º período: “O número de brasileiros que apostam… continua crescendo” (2 orações, composto). 2º: “Uma pesquisa… aponta que o percentual… pulou…” (2 orações, composto). 3º: “E segue crescendo assustadoramente.” (simples).", "c": "S"}, {"q": "Sobre o valor do elemento linguístico QUE destacado no trecho, é correto afirmar que", "pre": "", "o": ["em (1), tem valor de conjunção subordinativa integrante.", "em (2), tem valor de conjunção subordinativa integrante.", "em (2), tem valor de pronome relativo.", "em (1), tem valor de conjunção coordenativa."], "a": 1, "e": "Em (1) “que apostam” é pronome relativo (retoma brasileiros). Em (2) “aponta que o percentual…” é conjunção integrante.", "c": "S"}, {"q": "O uso da forma verbal APONTA no trecho indica", "pre": "", "o": ["a constatação de um dado estatístico revelado por um estudo oficial, funcionando como um mecanismo de validação.", "a responsabilização do autor do texto sobre as informações prestadas.", "que os dados foram certificados pelas plataformas online.", "Transfere a responsabilidade do dado às casas de apostas, conferindo credibilidade ao enunciado."], "a": 0, "e": "O verbo “aponta” atribui a informação à pesquisa (fonte oficial), conferindo validação ao dado.", "c": "I"}, {"q": "O elemento linguístico ASSUSTADORAMENTE (3)", "pre": "", "o": ["tem valor de adjetivo e formação por derivação sufixal.", "tem valor de advérbio e formação por derivação sufixal.", "tem valor de adjetivo e formação por derivação prefixal.", "tem valor de advérbio e formação por composição."], "a": 1, "e": "Assustador + sufixo -mente: advérbio de modo, formado por derivação sufixal.", "c": "F"}, {"q": "O elemento linguístico TÓPICA, destacado no 4º parágrafo do texto 1, foi utilizado com sentido de", "pre": "", "o": ["efetiva.", "rigorosa.", "superficial.", "profunda."], "a": 2, "e": "Tópica = pontual, que trata só de um ponto: superficial, sem efeito real.", "c": "M"}, {"q": "No trecho, o uso da vírgula se justifica, pois", "pre": "Já (1) a propaganda de cigarros foi proibida definitivamente em dezembro de 2000, quando entrou em vigor a legislação que proibiu a publicidade de tabaco nos meios de comunicação de massa.", "o": ["introduz uma oração subordinada adverbial temporal.", "introduz uma oração subordinada adjetiva temporal.", "introduz uma oração coordenada explicativa.", "introduz uma oração subordinada substantiva."], "a": 0, "e": "A vírgula separa a oração “quando entrou em vigor…”: subordinada adverbial temporal.", "c": "P"}, {"q": "O elemento linguístico JÁ (1)", "pre": "", "o": ["Estabelece uma ênfase no caráter definitivo da ação.", "estabelece uma ideia de transição à ação.", "servindo para explicar ou retificar expectativa anterior.", "marca um sentido atemporal a uma ação que ainda será realizada."], "a": 0, "e": "Entre as alternativas, a que melhor se ajusta é a A: “já” reforça o caráter definitivo (“foi proibida definitivamente”) em contraste com o caso das bebidas. (Questão ambígua: o “já” também marca contraste com o parágrafo anterior.)", "c": "C"}, {"q": "No Texto 2, a leitura da linguagem verbal e não verbal permite afirmar que", "pre": "", "o": ["o mundo da fantasia e da ficção é muito perigoso.", "O uso de personagens de contos de fadas serve para atualizar uma fábula de alerta, transpondo o perigo da floresta para o cenário digital e econômico atual.", "os perigos das apostas online são menos impactantes do que os personagens maus de histórias infantis.", "os tigres são animais mais perigosos para crianças do que os lobos."], "a": 1, "e": "A charge reaproveita a fábula da Chapeuzinho e do lobo para alertar sobre o perigo atual: o “tigrinho” (jogo de apostas).", "c": "I"}, {"q": "No texto 2, o termo linguístico COM O TIGRINHO MAU tem função de", "pre": "", "o": ["sujeito.", "complemento nominal.", "adjunto adnominal.", "agente da passiva."], "a": 1, "e": "“Cuidado com o tigrinho mau”: “com o tigrinho mau” completa o nome “cuidado”: complemento nominal.", "c": "S"}, {"q": "No texto 2, o elemento linguístico MAU", "pre": "", "o": ["é um advérbio e tem como antônimo a palavra “bem.”", "é um adjetivo e tem como antônimo a palavra “bem.”", "é um adjetivo qualificador e tem como antônimo a palavra “bom”.", "é um advérbio de modo e tem como sinônimo a palavra “ruim.”"], "a": 2, "e": "“Mau” é adjetivo (qualifica “tigrinho”) e seu antônimo é “bom” (não “bem”, que é advérbio).", "c": "M"}, {"q": "O elemento que relaciona os textos 1 e 2 entre si é o", "pre": "", "o": ["registro informal.", "gênero textual.", "tipo textual.", "recorte temático."], "a": 3, "e": "Os dois textos tratam do mesmo recorte temático: as apostas online (bets).", "c": "I"}, {"q": "Quanto ao gênero textual, os textos 1 e 2 são, respectivamente,", "pre": "", "o": ["comentário e tirinha.", "artigo de opinião e charge.", "reportagem e cartaz.", "editorial e cartum."], "a": 1, "e": "Texto 1: artigo de opinião (assinado, defende um ponto de vista). Texto 2: charge.", "c": "G"}, {"q": "Um apostador colocou R$ 100,00 em uma plataforma de bets com uma cotação que indicava um retorno de 180% sobre o valor apostado em caso de vitória. Se ele vencer a aposta, o lucro líquido obtido será de:", "pre": "", "o": ["R$ 80,00", "R$ 100,00", "R$ 180,00", "R$ 280,00"], "a": 0, "e": "“Retorno de 180% sobre o valor apostado” = R$ 180 recebidos. Lucro líquido = 180 − 100 = R$ 80,00. (Se o ganho fosse 180% além da aposta, seriam R$ 180; o termo “líquido” indica descontar o valor apostado.)", "c": "p"}, {"q": "Em um grupo de 40 amigos, 15 admitiram que fazem apostas em jogos virtuais todos os fins de semana. A razão entre o número de amigos que não apostam e o total de amigos do grupo é:", "pre": "", "o": ["3/8", "5/8", "3/5", "8/3"], "a": 1, "e": "Não apostam: 40 − 15 = 25. Razão = 25/40 = 5/8.", "c": "q"}, {"q": "Um jovem registrou os seus gastos semanais com bets ao longo de 4 semanas: R$ 20,00, R$ 50,00, R$ 10,00 e R$ 40,00. A média dos gastos semanais desse jovem foi de:", "pre": "", "o": ["R$ 25,00", "R$ 30,00", "R$ 35,00", "R$ 40,00"], "a": 1, "e": "Média = (20 + 50 + 10 + 40)/4 = 120/4 = R$ 30,00.", "c": "t"}, {"q": "Para cobrir uma dívida gerada por apostas, um homem pegou R$ 500,00 emprestados com um agiota a uma taxa de juros simples de 15% ao mês. O valor total dos juros acumulados após 4 meses será de:", "pre": "", "o": ["R$ 800,00", "R$ 100,00", "R$ 120,00", "R$ 300,00"], "a": 3, "e": "J = 500 × 0,15 × 4 = R$ 300,00.", "c": "j"}, {"q": "Em uma roleta virtual com 10 setores idênticos numerados de 1 a 10, a probabilidade de a roleta parar em um número primo é:", "pre": "", "o": ["1/2", "2/5", "3/10", "4/10"], "a": 1, "e": "Primos de 1 a 10: 2, 3, 5, 7 (4 números). P = 4/10 = 2/5. As alternativas B e D são equivalentes (2/5 = 4/10); questão com duas respostas corretas.", "c": "b", "alt": [3]}, {"q": "Se 3 computadores em uma casa de apostas processam simultaneamente 120 apostas online em 2 minutos, o tempo necessário para que 5 computadores processem a mesma quantidade de apostas é de:", "pre": "", "o": ["1 minuto e 12 segundos", "1 minuto e 20 segundos", "1 minuto e 30 segundos", "1 minuto e 45 segundos"], "a": 0, "e": "Mais computadores, menos tempo (inversa): 3 × 2 min = 5 × t → t = 6/5 min = 1,2 min = 1 min 12 s.", "c": "r"}, {"q": "João tem uma banca inicial em um site de apostas. Após perder R$ 30,00, ficou com um saldo de R$ 75,00. Qual era o valor da banca inicial de João?", "pre": "", "o": ["R$ 45,00", "R$ 100,00", "R$ 105,00", "R$ 115,00"], "a": 2, "e": "Saldo final 75 após perder 30: banca inicial = 75 + 30 = R$ 105,00.", "c": "x"}, {"q": "Uma grande empresa de bets movimentou cerca de R$ 1.500.000.000,00 no último trimestre. Esse valor escrito em notação científica corresponde a:", "pre": "", "o": ["1,5 × 10⁸", "15 × 10⁸", "1,5 × 10⁹", "1,5 × 10¹⁰"], "a": 2, "e": "R$ 1.500.000.000 = 1,5 × 10⁹.", "c": "n"}, {"q": "Uma pesquisa mostrou que, de um total de 200 apostadores iniciantes, 35% perderam o dinheiro na primeira semana, 40% empataram e os demais lucraram. O número de apostadores que lucraram foi:", "pre": "", "o": ["25", "50", "70", "80"], "a": 1, "e": "35% + 40% = 75% não lucraram. Lucraram 25% de 200 = 50.", "c": "p"}, {"q": "Dois sinais luminosos em um painel de estatísticas de futebol ao vivo piscam em intervalos diferentes: o primeiro a cada 6 segundos e o segundo a cada 8 segundos. Se eles piscaram juntos agora, voltarão a piscar juntos daqui a:", "pre": "", "o": ["12 segundos", "18 segundos", "24 segundos", "48 segundos"], "a": 2, "e": "MMC(6, 8) = 24 segundos.", "c": "m"}, {"q": "Izadora comprou dois tipos de bilhetes promocionais em um site de palpites esportivos, totalizando 10 bilhetes por R$ 60,00. Sabendo que o bilhete tipo A custava R$ 5,00 e o tipo B custava R$ 8,00, a quantidade de bilhetes do tipo B adquiridos foi:", "pre": "", "o": ["3", "4", "5", "6"], "a": 1, "e": "A + B = 10 e 5A + 8B = 60 levam a 3B = 10, sem solução inteira (B ≈ 3,3). O enunciado é inconsistente; no app esta questão é contada como anulada.", "c": "x", "anul": 1}, {"q": "Um banner publicitário digital de uma casa de apostas tem formato retangular com largura de x metros e comprimento de (x + 4) metros. A expressão algébrica que representa a área desse retângulo é:", "pre": "", "o": ["2x +", "x² +", "x² + 4x", "4x² +"], "a": 2, "e": "Área = largura × comprimento = x · (x + 4) = x² + 4x.", "c": "x"}, {"q": "Em um folheto explicativo sobre o risco de vício em apostas, a imagem de um gráfico foi reduzida a uma escala de 1:50. Se a altura do gráfico no papel é 10 de 3 cm, a altura real representada é de:", "pre": "", "o": ["1,5 m", "3,0 m", "0,5 m", "15,0 m"], "a": 0, "e": "Escala 1:50: real = 3 × 50 = 150 cm = 1,5 m.", "c": "q"}, {"q": "Uma banca de R$ 200,00 sofreu um acréscimo de 20% em um dia e, no dia seguinte, um desconto de 20% sobre o novo valor. O valor final da banca após esses dois dias é de:", "pre": "", "o": ["R$ 192,00", "R$ 200,00", "R$ 196,00", "R$ 180,00"], "a": 0, "e": "200 × 1,2 = 240; depois 240 × 0,8 = 192. Acréscimo e desconto de 20% não se anulam.", "c": "p"}, {"q": "Os valores de 7 apostas feitas em uma mesa de poker online foram: R$ 10, R$ 15, R$ 20, R$ 50, R$ 100, R$ 200 e R$ 500. A mediana desses valores é:", "pre": "", "o": ["R$ 50,00", "R$ 100,00", "R$ 127,80", "R$ 20,00"], "a": 0, "e": "A mediana é o valor central dos 7 valores ordenados (10, 15, 20, 50, 100, 200, 500): o 4º = R$ 50,00.", "c": "t"}, {"q": "Um servidor de dados de uma plataforma de apostas tem formato de paralelepípedo retangular com dimensões de 0,5 m de largura, 0,8 m de comprimento e 2 m de altura. O volume desse servidor em metros cúbicos (m³) é:", "pre": "", "o": ["0,8", "1,0", "1,6", "3,3"], "a": 0, "e": "V = 0,5 × 0,8 × 2 = 0,8 m³.", "c": "e"}, {"q": "Uma plataforma cobra uma taxa fixa de R$ 5,00 de manutenção mais R$ 2,00 por cada saque realizado no mês. A lei da função que representa o custo total C(x) para um usuário que faz x saques no mês é:", "pre": "", "o": ["C(x) = 5x +", "C(x) = 2x +", "C(x) = 7x", "C(x) = 2x –"], "a": 1, "e": "Custo fixo (5) + R$ 2 por saque: C(x) = 2x + 5.", "c": "f"}, {"q": "Um apostador gastou 1/3 do seu salário em um jogo de azar e, em seguida, gastou 1/4 do mesmo salário em outro bilhete. Se ainda lhe sobraram R$ 1.200,00, qual é o valor total do seu salário?", "pre": "", "o": ["R$ 2.400,00", "R$ 2.880,00", "R$ 3.000,00", "R$ 3.600,00"], "a": 1, "e": "Gastou 1/3 + 1/4 = 7/12. Sobrou 5/12 do salário = 1.200 → 1/12 = 240 → salário = 2.880.", "c": "q"}, {"q": "Se o valor acumulado de um prêmio em uma plataforma de apostas de longo prazo é expresso por, o valor total desse prêmio é igual a:", "pre": "", "o": ["14", "20", "28", "32"], "a": 1, "e": "√144 = 12 e 2³ = 8. 12 + 8 = 20.", "c": "x"}, {"q": "Para montar uma combinada (aposta múltipla) de futebol, um usuário deve escolher 1 vencedor entre 4 times do grupo A e 1 vencedor entre 3 times do grupo B. O número total de apostas simples diferentes que ele pode montar é:", "pre": "", "o": ["7", "12", "24", "64"], "a": 1, "e": "Princípio multiplicativo: 4 × 3 = 12 combinações.", "c": "b"}]}, {"n": "T23", "tema": "Tarefa Online 23 · Educação ambiental e mudanças climáticas", "textos": [{"label": "Texto 1", "titulo": "Contra as mudanças climáticas, é preciso investir em educação", "autor": "", "paras": ["Você já deve ter presenciado ou participado de uma conversa em que alguém não entendia o que são as mudanças climáticas ou do que se tratava o tão noticiado aquecimento global. Pode ser que até mesmo você tenha suas dúvidas, o que é bastante compreensível. Primeiramente, porque estes temas nem sempre são abordados da maneira como deveriam. Antigamente, inclusive, ouvíamos que alguns recursos naturais eram infinitos, como a água. Os temas ambientais ou de sustentabilidade deveriam ser transversais na rede de ensino. Então, esses são assuntos que podem acabar ficando restritos a especialistas ou pessoas graduadas em áreas relacionadas ao tema. E esse é um grande problema para todos nós.", "As crianças deveriam ter contato sobre os desafios que o mundo enfrenta, incluindo as mudanças climáticas e desigualdades sociais. Mas também, precisamos promover a conscientização desde cedo e permitir que elas entendam a causa e o impacto das suas atitudes e hábitos de consumo no nosso planeta e na vida de todos.", "Os adultos têm um papel fundamental e essencial na mudança urgente dos hábitos em sociedade e principalmente na formação das futuras gerações. Claro que muitos destes adultos não têm conhecimento sobre o tema, mas hoje já é perceptível que algo não anda bem com o nosso planeta.", "Uma pesquisa divulgada este ano pelo Ipec (Inteligência em Pesquisa e Consultoria Estratégica) apontou que “apesar da diminuição da proporção em 2022, as questões relacionadas ao meio ambiente ainda preocupam a maioria dos brasileiros. Apenas 22% consideram saber muito sobre aquecimento global e mudanças climáticas e somente 52% dos entrevistados estão preocupados com o meio ambiente atualmente.” O interessante é que a maioria desses mesmos entrevistados (90%) afirma ter percebido o aumento de desastres ambientais nos últimos anos.", "As pessoas estão enxergando as catástrofes acontecerem e se assustam com queimadas, inundações, altas temperaturas, entretanto ainda não entendem os motivos que podem estar gerando estes acontecimentos. É preciso saber sobre emissões de gases do efeito estufa, neutralização de carbono, energia e tecnologias limpas, entre tantos outros assuntos, para fazer essa relação. Para isso, o país precisa investir na grade curricular das redes de ensino, principalmente nas escolas públicas, capacitando as crianças para enfrentarem os desafios que podem surgir em suas vidas e prepará-las para tomar decisões responsáveis em relação ao meio ambiente.", "Investir em educação ambiental, portanto, não apenas ajuda a moldar cidadãos conscientes e responsáveis, é a chave para enfrentar os desafios do nosso tempo e garantir um futuro sustentável e menos desigual para as próximas gerações. Ações individuais e coletivas podem ter um impacto global positivo – e é isso que precisa ser ensinado desde cedo."]}, {"label": "Texto 2", "titulo": "Charge de Gilmar (descrição da imagem)", "autor": "", "paras": ["Um pai, com guarda-chuva sob sol forte e chuva, em um barco, diz: “Não entendo mais esse clima, filho!”. O filho responde: “Se quiser posso explicar, pai!”. Ao fundo: fábricas soltando fumaça, troncos de árvores cortadas e um pinguim em um pequeno bloco de gelo."]}], "qs": [{"q": "De acordo com o Texto 1,", "pre": "", "o": ["Os temas ambientais ou de sustentabilidade deveriam ser tratados de forma isolada das outras temáticas da educação.", "a formação de uma futura geração consciente é papel exclusivo da educação ambiental ensinada nas escolas.", "é necessário que as crianças sejam conscientizadas sobre o impacto das suas atitudes e hábitos de consumo para o planeta e para a vida.", "discussões sobre mudanças climáticas devem ser restritas a especialistas ou pessoas graduadas em áreas relacionadas ao tema."], "a": 2, "e": "O texto defende que as crianças sejam conscientizadas sobre o impacto de suas atitudes e hábitos de consumo.", "c": "I"}, {"q": "O objetivo principal do Texto 1 é", "pre": "", "o": ["apresentar algumas conclusões do relatório de uma pesquisa divulgada este ano pelo Ipec (Inteligência em Pesquisa e Consultoria Estratégica).", "descrever os papéis de todos na sociedade e as transformações necessárias para um futuro sustentável.", "convencer os adultos a colaborarem para a educação ambiental dos filhos.", "argumentar sobre a importância do investimento em educação ambiental nas escolas."], "a": 3, "e": "O autor argumenta (defende uma tese) sobre a importância de investir em educação ambiental nas escolas.", "c": "I"}, {"q": "A utilização do pronome pessoas “você” é uma estratégia argumentativa que busca", "pre": "", "o": ["o engajamento direto do leitor, pois transforma o texto em uma espécie de diálogo, capturando a atenção de quem lê.", "responsabilizar diretamente o leitor com relação à problemática tratada no texto.", "eximir o autor de qualquer relação de responsabilidade com o conteúdo do texto.", "mostrar que o assunto abordado no texto é algo distante ou restrito a cientistas, e não algo que faz parte do cotidiano de qualquer pessoa comum."], "a": 0, "e": "O “você” aproxima o leitor, cria um diálogo e prende a atenção: estratégia de engajamento.", "c": "L"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["reportagem.", "artigo de opinião.", "editorial.", "notícia"], "a": 1, "e": "Texto assinado, que defende um ponto de vista sobre um tema: artigo de opinião.", "c": "G"}, {"q": "Analise o valor assumido pelo vocábulo QUE (1 E 3) e indique a opção correta.", "pre": "As crianças deveriam ter contato sobre os desafios que (1) o mundo enfrenta, incluindo as mudanças climáticas e desigualdades sociais. Mas também (2), precisamos promover a conscientização desde cedo e permitir que (3) elas entendam a causa e o impacto das suas atitudes (4) e hábitos de consumo no nosso planeta e na vida de todos.", "o": ["em (1), foi usado como conjunção integrante.", "em (3), foi usado como pronome pessoal.", "em (3), foi usado como conjunção subordinativa condicional.", "em ambos casos têm valor subordinativo."], "a": 3, "e": "Em (1) “que” = pronome relativo (retoma “desafios”); em (3) “que” = conjunção integrante (“permitir que elas entendam”). Em ambos os casos o “que” subordina: valor subordinativo.", "c": "S"}, {"q": "O termo “MAS TAMBÉM” (2) cumpre o papel de", "pre": "", "o": ["explicitar uma opinião que não se sustenta no texto.", "acrescentar uma informação a outra anteriormente enunciada.", "antecipar uma informação que será posteriormente introduzida.", "refutar uma opinião contrária à informação anteriormente apresentada."], "a": 1, "e": "“Mas também” soma uma informação nova (acrescenta), no sentido de “além disso”.", "c": "C"}, {"q": "O trecho é formado por", "pre": "", "o": ["um período e seis orações.", "um período e sete orações.", "dois períodos e seis orações.", "dois períodos e sete orações."], "a": 2, "e": "1º período: 3 orações (deveriam ter contato; que o mundo enfrenta; incluindo…). 2º período: 3 orações (precisamos promover; e permitir; que elas entendam…). Total: dois períodos e seis orações.", "c": "S"}, {"q": "O termo “DAS SUAS ATITUDES” (4) assume função de", "pre": "", "o": ["sujeito.", "objeto indireto.", "adjunto adnominal.", "complemento nominal."], "a": 3, "e": "“Das suas atitudes” completa o nome abstrato “impacto”: complemento nominal.", "c": "S"}, {"q": "O título do texto", "pre": "", "o": ["estabelece uma relação direta de causa e efeito entre o aprendizado e a sustentabilidade.", "aponta uma linha argumentativa que será refutada no restante do texto.", "está em contraste com as ideias defendidas no decorrer do texto.", "indica que a crise climática será resolvida apenas com tecnologia ou leis, em detrimento ao comportamento humano."], "a": 0, "e": "O título relaciona educação (aprendizado) à solução das mudanças climáticas e à sustentabilidade, e é isso que o texto defende.", "c": "I"}, {"q": "O uso das aspas no quarto parágrafo do texto justifica-se pois,", "pre": "", "o": ["demarcam as palavras do autor do texto, deixando clara sua posição sobre o tema.", "foram utilizadas para deixar explícito a fala de um especialista sobre a temática abordada.", "indicam uma citação literal, ou seja, a transcrição exata das palavras divulgadas pelo estudo do Ipec.", "delimitam o texto parafraseado com interferências do autor que está escrevendo."], "a": 2, "e": "As aspas reproduzem exatamente o que o Ipec divulgou: citação literal.", "c": "P"}, {"q": "O valor assumido pelo vocábulo SE (1) é de", "pre": "As pessoas estão enxergando as catástrofes acontecerem e se (1) assustam com queimadas (2), inundações, altas temperaturas. Entretanto (3) ainda não entendem os motivos que podem estar (4) gerando estes acontecimentos.", "o": ["conjunção subordinativa integrante.", "pronome pessoal.", "conjunção subordinativa condicional.", "pronome possessivo."], "a": 1, "e": "“Se assustam”: o “se” é pronome reflexivo (pronome pessoal oblíquo).", "c": "S"}, {"q": "O termo COM QUEIMADAS (2) tem função de", "pre": "", "o": ["complemento nominal.", "adjunto adnominal.", "objeto indireto.", "agente da passiva."], "a": 2, "e": "“Assustar-se com algo” exige preposição: “com queimadas” é objeto indireto.", "c": "S"}, {"q": "No trecho, as vírgulas foram utilizadas para indicar", "pre": "", "o": ["pausa respiratória.", "separação de termos de mesma função.", "demarcar a elipse verbal.", "separar orações coordenadas."], "a": 1, "e": "A vírgula separa termos de mesma função (queimadas, inundações, altas temperaturas: todos objetos do verbo).", "c": "P"}, {"q": "O vocábulo ENTRETANTO (3)", "pre": "", "o": ["interliga orações, estabelecendo sentido de adversidade.", "interliga períodos, estabelecendo sentido de explicação.", "interliga períodos, estabelecendo sentido de oposição.", "interliga orações, estabelecendo sentido de conclusão."], "a": 2, "e": "“Entretanto” começa um novo período (depois de ponto) e indica oposição: as pessoas veem as catástrofes, mas não entendem os motivos.", "c": "C"}, {"q": "A locução verbal PODEM ESTAR (4) exprime sentido de", "pre": "", "o": ["probabilidade.", "confiabilidade.", "negatividade.", "possibilidade."], "a": 3, "e": "“Podem estar gerando” indica possibilidade de causas (pode ser que gerem).", "c": "V"}, {"q": "Na inserção com o texto 1, o termo destacado PARA ISSO (1) poderia ser substituído, mantendo o mesmo sentido e de acordo com a norma culta por", "pre": "Para isso (1), o país precisa investir na grade curricular das redes de ensino, principalmente nas escolas públicas, capacitando as crianças para enfrentarem os desafios que (2) podem surgir em suas vidas e prepará-las (3) para tomar decisões responsáveis em relação ao meio ambiente.", "o": ["com essa finalidade.", "apesar disso.", "mesmo assim.", "dessa forma."], "a": 0, "e": "“Para isso” = “com essa finalidade” (valor de finalidade).", "c": "C"}, {"q": "O elemento linguístico QUE (2) cumpre o papel de", "pre": "", "o": ["negar uma ideia.", "acatar uma ideia.", "explicar uma ideia.", "restringir uma ideia."], "a": 3, "e": "“Desafios que podem surgir”: “que” é pronome relativo; a oração é adjetiva restritiva (restringe “desafios”).", "c": "S"}, {"q": "O termo linguístico LAS (3) retoma", "pre": "", "o": ["crianças.", "escolas públicas.", "vidas.", "redes de ensino."], "a": 0, "e": "“Prepará-las”: o pronome “las” retoma “as crianças”.", "c": "C"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["explicar o aquecimento global a partir do descontrole climático no planeta.", "criticar a falta de consciência ambiental diante do declínio da natureza.", "informar sobre o declínio ambiental do planeta a partir dos distúrbios climáticos.", "refletir sobre o relacionamento amigável entre pai e filho diante do declínio ambiental."], "a": 1, "e": "A charge critica a falta de consciência ambiental diante do declínio da natureza.", "c": "I"}, {"q": "A análise da linguagem verbal e da linguagem não verbal no texto 2, deixam implícita uma relação de", "pre": "", "o": ["causa e efeito.", "efeito e explicação.", "causa e finalidade.", "causa e proporcionalidade."], "a": 0, "e": "Verbal (fala do pai e do filho) e não verbal (fábrica, desmatamento, enchente, calor) mostram a ação humana (causa) e o clima alterado (efeito).", "c": "I"}, {"q": "Suponha que, para a realização de uma grande reunião sobre meio ambiente, em Belém, foram reservados, inicialmente, 4.900 lugares em auditórios. Durante a preparação, a organização adicionou mais 350 novos lugares e, em seguida, precisou interditar 150 lugares por questões de segurança. Se cada auditório após essas alterações descritas comporta 50 lugares, o número de auditórios que serão necessários para acomodar todos os lugares disponíveis é", "pre": "", "o": ["100.", "102.", "101.", "103."], "a": 1, "e": "4.900 + 350 − 150 = 5.100 lugares. 5.100 ÷ 50 = 102 auditórios.", "c": "x"}, {"q": "Para conscientizar sobre o uso racional da água, uma turma do IFRN calculou que um vazamento em uma torneira desperdiça 3 litros de água a cada 20 minutos. Quantos litros de água serão desperdiçados em 2 horas de vazamento?", "pre": "", "o": ["12 litros", "18 litros", "24 litros", "36 litros"], "a": 1, "e": "2 horas = 120 min = 6 períodos de 20 min. 6 × 3 L = 18 litros.", "c": "r"}, {"q": "Uma oficina de educação ambiental realizada pela Escola Iberê Ferreira de Souza, de Jundiá/RN, plantou 140 mudas de árvores em uma praça. Sabendo que o número de mudas de ipê foi o triplo do número de mudas de algaroba, e não houve outras espécies, quantas mudas de ipê foram plantadas?", "pre": "", "o": ["35", "70", "105", "120"], "a": 2, "e": "I = 3A e I + A = 140 → 4A = 140 → A = 35. Ipê = 3 × 35 = 105.", "c": "x"}, {"q": "Um projeto ecológico realizado no CESP de Várzea/RN, reduziu o consumo de plástico da cantina em duas etapas sucessivas: primeiro 10% e, em seguida, mais 20% sobre o valor já reduzido. Qual foi a porcentagem total equivalente de redução do plástico?", "pre": "", "o": ["30%", "28%", "26%", "25%"], "a": 1, "e": "Depois de 10%: 0,9. Depois de 20% sobre isso: 0,9 × 0,8 = 0,72. Redução total = 28%.", "c": "p"}, {"q": "Visando combater o desperdício de papel, uma campanha ecológica do Curso Lógico reservou 800 folhas para cópias de atividades. A meta é diminuir a utilização em 50 folhas a cada semana. Quantas folhas serão utilizadas na 5ª semana da campanha?", "pre": "", "o": ["550 folhas", "600 folhas", "650 folhas", "700 folhas"], "a": 1, "e": "Progressão aritmética: a₅ = 800 − 4×50 = 600 folhas (a 1ª semana usa 800).", "c": "f"}, {"q": "A cidade de Goianinha possui, segundo dados do IBGE (2022), 26.741 pessoas. Levando-se em conta os dados da pesquisa do Ipec, citada no texto 1, o número aproximado de cidadãos de Goianinha que consideravam saber muito sobre o aquecimento global, era, aproximadamente", "pre": "", "o": ["5.883.", "5.783.", "5.683.", "5.583."], "a": 0, "e": "22% de 26.741 = 0,22 × 26.741 ≈ 5.883.", "c": "p"}, {"q": "Numa pesquisa com alunos de uma escola de ensino médio de Arez/RN, 1/5 dos entrevistados disseram não acreditar no aquecimento global, 2/3 disseram acreditar e 32 dos entrevistados disseram ter dúvidas sobre o assunto. O número total de alunos ouvidos nessa entrevista foi", "pre": "", "o": ["180.", "200.", "220.", "240."], "a": 3, "e": "1/5 + 2/3 = 3/15 + 10/15 = 13/15. Restam 2/15 = 32 → 1/15 = 16 → total = 15 × 16 = 240.", "c": "q"}, {"q": "Para incentivar a discussão sobre o efeito estufa e as mudanças climáticas numa escola da zona rural de Espírito Santo, um professor produziu uma maquete retratando um ambiente afetado pela poluição nas águas. Sabendo que a maquete foi construída em um recipiente em formato de paralelepípedo retoretângulo, com 1,2m de comprimento, 0,6m de largura e 0,5m de altura, a capacidade da maquete, em litros, é de", "pre": "", "o": ["720.", "360.", "72.", "36."], "a": 1, "e": "V = 1,2 × 0,6 × 0,5 = 0,36 m³ = 360 litros.", "c": "e"}, {"q": "Conforme o Texto 1, nem todos as pessoas acreditam nas mudanças climáticas. Numa reunião para debater o assunto, participaram dois grupos, sendo um que acredita nas mudanças climáticas e outro que rejeita as teorias de mudança do clima, num total de 300 pessoas e, sabendo que a quantidade de pessoas do grupo das que acredita nas mudanças climáticas corresponde a dois terços da quantidade de pessoas presentes na reunião, o total de pessoas que acredita nas mudanças e estavam presentes na reunião foi", "pre": "", "o": ["200.", "150.", "100.", "250."], "a": 0, "e": "2/3 de 300 = 200 pessoas.", "c": "q"}, {"q": "Uma determinada área, em forma de triângulo, de uma praça pública da cidade de Várzea foi cercada para a preservação de mudas de árvores que serão posteriormente replantadas nas ruas da cidade. Sabendo que a cerca em volta da área teve 5 fiadas de arame farpado, a quantidade, em metros, de arame utilizada foi (Figura: triângulo retângulo com um lado de 39 m e a hipotenusa de 65 m; o ângulo reto fica entre o lado de 39 m e o terceiro lado.)", "pre": "", "o": ["156 m.", "234 m.", "324 m.", "780 m."], "a": 3, "e": "Hipotenusa 65, cateto 39: outro cateto = √(65² − 39²) = √(4225 − 1521) = √2704 = 52. Perímetro = 39 + 52 + 65 = 156 m. Com 5 fiadas: 5 × 156 = 780 m.", "c": "g"}, {"q": "Considere que a Assembleia Legislativa do Rio Grande do Norte aprovou um projeto que prevê multa superior a R$60.000,00 em caso de degradação ambiental do Rio Pitimbu. Tomando como base que uma empresa de combustível, praticou crime de poluição nesse rio e que, depois de o caso passar em juízo, foi definida uma multa fixa de R$65.000,00 a ser paga pela infratora, e uma taxa de juros simples de 1,3% para cada dia de atraso. Se a empresa realizar esse pagamento com atraso de 3 semanas completas, terá que pagar um valor total de", "pre": "", "o": ["R$66.830,00.", "R$76.830,00.", "R$65.830,00.", "R$82.745,00."], "a": 3, "e": "3 semanas = 21 dias. Juros = 21 × 1,3% = 27,3% de 65.000 = 17.745. Total = 65.000 + 17.745 = R$ 82.745,00.", "c": "j"}, {"q": "Pesquisando para um trabalho escolar sobre o aquecimento global, Marina Dantas leu que o Himalaia concentra 600 bilhões de toneladas de gelo. Sabendo que a superfície da terra ocupada pela região do Himalaia corresponde a, aproximadamente, 600 mil quilômetros quadrados, se esse gelo fosse distribuído uniformemente por toda essa área, a quantidade de gelo, por km², em toneladas, seria de", "pre": "", "o": ["100 000.", "1 000 000.", "10 000 000.", "100 000 000."], "a": 1, "e": "600 bilhões = 600 × 10⁹ t; 600 mil km² = 600 × 10³ km². Divisão = 10⁶ = 1.000.000 t/km².", "c": "n"}, {"q": "O professor de Ciências da Escola Nazaré Duarte, de Goianinha/RN, trabalhou o tema aquecimento global na semana do Meio Ambiente com uma turma de 30 alunos. A fim de distribuir bottons comemorativos para o evento, foram impressos adesivos circulares cujo diâmetro mede 4 cm. A gráfica contratada para a confecção cobra R$0,50 pelo cm2 do adesivo mais R$1,00 pela unidade do botton. O número máximo de bottons personalizados para o evento que é possível comprar com o valor de R$740,00 reais é de (Considere 3,14 como a aproximação para 𝜋)", "pre": "", "o": ["100.", "101.", "102.", "104."], "a": 1, "e": "Área do adesivo = π·r² = 3,14 × 2² = 12,56 cm². Custo = 12,56 × 0,50 + 1,00 = 7,28 por botton. 740 ÷ 7,28 ≈ 101,6 → no máximo 101 bottons.", "c": "g"}, {"q": "Um grupo de pesquisa estudou o aquecimento global e seus efeitos na altura do pico de algumas geleiras. Com a ajuda de alpinistas, eles obtiveram as seguintes medidas, conforme mostra a Figura 2: 𝐵𝐶̅̅̅̅̅̅̅̅ = 280𝑚, ̅̅̅̅𝐶𝐷̅̅̅̅̅̅̅̅ = 20𝑚 e 𝐶𝐸̅̅̅̅̅̅̅̅ = 160𝑚. Com base nesses dados, a altura 𝐴 ̅̅̅̅ 𝐵̅̅̅̅̅̅̅̅, em metros, do pico de uma geleira estudada é de (Figura 2: triângulo retângulo ABD, com ângulo reto em B; o ponto C está sobre BD e o ponto E está sobre AD, com CE perpendicular a BD.)", "pre": "", "o": ["1250.", "1500.", "2400.", "2800"], "a": 2, "e": "Semelhança de triângulos (ABD ~ CED): AB/CE = BD/CD → AB/160 = 300/20 → AB = 160 × 15 = 2.400 m.", "c": "g"}, {"q": "Como forma de economizar água, a escola Vicência Castelo instalou uma cisterna para captação de água pluvial. Essa cisterna escolar estava com 3/5 da sua capacidade total preenchida com água da chuva. Após uma forte chuva, o nível subiu e atingiu 9/10 da capacidade. Que fração da capacidade total representa o volume de água que entrou na cisterna durante essa chuva?", "pre": "", "o": ["1/2", "3/10", "2/5", "6/15"], "a": 1, "e": "9/10 − 3/5 = 9/10 − 6/10 = 3/10.", "c": "q"}, {"q": "Trocar lâmpadas comuns por lâmpadas de LED em uma sala de aula reduziu o consumo de energia em R$ 50,00 mensais. Se essa economia for mantida durante um ano inteiro, quanto a escola terá economizado?", "pre": "", "o": ["R$ 500,00", "R$ 550,00", "R$ 600,00", "R$ 650,00"], "a": 2, "e": "R$ 50 × 12 meses = R$ 600,00.", "c": "q"}, {"q": "O custo total (C) em reais para produzir cartilhas de educação climática é dado pela função C (x) = 5x + 100, em que x é o número de cartilhas impressas. O custo para produzir 40 cartilhas é", "pre": "", "o": ["R$ 200,00", "R$ 250,00", "R$ 300,00", "R$ 350,00"], "a": 2, "e": "C(40) = 5 × 40 + 100 = R$ 300,00.", "c": "f"}, {"q": "Em uma palestra sobre o clima realizada pelo IFRN de Canguaretama, havia um público total de 240 pessoas, entre estudantes e professores. Sabendo que o número de estudantes excede o de professores em 60 pessoas, quantos estudantes estavam presentes?", "pre": "", "o": ["120", "130", "140", "150"], "a": 3, "e": "E + P = 240 e E − P = 60. Somando: 2E = 300 → E = 150.", "c": "x"}, {"q": "O agronegócio é responsabilizado diretamente por muitos problemas ambientais no Brasil. As exportações de soja no Brasil totalizaram 4,129 milhões em toneladas no mês de julho de 2025 e registraram um aumento em relação ao mês de julho de 2024. A quantidade, em quilogramas, de soja exportada pelo Brasil no mês de julho de 2025 foi de:", "pre": "", "o": ["4,129 x 103", "4,129 x 106", "4,129 x 109", "41,29 x 106"], "a": 2, "e": "4,129 milhões = 4,129 × 10⁶ toneladas. Como 1 t = 10³ kg: 4,129 × 10⁶ × 10³ = 4,129 × 10⁹ kg.", "c": "n"}, {"q": "Um satélite de monitoramento ambiental registrou uma área retangular de desmatamento ilegal na Floresta Amazônica. No mapa gerado pelo sistema, que utiliza uma escala de 1 : 50.000, essa região afetada apresenta as medidas de 4 cm de largura por 6 cm de comprimento. Preocupados com o impacto da perda da vegetação para a biodiversidade local, fiscais do IBAMA foram acionados para aplicar as sanções cabíveis. Qual é a área real total desmatada, em quilômetros quadrados km², que os fiscais encontraram ao chegar ao local?", "pre": "", "o": ["1,2 km².", "6,0 km²", "12,0 km²", "60,0 km²"], "a": 1, "e": "Escala 1:50.000: 4 cm → 200.000 cm = 2 km; 6 cm → 300.000 cm = 3 km. Área = 2 × 3 = 6 km².", "c": "g"}]}, {"n": "S1", "tema": "Simulado 1 · Desinformação e checagem de fatos", "textos": [{"label": "Texto 1", "titulo": "Antes de compartilhar, confira", "autor": "Por Marcos Vieira, jornalista (Opinião)", "paras": ["Basta um toque na tela para que uma notícia percorra o país em poucos minutos. O problema é que, muitas vezes, essa notícia nem sequer é verdadeira. Em plena era digital, a desinformação tornou-se um dos maiores desafios da democracia, porque ela confunde o cidadão, ameaça a saúde pública e fragiliza a confiança nas instituições.", "Uma pesquisa divulgada neste ano por um instituto de opinião revelou que 6 em cada 10 brasileiros já acreditaram em uma informação falsa e a repassaram aos amigos. Entre os jovens de 16 a 24 anos, o índice chegou a 72%. Os números mostram que o hábito de compartilhar sem conferir está disseminado.", "Há, entretanto, quem defenda que a culpa é apenas das plataformas digitais. Embora elas tenham grande responsabilidade, o leitor também precisa assumir o seu papel. Antes de repassar uma mensagem, é recomendável verificar a fonte, procurar a data da publicação e comparar o conteúdo com o de veículos confiáveis.", "Nesse cenário, a escola ocupa lugar decisivo. Se os estudantes aprenderem a analisar criticamente o que leem, tornar-se-ão cidadãos menos vulneráveis às mentiras que circulam na internet. Por isso, a educação midiática deveria ser tratada como prioridade nas políticas públicas.", "Em suma, combater a desinformação exige esforço conjunto: plataformas que removam conteúdos enganosos, governos que garantam leis eficazes e cidadãos que duvidem antes de compartilhar. Afinal, a liberdade de se informar só é plena quando a informação é verdadeira."]}, {"label": "Texto 2", "titulo": "Charge (descrição da imagem)", "autor": "", "paras": ["Dois jovens estão sentados em um sofá, cada um com o celular na mão. O primeiro diz: “Li num grupo que beber água com sal cura tudo!”. O segundo pergunta, sem tirar os olhos da tela: “Sério? Quem disse isso?”. O primeiro responde: “Ninguém sabe, mas já tem 3 mil compartilhamentos!”."]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["as plataformas digitais são as únicas responsáveis pela circulação de informações falsas.", "o hábito de repassar mensagens sem checá-las contribui para a disseminação da desinformação.", "os jovens estão menos expostos às mentiras que circulam na internet.", "a escola tem pouca influência na formação de leitores críticos."], "a": 1, "e": "O texto afirma que o leitor também precisa assumir seu papel e que o hábito de compartilhar sem conferir está disseminado. A) contradiz o 3º parágrafo (“apenas das plataformas”); C) contradiz os 72% entre jovens; D) contradiz o 4º parágrafo, que dá à escola um “lugar decisivo”.", "c": "I"}, {"q": "No último parágrafo do Texto 1, predomina a", "pre": "", "o": ["narração, pois os fatos são apresentados em ordem cronológica.", "descrição, pois as características de um objeto são detalhadas.", "argumentação, pois há um posicionamento conclusivo do autor.", "injunção, pois há uma sequência de instruções ao leitor."], "a": 2, "e": "O parágrafo retoma as ideias e conclui com posicionamento (“Em suma… Afinal…”). Não há sequência temporal de fatos (narração), nem caracterização de um objeto (descrição), nem instruções passo a passo (injunção).", "c": "G"}, {"q": "A intenção comunicativa predominante do Texto 1 é", "pre": "", "o": ["narrar um caso real de notícia falsa que circulou no país.", "informar, sem tomar partido, os resultados de uma pesquisa de opinião.", "ensinar, passo a passo, como criar conteúdos para a internet.", "defender que o combate à desinformação depende do esforço de todos."], "a": 3, "e": "O texto é um artigo de opinião: usa dados como argumento para sustentar a tese de que plataformas, governos, escola e cidadãos devem agir juntos. Os dados da pesquisa servem à argumentação, não são o objetivo final.", "c": "I"}, {"q": "De acordo com o Texto 1,", "pre": "", "o": ["entre os jovens de 16 a 24 anos, o índice de quem já acreditou e repassou informação falsa chega a 72%.", "a verificação da fonte é desnecessária quando a mensagem vem de amigos.", "as plataformas digitais já eliminaram os conteúdos enganosos.", "a educação midiática já é tratada como prioridade nas políticas públicas."], "a": 0, "e": "Informação literal do 2º parágrafo. D) está errada porque o texto diz que ela “deveria ser” prioridade, ou seja, ainda não é.", "c": "I"}, {"q": "Questões 5 a 7 – O termo PORQUE (1) introduz uma ideia de", "pre": "Em plena era digital, a desinformação tornou-se um dos maiores desafios da democracia, porque (1) ela confunde o cidadão (2), ameaça a saúde pública e fragiliza a confiança nas instituições.", "o": ["oposição.", "finalidade.", "condição.", "causa."], "a": 3, "e": "“Porque” apresenta o motivo pelo qual a desinformação é um grande desafio: ela confunde, ameaça e fragiliza. É relação de causa/explicação.", "c": "C"}, {"q": "O trecho é formado por", "pre": "", "o": ["um período simples.", "um período composto por quatro orações.", "dois períodos e quatro orações.", "um período composto por três orações."], "a": 1, "e": "Conte os verbos: (1) tornou-se; (2) confunde; (3) ameaça; (4) fragiliza. São quatro verbos = quatro orações, em um único período (só há um ponto final).", "c": "S"}, {"q": "O termo O CIDADÃO (2) exerce a função sintática de", "pre": "", "o": ["sujeito.", "adjunto adnominal.", "objeto direto.", "complemento nominal."], "a": 2, "e": "“Confunde” é verbo transitivo direto (quem confunde, confunde alguém). “O cidadão” completa o verbo sem preposição: objeto direto. O sujeito é “ela”.", "c": "S"}, {"q": "No Texto 1, são acentuadas pela mesma regra as palavras", "pre": "", "o": ["país e saúde.", "notícia e pública.", "notícia e país.", "saúde e pública."], "a": 0, "e": "País (pa-ís) e saúde (sa-ú-de) têm hiato com i/u tônicos: acentuam-se por essa regra. Notícia é paroxítona terminada em ditongo; pública é proparoxítona (todas são acentuadas).", "c": "A"}, {"q": "Um antônimo para a palavra VULNERÁVEIS (4º parágrafo) é", "pre": "", "o": ["frágeis.", "expostos.", "suscetíveis.", "resistentes."], "a": 3, "e": "Vulnerável = que pode ser facilmente atingido, frágil. O oposto é “resistente”. As demais são sinônimos.", "c": "M"}, {"q": "No 3º parágrafo, o termo ELAS (“Embora elas tenham grande responsabilidade”) retoma", "pre": "", "o": ["as mensagens.", "as plataformas digitais.", "os leitores.", "as instituições."], "a": 1, "e": "O parágrafo começa falando que “a culpa é apenas das plataformas digitais”. O pronome “elas” (feminino plural) retoma esse termo.", "c": "C"}, {"q": "A conjunção EMBORA (3º parágrafo) estabelece relação de", "pre": "", "o": ["conclusão.", "explicação.", "concessão.", "adição."], "a": 2, "e": "“Embora” admite um fato contrário (as plataformas têm responsabilidade) sem anular a ideia principal (o leitor também tem). Isso é concessão.", "c": "C"}, {"q": "No trecho “Há, entretanto, quem defenda que a culpa é apenas das plataformas digitais”, as vírgulas isolam", "pre": "", "o": ["termos de mesma função sintática.", "uma conjunção adversativa deslocada.", "um vocativo.", "uma oração adjetiva explicativa."], "a": 1, "e": "“Entretanto” é conjunção adversativa (= porém) que aparece no meio da oração, por isso fica entre vírgulas.", "c": "P"}, {"q": "No mesmo trecho, o verbo HAVER (“Há”)", "pre": "", "o": ["é impessoal e equivale a “existir”.", "é pessoal e concorda com “quem”.", "indica tempo decorrido.", "é auxiliar e forma tempo composto."], "a": 0, "e": "Haver com sentido de existir é impessoal (não tem sujeito): “Há quem defenda”. Por isso fica sempre na 3ª pessoa do singular.", "c": "V"}, {"q": "A forma verbal TORNAR-SE-ÃO (4º parágrafo) apresenta", "pre": "", "o": ["ênclise.", "próclise.", "mesóclise, pois o verbo está no futuro do presente e não há palavra atrativa.", "ênclise, pois o verbo está no pretérito."], "a": 2, "e": "O pronome está no meio do verbo (tornar-se-ão): mesóclise. Ela ocorre com verbos no futuro do presente ou do pretérito quando não há fator de próclise antes do verbo.", "c": "V"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["criticar o hábito de acreditar e compartilhar informações sem verificar a fonte.", "estimular o uso de remédios caseiros.", "informar sobre tratamentos médicos eficazes.", "elogiar a rapidez com que as notícias circulam."], "a": 0, "e": "A charge ironiza a situação: a “prova” de que a informação é verdadeira é o número de compartilhamentos, não a fonte. Há crítica ao hábito de não checar.", "c": "I"}, {"q": "Quanto à linguagem, o Texto 2 apresenta", "pre": "", "o": ["registro formal e técnico.", "variante histórica.", "registro informal, com marcas de oralidade.", "exclusivamente linguagem não verbal."], "a": 2, "e": "Expressões como “Li num grupo” e “Sério?” reproduzem a fala cotidiana. É linguagem coloquial/informal, adequada ao gênero charge.", "c": "L"}, {"q": "Os Textos 1 e 2 têm em comum", "pre": "", "o": ["o gênero textual.", "a tipologia predominante.", "a linguagem não verbal.", "o recorte temático."], "a": 3, "e": "Ambos tratam da desinformação e do compartilhamento irrefletido. O gênero (artigo de opinião × charge) e a tipologia são diferentes.", "c": "I"}, {"q": "O efeito crítico do Texto 2 decorre principalmente", "pre": "", "o": ["da concordância total entre os dois jovens.", "do contraste entre a ausência de uma fonte confiável e o grande número de compartilhamentos.", "da comparação entre remédios naturais e industrializados.", "da divergência de opiniões entre os amigos sobre saúde."], "a": 1, "e": "A fala “Ninguém sabe, mas já tem 3 mil compartilhamentos!” mostra o absurdo: ninguém sabe a origem, mas a informação se espalha. O “mas” marca o contraste que gera a crítica.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["editorial e cartum.", "notícia e infográfico.", "reportagem e tirinha.", "artigo de opinião e charge."], "a": 3, "e": "O Texto 1 é assinado e defende um ponto de vista (artigo de opinião). O Texto 2 usa humor para criticar um fato atual (charge).", "c": "G"}, {"q": "O vocábulo DESINFORMAÇÃO é formado por", "pre": "", "o": ["composição por justaposição.", "composição por aglutinação.", "derivação prefixal e sufixal.", "derivação parassintética."], "a": 2, "e": "Des- (prefixo) + informa- (radical) + -ção (sufixo). Não é parassintética, pois a palavra poderia surgir em etapas (informar → informação → desinformação).", "c": "F"}, {"q": "Uma notícia falsa foi compartilhada 3.400.000 vezes. Em notação científica, esse número é escrito como", "pre": "", "o": ["34 × 10<sup>5</sup>", "3,4 × 10<sup>7</sup>", "3,4 × 10<sup>6</sup>", "0,34 × 10<sup>6</sup>"], "a": 2, "e": "3.400.000 = 3,4 × 1.000.000 = 3,4 × 10<sup>6</sup>. Na notação científica o coeficiente fica entre 1 e 10; por isso A e D não servem.", "c": "n"}, {"q": "Em uma pesquisa com 1.500 pessoas, 60% disseram já ter acreditado em uma notícia falsa. O número de pessoas que disseram isso foi", "pre": "", "o": ["900.", "750.", "600.", "1.050."], "a": 0, "e": "60% de 1.500 = 0,6 × 1.500 = 900.", "c": "p"}, {"q": "Uma equipe de 4 checadores analisa um lote de notícias em 12 horas. Mantido o ritmo de cada um, 6 checadores analisariam o mesmo lote em", "pre": "", "o": ["6 horas.", "8 horas.", "9 horas.", "18 horas."], "a": 1, "e": "Mais pessoas, menos tempo: grandezas inversamente proporcionais. 4 × 12 = 6 × x → x = 48 ÷ 6 = 8 horas.", "c": "r"}, {"q": "Três perfis de checagem publicam alertas a cada 4, 6 e 10 horas e publicaram juntos às 8h. Os três voltarão a publicar juntos após", "pre": "", "o": ["30 horas.", "40 horas.", "60 horas.", "120 horas."], "a": 2, "e": "Calcula-se o MMC: 4 = 2², 6 = 2·3, 10 = 2·5. MMC = 2² · 3 · 5 = 60 horas.", "c": "m"}, {"q": "Um golpista ofereceu um empréstimo de R$ 2.000,00 a juros simples de 2,5% ao mês, por 8 meses. O valor dos juros é de", "pre": "", "o": ["R$ 300,00.", "R$ 400,00.", "R$ 480,00.", "R$ 2.400,00."], "a": 1, "e": "J = C · i · t = 2.000 × 0,025 × 8 = R$ 400,00. (R$ 2.400,00 é o montante, não os juros.)", "c": "j"}, {"q": "O custo de uma campanha de checagem é dado por C(x) = 300 + 15x, em que x é o número de cartazes impressos. Para 40 cartazes, o custo é de", "pre": "", "o": ["R$ 600,00.", "R$ 750,00.", "R$ 1.200,00.", "R$ 900,00."], "a": 3, "e": "C(40) = 300 + 15 × 40 = 300 + 600 = R$ 900,00.", "c": "f"}, {"q": "Um servidor tem formato de paralelepípedo reto-retângulo com 1,5 m de comprimento, 0,8 m de largura e 2 m de altura. Sua capacidade, em litros, é de", "pre": "", "o": ["2.400.", "240.", "24.000.", "4.300."], "a": 0, "e": "V = 1,5 × 0,8 × 2 = 2,4 m³. Como 1 m³ = 1.000 L, 2,4 m³ = 2.400 L.", "c": "e"}, {"q": "O número de notícias falsas desmentidas por uma agência em cinco dias foi: 12, 18, 15, 20 e 10. A média diária foi de", "pre": "", "o": ["12.", "13.", "14.", "15."], "a": 3, "e": "Soma = 12 + 18 + 15 + 20 + 10 = 75. Média = 75 ÷ 5 = 15.", "c": "t"}, {"q": "Em uma oficina de checagem de notícias com 250 alunos, 2/5 participaram da primeira etapa. O número de alunos que não participaram foi", "pre": "", "o": ["100.", "150.", "125.", "200."], "a": 1, "e": "Não participaram 3/5 do total: 3/5 × 250 = 150. (Ou: 2/5 de 250 = 100 participaram; 250 − 100 = 150.)", "c": "q"}, {"q": "Um cartaz foi desenhado na escala 1 : 25. Se a altura do cartaz no desenho é 4 cm, a altura real é de", "pre": "", "o": ["0,5 m.", "0,16 m.", "1,0 m.", "10 m."], "a": 2, "e": "Altura real = 4 × 25 = 100 cm = 1,0 m.", "c": "q"}, {"q": "Um terreno tem formato de triângulo retângulo com catetos de 9 m e 12 m. Ele será cercado com 3 fios de arame em volta. A quantidade de arame necessária é de", "pre": "", "o": ["108 m.", "36 m.", "72 m.", "135 m."], "a": 0, "e": "Hipotenusa: h² = 9² + 12² = 81 + 144 = 225 → h = 15 m. Perímetro = 9 + 12 + 15 = 36 m. Com 3 fios: 3 × 36 = 108 m.", "c": "g"}, {"q": "Três retas paralelas são cortadas por duas transversais. Na primeira transversal, os segmentos determinados medem 4 cm e 6 cm; na segunda, medem 10 cm e x. O valor de x é", "pre": "", "o": ["9 cm.", "12 cm.", "14 cm.", "15 cm."], "a": 3, "e": "Teorema de Tales: 4/6 = 10/x → 4x = 60 → x = 15 cm.", "c": "g"}, {"q": "Ana compartilhou o triplo de postagens de Bia. Juntas, compartilharam 120 postagens. O número de postagens compartilhadas por Ana foi", "pre": "", "o": ["30.", "60.", "90.", "100."], "a": 2, "e": "Bia = x; Ana = 3x. x + 3x = 120 → 4x = 120 → x = 30. Ana = 3 × 30 = 90.", "c": "x"}, {"q": "Em uma turma de 36 alunos, 24 sempre checam a fonte das notícias. A razão entre o número de alunos que não checam e o total da turma é", "pre": "", "o": ["2/3.", "1/3.", "1/2.", "3/4."], "a": 1, "e": "Não checam: 36 − 24 = 12. Razão = 12/36 = 1/3.", "c": "q"}, {"q": "Uma urna contém 20 cartões: 8 com notícias verdadeiras e 12 com notícias falsas. Sorteando um cartão ao acaso, a probabilidade de ele conter uma notícia falsa é", "pre": "", "o": ["3/5.", "2/5.", "1/2.", "3/8."], "a": 0, "e": "P = casos favoráveis / casos possíveis = 12/20 = 3/5.", "c": "b"}, {"q": "Uma escola vai montar kits iguais, sem sobras, com 48 cartilhas e 72 adesivos, usando o maior número possível de kits. O número de kits será", "pre": "", "o": ["8.", "12.", "18.", "24."], "a": 3, "e": "Pede-se o maior divisor comum: MDC(48, 72) = 24 (48 = 2⁴·3; 72 = 2³·3²; MDC = 2³·3 = 24).", "c": "m"}, {"q": "O alcance de uma postagem era de 200 visualizações. Aumentou 50% e, em seguida, diminuiu 50% sobre o novo valor. O alcance final foi de", "pre": "", "o": ["100.", "150.", "200.", "250."], "a": 1, "e": "200 + 50% = 300. Depois, 300 − 50% = 150. Os percentuais incidem sobre valores diferentes, por isso o resultado não volta a 200.", "c": "p"}, {"q": "Um cartaz circular tem 40 cm de diâmetro. Considerando π = 3,14, sua área, em cm², é de", "pre": "", "o": ["125,6.", "628.", "1.256.", "2.512."], "a": 2, "e": "Raio = 20 cm. A = π · r² = 3,14 × 400 = 1.256 cm².", "c": "g"}, {"q": "Um usuário pode escolher 1 entre 3 redes sociais e 1 entre 4 horários de postagem. O número de combinações possíveis é", "pre": "", "o": ["12.", "7.", "24.", "16."], "a": 0, "e": "Princípio multiplicativo: 3 × 4 = 12.", "c": "b"}, {"q": "Em uma palestra, o ingresso de adulto custou R$ 10,00 e o de estudante, R$ 4,00. Foram vendidos 30 ingressos, arrecadando R$ 180,00. O número de ingressos de adulto vendidos foi", "pre": "", "o": ["6.", "8.", "9.", "10."], "a": 3, "e": "Seja x o número de adultos: 10x + 4(30 − x) = 180 → 10x + 120 − 4x = 180 → 6x = 60 → x = 10.", "c": "x"}]}, {"n": "S2", "tema": "Simulado 2 · Tempo de tela e saúde mental dos adolescentes", "textos": [{"label": "Texto 1", "titulo": "Adolescentes passam mais de oito horas por dia diante de telas, aponta estudo", "autor": "Reportagem", "paras": ["Uma pesquisa feita com 3 mil estudantes de escolas públicas e privadas do Nordeste revelou que os adolescentes passam, em média, 8 horas e 20 minutos por dia diante de telas de celulares, tablets e computadores. O levantamento, divulgado nesta semana, foi conduzido por pesquisadores de uma universidade federal.", "Segundo o estudo, 45% dos entrevistados afirmaram dormir menos de seis horas por noite, e 38% disseram sentir ansiedade quando ficam sem o aparelho. Os pesquisadores observaram, ainda, que quem usa as redes sociais por mais de quatro horas diárias relata mais dificuldade de concentração nas aulas.", "“O problema não é a tecnologia em si, mas o uso excessivo e sem limites”, explica a psicóloga Helena Duarte, que coordenou a pesquisa. Ela lembra que a adolescência é uma fase de intensas mudanças, em que a comparação com os outros costuma causar sofrimento. Por isso, as imagens perfeitas que circulam nas redes podem alimentar a insegurança.", "Para os especialistas, a solução passa pelo diálogo. Pais e escolas devem estabelecer combinados, como horários sem celular, refeições em família e atividades ao ar livre. Algumas escolas já proíbem o uso do aparelho durante as aulas, e os professores relatam que os estudantes passaram a interagir mais nos intervalos.", "Os pesquisadores também recomendam que os jovens procurem ajuda quando perceberem que o uso das redes está prejudicando o sono, os estudos ou os relacionamentos. Os serviços de saúde das cidades oferecem acompanhamento psicológico gratuito."]}, {"label": "Texto 2", "titulo": "Tirinha (descrição da imagem)", "autor": "", "paras": ["<b>Quadro 1:</b> Um garoto de bermuda, na praia, diz a uma amiga: “Fui à praia hoje e não tirei nenhuma foto!”.", "<b>Quadro 2:</b> A amiga, surpresa, pergunta: “Sério? E como você vai provar que foi?”.", "<b>Quadro 3:</b> O garoto, pensativo, responde: “Eu... lembro?”.", "<b>Quadro 4:</b> A amiga, de olhos arregalados, comenta: “Pra mim, isso é viver só pra você mesmo!”."]}], "qs": [{"q": "Pelos dados do Texto 1, é possível inferir que", "pre": "", "o": ["o uso prolongado das telas pode estar associado a prejuízos no sono e na atenção dos adolescentes.", "o tempo de tela melhora o desempenho escolar dos estudantes.", "a ansiedade causada pela ausência do aparelho afeta apenas adultos.", "os pesquisadores defendem a proibição total da tecnologia."], "a": 0, "e": "Os dados mostram que 45% dormem menos de seis horas e que quem usa redes por mais de quatro horas tem mais dificuldade de concentração. A psicóloga afirma que o problema “não é a tecnologia em si”, o que descarta D.", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["artigo de opinião.", "editorial.", "reportagem.", "crônica."], "a": 2, "e": "Texto informativo, com dados de pesquisa, citação de especialista e aprofundamento do assunto: reportagem. Artigo e editorial defendem pontos de vista; crônica é narrativa de fatos do cotidiano.", "c": "G"}, {"q": "No Texto 1, predomina a sequência textual", "pre": "", "o": ["narrativa, pois relata fatos em ordem cronológica.", "injuntiva, pois ordena ações ao leitor.", "expositiva, pois apresenta e explica dados e informações.", "descritiva, pois caracteriza detalhadamente uma pessoa."], "a": 2, "e": "O texto apresenta resultados, percentuais e explicações de especialistas, característicos da sequência expositiva (informativa).", "c": "G"}, {"q": "De acordo com a psicóloga Helena Duarte,", "pre": "", "o": ["a tecnologia deve ser abolida da vida dos jovens.", "o uso de redes sociais é sempre positivo.", "os adolescentes não sofrem influência das imagens das redes.", "o problema está no uso excessivo e sem limites, e não na tecnologia em si."], "a": 3, "e": "Informação literal do 3º parágrafo.", "c": "I"}, {"q": "No 3º parágrafo, as aspas são usadas para indicar", "pre": "", "o": ["ironia do repórter.", "uma palavra estrangeira.", "a fala literal (discurso direto) da especialista.", "uma gíria."], "a": 2, "e": "As aspas reproduzem exatamente as palavras da psicóloga, o que dá credibilidade à reportagem (citação de fonte especializada).", "c": "P"}, {"q": "Questões 6 a 9 – O QUE (1) é", "pre": "Os pesquisadores observaram, ainda, que (1) quem usa as redes sociais por mais de quatro horas diárias relata (2) mais dificuldade de concentração nas aulas.", "o": ["pronome relativo.", "conjunção integrante.", "pronome interrogativo.", "conjunção causal."], "a": 1, "e": "Ele introduz a oração que completa o verbo “observaram” (observaram algo). É conjunção subordinativa integrante.", "c": "S"}, {"q": "A oração iniciada pelo QUE (1) classifica-se como subordinada", "pre": "", "o": ["substantiva subjetiva.", "adjetiva restritiva.", "substantiva completiva nominal.", "substantiva objetiva direta."], "a": 3, "e": "Pergunta-se ao verbo: os pesquisadores observaram o quê? “Que quem usa as redes… relata…”. Responde ao verbo sem preposição: objetiva direta.", "c": "S"}, {"q": "Em relação ao verbo RELATA (2), o trecho “quem usa as redes sociais por mais de quatro horas diárias” exerce a função de", "pre": "", "o": ["objeto direto.", "adjunto adnominal.", "sujeito.", "agente da passiva."], "a": 2, "e": "Quem relata dificuldade de concentração? “Quem usa as redes sociais por mais de quatro horas diárias”. É o sujeito do verbo.", "c": "S"}, {"q": "As vírgulas que isolam a palavra AINDA no trecho indicam", "pre": "", "o": ["separação de termos de mesma função.", "isolamento de um vocativo.", "isolamento de um aposto.", "isolamento de uma palavra ou expressão intercalada na oração."], "a": 3, "e": "“Ainda” (= além disso) é uma palavra de acréscimo que aparece no meio da oração, e termos intercalados são separados por vírgulas.", "c": "P"}, {"q": "No 1º parágrafo, a palavra LEVANTAMENTO é sinônima, no contexto, de", "pre": "", "o": ["reclamação.", "proibição.", "pesquisa.", "reunião."], "a": 2, "e": "“O levantamento, divulgado nesta semana, foi conduzido por pesquisadores”: o termo equivale a pesquisa (coleta de dados).", "c": "M"}, {"q": "No 3º parágrafo, o termo ELA (“Ela lembra que a adolescência…”) retoma", "pre": "", "o": ["a pesquisa.", "a tecnologia.", "a adolescência.", "a psicóloga Helena Duarte."], "a": 3, "e": "A frase anterior termina com a psicóloga que coordenou a pesquisa. “Ela” (3ª pessoa do singular feminino) refere-se a ela.", "c": "C"}, {"q": "No 3º parágrafo, a expressão POR ISSO estabelece relação de", "pre": "", "o": ["oposição.", "conclusão.", "concessão.", "adição."], "a": 1, "e": "“Por isso” introduz a consequência do que foi dito antes (a comparação causa sofrimento → as imagens perfeitas podem alimentar a insegurança): conclusão/consequência.", "c": "C"}, {"q": "No trecho “não é a tecnologia em si, mas o uso excessivo”, a palavra MAS estabelece relação de", "pre": "", "o": ["oposição (retificação).", "causa.", "finalidade.", "explicação."], "a": 0, "e": "“Mas” é conjunção adversativa: corrige a ideia anterior e apresenta o ponto de vista contrário (o problema é o excesso, não a tecnologia).", "c": "C"}, {"q": "Têm acento gráfico pela mesma regra as palavras", "pre": "", "o": ["psicóloga e média.", "média e adolescência.", "psicóloga e adolescência.", "tecnologia e psicóloga."], "a": 1, "e": "Média e adolescência são paroxítonas terminadas em ditongo (-ia, -ncia). Psicóloga é proparoxítona. Tecnologia não tem acento.", "c": "A"}, {"q": "O vocábulo PESQUISADORES é formado por", "pre": "", "o": ["derivação prefixal.", "derivação parassintética.", "composição por justaposição.", "derivação sufixal."], "a": 3, "e": "Pesquisa + sufixo -dor (+ -es, plural). Só há acréscimo de sufixo.", "c": "F"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["criticar a necessidade de registrar e exibir nas redes tudo o que se vive.", "incentivar o uso de câmeras de celular.", "informar sobre os melhores destinos de praia.", "elogiar a memória dos jovens."], "a": 0, "e": "A tirinha ironiza quem só considera real uma experiência se ela for provada com fotos. A fala final da amiga reforça a crítica.", "c": "I"}, {"q": "A leitura do Texto 2 permite inferir que", "pre": "", "o": ["os jovens valorizam mais a experiência vivida do que o registro.", "viver uma experiência pode ficar em segundo plano diante da necessidade de mostrá-la nas redes.", "a praia é o único lugar em que não se usa o celular.", "a amiga considera as fotos desnecessárias."], "a": 1, "e": "O espanto da amiga mostra que, para ela, sem foto não há prova. A tirinha critica essa lógica. A) e D) são o oposto; C) não tem base no texto.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["artigo de opinião e charge.", "reportagem e tirinha.", "notícia e cartum.", "editorial e cartaz."], "a": 1, "e": "O Texto 1 é uma reportagem. O Texto 2 tem quadros sequenciais, personagens e diálogos com humor: é tirinha (a charge é de um único quadro, com crítica a fato atual específico).", "c": "G"}, {"q": "No Texto 2, o uso da forma PRA (“Pra mim”) em lugar de “para” caracteriza", "pre": "", "o": ["linguagem formal.", "registro informal, com marcas de oralidade.", "variante histórica.", "erro de ortografia."], "a": 1, "e": "Em situações de fala espontânea, a redução “para” → “pra” é comum. A tirinha reproduz a oralidade, adequada ao gênero. Não é “erro”, e sim marca de registro informal.", "c": "L"}, {"q": "No Texto 2, as reticências em “Eu... lembro?” indicam", "pre": "", "o": ["hesitação, dúvida do personagem.", "ênfase em uma ordem.", "enumeração de itens.", "fim da narrativa."], "a": 0, "e": "As reticências sugerem pausa, hesitação: o garoto percebe que só tem a lembrança como prova.", "c": "P"}, {"q": "Um aplicativo tem 2.500.000 usuários. Esse número, em notação científica, é", "pre": "", "o": ["2,5 × 10<sup>6</sup>", "25 × 10<sup>5</sup>", "2,5 × 10<sup>5</sup>", "0,25 × 10<sup>7</sup>"], "a": 0, "e": "2.500.000 = 2,5 × 1.000.000 = 2,5 × 10<sup>6</sup>. O coeficiente deve estar entre 1 e 10.", "c": "n"}, {"q": "Segundo o Texto 1, o tempo médio diário de tela é de 8 h 20 min. Em 7 dias, o tempo total de tela é de", "pre": "", "o": ["56 h 20 min.", "58 h 40 min.", "58 h 20 min.", "60 h 20 min."], "a": 2, "e": "8 h × 7 = 56 h e 20 min × 7 = 140 min = 2 h 20 min. Total: 56 h + 2 h 20 min = 58 h 20 min.", "c": "q"}, {"q": "Segundo o Texto 1, 45% dos 3.000 estudantes entrevistados dormem menos de seis horas por noite. O número de estudantes nessa situação é", "pre": "", "o": ["1.200.", "1.450.", "1.500.", "1.350."], "a": 3, "e": "45% de 3.000 = 0,45 × 3.000 = 1.350.", "c": "p"}, {"q": "João passa o dobro de horas diárias de tela de Maria. Juntos, os dois passam 9 horas por dia. O tempo de João é de", "pre": "", "o": ["3 horas.", "6 horas.", "5 horas.", "4 horas."], "a": 1, "e": "Maria = x; João = 2x. x + 2x = 9 → x = 3. João = 2 × 3 = 6 horas.", "c": "x"}, {"q": "Um aplicativo consome 450 MB de dados em 3 dias de uso. Mantendo o mesmo consumo diário, em 7 dias consumirá", "pre": "", "o": ["900 MB.", "1.050 MB.", "1.350 MB.", "1.200 MB."], "a": 1, "e": "Regra de três direta: 450 → 3 dias; x → 7 dias. x = 450 × 7 ÷ 3 = 1.050 MB. (Consumo diário: 150 MB × 7 = 1.050.)", "c": "r"}, {"q": "O tempo de tela de uma aluna, em horas, nos seis dias da semana foi: 6, 8, 9, 5, 7 e 7. A média diária foi de", "pre": "", "o": ["6.", "9.", "8.", "7."], "a": 3, "e": "Soma = 6 + 8 + 9 + 5 + 7 + 7 = 42. Média = 42 ÷ 6 = 7 horas.", "c": "t"}, {"q": "Um fone foi comprado por R$ 600,00 a juros simples de 3% ao mês, durante 5 meses. O valor total dos juros é de", "pre": "", "o": ["R$ 90,00.", "R$ 108,00.", "R$ 150,00.", "R$ 690,00."], "a": 0, "e": "J = 600 × 0,03 × 5 = R$ 90,00. (R$ 690,00 é o montante.)", "c": "j"}, {"q": "Um plano de internet custa P(x) = 40 + 2x reais, em que x é o número de GB excedentes. Para 15 GB excedentes, o valor é de", "pre": "", "o": ["R$ 55,00.", "R$ 80,00.", "R$ 70,00.", "R$ 100,00."], "a": 2, "e": "P(15) = 40 + 2 × 15 = 40 + 30 = R$ 70,00.", "c": "f"}, {"q": "Em uma turma de 40 alunos, 3/8 usam o celular nos intervalos para jogar. O número de alunos que jogam é", "pre": "", "o": ["12.", "18.", "15.", "20."], "a": 2, "e": "3/8 de 40 = 3 × 40 ÷ 8 = 15.", "c": "q"}, {"q": "Em uma sala, a razão entre o número de meninas e o de meninos é 3 : 2. Se há 35 alunos no total, o número de meninas é", "pre": "", "o": ["21.", "15.", "14.", "20."], "a": 0, "e": "3k + 2k = 35 → k = 7. Meninas = 3 × 7 = 21 (e meninos = 14).", "c": "q"}, {"q": "Dois lembretes de pausa digital tocam, respectivamente, de 45 em 45 minutos e de 60 em 60 minutos. Se tocaram juntos às 14h, tocarão juntos novamente às", "pre": "", "o": ["15h.", "16h.", "18h.", "17h."], "a": 3, "e": "MMC(45, 60) = 180 minutos = 3 horas (45 = 3²·5; 60 = 2²·3·5 → 2²·3²·5 = 180). 14h + 3 h = 17h.", "c": "m"}, {"q": "Uma escola vai dividir 60 alunos do 9º A e 84 do 9º B em grupos com o mesmo número de alunos, o maior possível, sem misturar as turmas. Cada grupo terá", "pre": "", "o": ["6 alunos.", "12 alunos.", "14 alunos.", "24 alunos."], "a": 1, "e": "MDC(60, 84) = 12 (60 = 2²·3·5; 84 = 2²·3·7 → MDC = 2²·3 = 12).", "c": "m"}, {"q": "Uma sala de estudos retangular, sem celulares, mede 8 m por 5 m. Ela será coberta com peças de cerâmica quadradas de 0,5 m de lado. O número de peças necessário é", "pre": "", "o": ["80.", "120.", "160.", "200."], "a": 2, "e": "Área da sala = 8 × 5 = 40 m². Área de cada peça = 0,5 × 0,5 = 0,25 m². 40 ÷ 0,25 = 160 peças.", "c": "g"}, {"q": "Uma escada de 5 m está apoiada em uma parede, com a base a 3 m da parede. A altura atingida na parede é de", "pre": "", "o": ["4 m.", "3 m.", "5 m.", "8 m."], "a": 0, "e": "Triângulo retângulo com hipotenusa 5 e cateto 3: x² + 3² = 5² → x² = 16 → x = 4 m (terno pitagórico 3-4-5).", "c": "g"}, {"q": "Em um grupo de 30 alunos, 12 usam fones de ouvido na escola. Sorteando um aluno ao acaso, a probabilidade de ele usar fones é de", "pre": "", "o": ["12/18.", "3/5.", "1/2.", "2/5."], "a": 3, "e": "P = 12/30 = 2/5.", "c": "b"}, {"q": "O tempo diário de tela de um jovem passou de 5 h para 6 h 30 min. O aumento percentual foi de", "pre": "", "o": ["15%.", "30%.", "25%.", "20%."], "a": 1, "e": "Aumento = 1 h 30 min = 1,5 h. 1,5 ÷ 5 = 0,3 = 30%.", "c": "p"}, {"q": "Um reservatório cilíndrico tem 1 m de raio e 2 m de altura. Considerando π = 3,14, seu volume, em litros, é de", "pre": "", "o": ["628.", "6.280.", "12.560.", "3.140."], "a": 1, "e": "V = π · r² · h = 3,14 × 1² × 2 = 6,28 m³ = 6.280 litros.", "c": "e"}, {"q": "Em uma gincana sem celular, o ingresso de aluno custou R$ 5,00 e o de adulto, R$ 12,00. Foram vendidos 40 ingressos, somando R$ 270,00. O número de ingressos de aluno vendidos foi", "pre": "", "o": ["20.", "25.", "30.", "35."], "a": 2, "e": "Seja x o número de alunos: 5x + 12(40 − x) = 270 → 5x + 480 − 12x = 270 → −7x = −210 → x = 30.", "c": "x"}, {"q": "Uma senha de 3 dígitos distintos será formada com os algarismos 1, 2, 3, 4 e 5. O número de senhas possíveis é", "pre": "", "o": ["15.", "120.", "125.", "60."], "a": 3, "e": "Sem repetição: 5 × 4 × 3 = 60. (125 seria se os dígitos pudessem repetir: 5 × 5 × 5.)", "c": "b"}, {"q": "Em um mapa na escala 1 : 200.000, a distância entre duas cidades é de 3 cm. A distância real é de", "pre": "", "o": ["6 km.", "0,6 km.", "60 km.", "600 km."], "a": 0, "e": "3 × 200.000 = 600.000 cm = 6.000 m = 6 km.", "c": "q"}]}, {"n": "S3", "tema": "Simulado 3 · Energias renováveis e desenvolvimento sustentável no Rio Grande do Norte", "textos": [{"label": "Texto 1", "titulo": "Vento e sol: o futuro do Rio Grande do Norte", "autor": "Editorial", "paras": ["O Rio Grande do Norte é, há alguns anos, o maior produtor de energia eólica do país. Os ventos constantes do litoral e do interior, que (1) antes eram vistos apenas como característica do clima, transformaram-se em riqueza. Além disso, a forte incidência de sol ao longo do ano coloca o estado em posição privilegiada também na produção de energia solar.", "Esse potencial, no entanto, precisa ser aproveitado com responsabilidade. Parques eólicos e usinas solares geram empregos e atraem investimentos, mas podem causar impactos quando instalados sem diálogo com as comunidades locais. Pescadores, agricultores e populações tradicionais têm o direito de ser ouvidos antes que qualquer obra comece.", "Outro desafio é garantir que os benefícios cheguem à população. De que adianta ser referência na geração de energia se muitas famílias ainda pagam contas altas e vivem com o fornecimento instável? Cabe ao poder público incentivar a energia solar em residências, escolas e hospitais, reduzindo gastos e levando sustentabilidade ao cotidiano.", "Por fim, é indispensável investir na formação de profissionais. Cursos técnicos, como os oferecidos pelo IFRN, preparam jovens para atuar na instalação e na manutenção dos equipamentos, o que pode transformar a vida de milhares de famílias.", "Portanto, o estado deve seguir na liderança das energias limpas, desde que o desenvolvimento seja justo, participativo e sustentável."]}, {"label": "Texto 2", "titulo": "Infográfico: como funciona a energia solar fotovoltaica", "autor": "", "paras": ["<b>1. Captação:</b> os painéis recebem a luz do sol e a transformam em corrente elétrica contínua.", "<b>2. Conversão:</b> o inversor converte a corrente contínua em corrente alternada, a que é usada nas casas.", "<b>3. Distribuição:</b> a energia passa pelo quadro elétrico e abastece os aparelhos.", "<b>4. Economia:</b> o excesso é enviado à rede da distribuidora e vira créditos na conta de luz."]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["o Rio Grande do Norte deve abandonar a produção de energia eólica.", "o desenvolvimento energético só será positivo se respeitar as comunidades e beneficiar a população.", "as populações tradicionais são contrárias a qualquer obra de energia.", "o poder público não tem responsabilidade sobre o uso da energia solar."], "a": 1, "e": "O texto defende desenvolvimento “justo, participativo e sustentável” e destaca que as comunidades devem ser ouvidas e a população beneficiada. As demais afirmações não têm base no texto (ou o contradizem).", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 configura-se como", "pre": "", "o": ["reportagem.", "notícia.", "editorial.", "artigo científico."], "a": 2, "e": "Texto sem assinatura individual, que expressa o ponto de vista do veículo de comunicação sobre um assunto atual: editorial.", "c": "G"}, {"q": "Quanto à tipologia, o Texto 1 é predominantemente", "pre": "", "o": ["narrativo.", "descritivo.", "expositivo.", "argumentativo."], "a": 3, "e": "O texto defende uma tese (o estado deve liderar as energias limpas com justiça e participação) e a sustenta com argumentos e propostas: tipologia argumentativa.", "c": "G"}, {"q": "No 3º parágrafo, o autor", "pre": "", "o": ["alerta que ser referência em geração não garante benefícios diretos às famílias.", "elogia sem restrições a situação energética do estado.", "propõe a proibição da energia solar em residências.", "afirma que o fornecimento de energia no estado é estável."], "a": 0, "e": "A pergunta “De que adianta ser referência… se muitas famílias ainda pagam contas altas…?” expressa o alerta de que a produção por si só não resolve o problema da população.", "c": "I"}, {"q": "No 3º parágrafo, a pergunta “De que adianta ser referência na geração de energia…?” é uma pergunta retórica, pois", "pre": "", "o": ["exige uma resposta imediata do leitor.", "pede uma informação ao leitor.", "serve para convidar o leitor a refletir e reforça o argumento do autor.", "indica que o autor tem dúvida."], "a": 2, "e": "A pergunta retórica não busca resposta: é uma estratégia argumentativa que leva o leitor à conclusão desejada pelo autor.", "c": "I"}, {"q": "Questões 6 a 9 – No trecho “Os ventos constantes do litoral e do interior, que (1) antes eram vistos apenas como característica do clima, transformaram-se em riqueza”, o QUE (1) é"
