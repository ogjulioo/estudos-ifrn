, "pre": "", "o": ["pronome relativo.", "conjunção integrante.", "conjunção causal.", "pronome interrogativo."], "a": 0, "e": "Substitui “os ventos” e liga duas orações: pronome relativo (= os quais).", "c": "S"}, {"q": "A oração iniciada por “que antes eram vistos apenas como característica do clima” é subordinada", "pre": "", "o": ["adjetiva restritiva.", "adverbial causal.", "substantiva objetiva direta.", "adjetiva explicativa."], "a": 3, "e": "Está entre vírgulas e apenas acrescenta uma informação sobre os ventos (que já são conhecidos, “constantes”), sem restringi-los: adjetiva explicativa.", "c": "S"}, {"q": "A locução verbal “eram vistos” está na voz", "pre": "", "o": ["ativa.", "passiva analítica.", "passiva sintética.", "reflexiva."], "a": 1, "e": "Verbo auxiliar (ser) + particípio (visto): voz passiva analítica. O sujeito (os ventos) sofre a ação.", "c": "V"}, {"q": "No mesmo trecho, a palavra APENAS expressa ideia de", "pre": "", "o": ["inclusão.", "retificação.", "explicação.", "limitação (exclusão)."], "a": 3, "e": "“Apenas” restringe: antes os ventos eram vistos somente como característica do clima, nada além disso. É palavra denotativa de exclusão/limitação.", "c": "M"}, {"q": "No 2º parágrafo, a expressão NO ENTANTO estabelece relação de", "pre": "", "o": ["oposição.", "conclusão.", "adição.", "explicação."], "a": 0, "e": "“No entanto” equivale a “porém”: contrapõe a ideia de grande potencial à necessidade de responsabilidade. É conjunção adversativa.", "c": "C"}, {"q": "No 1º parágrafo, a expressão ALÉM DISSO introduz uma ideia de", "pre": "", "o": ["finalidade.", "oposição.", "adição.", "concessão."], "a": 2, "e": "“Além disso” acrescenta mais um argumento (o sol também coloca o estado em posição privilegiada).", "c": "C"}, {"q": "No 1º parágrafo, a palavra PRIVILEGIADA pode ser substituída, sem prejuízo de sentido, por", "pre": "", "o": ["prejudicada.", "favorecida.", "distante.", "limitada."], "a": 1, "e": "Posição privilegiada = vantajosa, favorecida.", "c": "M"}, {"q": "Um antônimo para INDISPENSÁVEL (4º parágrafo) é", "pre": "", "o": ["essencial.", "necessário.", "fundamental.", "dispensável."], "a": 3, "e": "Indispensável = que não se pode dispensar. Antônimo: dispensável. As outras três são sinônimos.", "c": "M"}, {"q": "No 2º parágrafo, a expressão ESSE POTENCIAL retoma", "pre": "", "o": ["a capacidade do estado de produzir energia eólica e solar.", "os impactos causados nas comunidades.", "os empregos gerados pelas usinas.", "o direito de ser ouvido."], "a": 0, "e": "O pronome demonstrativo “esse” retoma o que foi apresentado no 1º parágrafo: a capacidade de gerar energia dos ventos e do sol.", "c": "C"}, {"q": "O acento gráfico em TÊM (“Pescadores, agricultores e populações tradicionais têm o direito”) justifica-se para", "pre": "", "o": ["indicar a 3ª pessoa do singular.", "marcar uma palavra proparoxítona.", "diferenciar a 3ª pessoa do plural da 3ª pessoa do singular (tem).", "indicar crase."], "a": 2, "e": "Acento diferencial: tem (singular) × têm (plural). O sujeito “pescadores, agricultores e populações” está no plural.", "c": "A"}, {"q": "O vocábulo FOTOVOLTAICA (Texto 2) é formado por", "pre": "", "o": ["derivação prefixal.", "composição por justaposição.", "composição por aglutinação.", "derivação sufixal."], "a": 1, "e": "Foto (luz) + voltaica: dois radicais unidos sem perda de fonemas, o que caracteriza composição por justaposição.", "c": "F"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["explicar, passo a passo, o funcionamento da energia solar fotovoltaica.", "criticar o alto custo da energia solar.", "convencer o leitor a abandonar a energia eólica.", "narrar a história de uma usina solar."], "a": 0, "e": "O infográfico é um gênero informativo/explicativo: organiza em etapas numeradas o processo de produção e uso da energia solar.", "c": "I"}, {"q": "No Texto 2, predominam", "pre": "", "o": ["linguagem poética e verbos no pretérito.", "linguagem opinativa, com marcas de subjetividade.", "gírias e marcas de oralidade.", "linguagem formal, denotativa e verbos no presente do indicativo."], "a": 3, "e": "Verbos como “recebem”, “converte”, “passa”, “é enviado” (presente) e linguagem objetiva (sentido literal) caracterizam textos explicativos.", "c": "L"}, {"q": "A relação entre os Textos 1 e 2 é a de que", "pre": "", "o": ["o Texto 2 contradiz o Texto 1.", "ambos criticam o uso de energia eólica.", "o Texto 2 detalha tecnicamente a energia solar mencionada no Texto 1.", "ambos são narrativos."], "a": 2, "e": "O Texto 1 defende o incentivo à energia solar; o Texto 2 explica como ela funciona. Os textos se complementam.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["reportagem e charge.", "editorial e infográfico.", "artigo de opinião e cartaz.", "notícia e tirinha."], "a": 1, "e": "Texto 1: editorial (opinião do veículo). Texto 2: infográfico (texto verbal e visual que explica um processo).", "c": "G"}, {"q": "O consumo de energia de um parque industrial foi de 120.000.000 kWh em um ano. Em notação científica, esse valor é", "pre": "", "o": ["12 × 10<sup>7</sup>", "1,2 × 10<sup>7</sup>", "1,2 × 10<sup>8</sup>", "0,12 × 10<sup>9</sup>"], "a": 2, "e": "120.000.000 = 1,2 × 100.000.000 = 1,2 × 10<sup>8</sup>. O coeficiente deve estar entre 1 e 10 (por isso 12 e 0,12 não servem).", "c": "n"}, {"q": "Uma conta de luz de R$ 400,00 teve redução de 85% após a instalação de painéis solares. O novo valor da conta é de", "pre": "", "o": ["R$ 60,00.", "R$ 85,00.", "R$ 340,00.", "R$ 15,00."], "a": 0, "e": "Redução = 85% de 400 = R$ 340,00. Nova conta = 400 − 340 = R$ 60,00 (ou 15% de 400).", "c": "p"}, {"q": "Um sistema solar de R$ 18.000,00 foi financiado a juros simples de 1,5% ao mês, por 10 meses. O valor dos juros é de", "pre": "", "o": ["R$ 270,00.", "R$ 20.700,00.", "R$ 2.970,00.", "R$ 2.700,00."], "a": 3, "e": "J = 18.000 × 0,015 × 10 = R$ 2.700,00. (20.700 é o montante.)", "c": "j"}, {"q": "Um painel solar gera 1,2 kWh em 4 horas de sol. Mantido o ritmo, em 10 horas ele gerará", "pre": "", "o": ["2,4 kWh.", "3 kWh.", "4,8 kWh.", "12 kWh."], "a": 1, "e": "Regra de três direta: 1,2 ÷ 4 = 0,3 kWh por hora. Em 10 horas: 0,3 × 10 = 3 kWh.", "c": "r"}, {"q": "O custo mensal de manutenção de painéis é C(x) = 1.200 + 350x, em reais, sendo x o número de painéis. Para 20 painéis, o custo é de", "pre": "", "o": ["R$ 7.000,00.", "R$ 8.200,00.", "R$ 8.500,00.", "R$ 1.550,00."], "a": 1, "e": "C(20) = 1.200 + 350 × 20 = 1.200 + 7.000 = R$ 8.200,00.", "c": "f"}, {"q": "Duas turbinas são revisadas a cada 15 e a cada 20 dias, respectivamente. Se foram revisadas juntas hoje, voltarão a ser revisadas juntas daqui a", "pre": "", "o": ["60 dias.", "45 dias.", "30 dias.", "300 dias."], "a": 0, "e": "MMC(15, 20): 15 = 3·5; 20 = 2²·5 → 2²·3·5 = 60 dias.", "c": "m"}, {"q": "Um terreno retangular de 40 m por 25 m terá 60% de sua área ocupada por painéis solares de 2 m² cada. O número de painéis é", "pre": "", "o": ["600.", "500.", "300.", "250."], "a": 2, "e": "Área = 40 × 25 = 1.000 m². 60% = 600 m². 600 ÷ 2 = 300 painéis.", "c": "g"}, {"q": "Um cabo de sustentação de uma torre está fixado a 12 m de altura e a 9 m da base da torre, formando um triângulo retângulo. O comprimento do cabo é de", "pre": "", "o": ["13 m.", "21 m.", "18 m.", "15 m."], "a": 3, "e": "c² = 12² + 9² = 144 + 81 = 225 → c = 15 m (terno 3-4-5 multiplicado por 3).", "c": "g"}, {"q": "Um reservatório para limpeza de painéis tem formato de cubo com 1,5 m de aresta. Sua capacidade, em litros, é de", "pre": "", "o": ["3.375.", "2.250.", "337,5.", "4.500."], "a": 0, "e": "V = 1,5³ = 3,375 m³ = 3.375 litros (1 m³ = 1.000 L).", "c": "e"}, {"q": "Uma escola economizou 2/5 de uma conta de energia de R$ 3.500,00 após instalar energia solar. O valor economizado foi de", "pre": "", "o": ["R$ 1.050,00.", "R$ 2.100,00.", "R$ 1.750,00.", "R$ 1.400,00."], "a": 3, "e": "2/5 de 3.500 = 2 × 3.500 ÷ 5 = 7.000 ÷ 5 = R$ 1.400,00.", "c": "q"}, {"q": "A produção mensal de um parque, em MWh, nos quatro primeiros meses do ano foi: 40, 52, 48 e 60. A média mensal foi de", "pre": "", "o": ["48.", "50.", "52.", "55."], "a": 1, "e": "Soma = 40 + 52 + 48 + 60 = 200. Média = 200 ÷ 4 = 50 MWh.", "c": "t"}, {"q": "A soma das potências de dois aerogeradores é 7 MW, e um deles tem 1 MW a mais que o outro. A potência do maior é", "pre": "", "o": ["3 MW.", "3,5 MW.", "4 MW.", "5 MW."], "a": 2, "e": "x + (x + 1) = 7 → 2x = 6 → x = 3. O maior tem 3 + 1 = 4 MW.", "c": "x"}, {"q": "Uma maquete de torre foi feita na escala 1 : 100. Se a altura da torre na maquete é de 80 cm, a altura real é de", "pre": "", "o": ["0,8 m.", "8 m.", "800 m.", "80 m."], "a": 3, "e": "80 × 100 = 8.000 cm = 80 m.", "c": "q"}, {"q": "Um painel de R$ 1.000,00 recebeu um desconto de 10% e, depois, mais 10% sobre o novo preço. O preço final foi de", "pre": "", "o": ["R$ 810,00.", "R$ 800,00.", "R$ 900,00.", "R$ 820,00."], "a": 0, "e": "1.000 − 10% = 900. Depois, 900 − 10% = 810. Os descontos sucessivos não somam 20% (que daria R$ 800,00).", "c": "p"}, {"q": "Um mês tem 30 dias, dos quais 18 foram ensolarados. Sorteando um dia ao acaso, a probabilidade de ter sido ensolarado é de", "pre": "", "o": ["2/5.", "1/2.", "18/12.", "3/5."], "a": 3, "e": "P = 18/30 = 3/5.", "c": "b"}, {"q": "Uma empresa dispõe de 3 modelos de painéis e 2 modelos de inversores. O número de combinações possíveis de um painel com um inversor é", "pre": "", "o": ["5.", "8.", "6.", "9."], "a": 2, "e": "Princípio multiplicativo: 3 × 2 = 6.", "c": "b"}, {"q": "A pá de um aerogerador tem 40 m de comprimento e gira em torno de um eixo, descrevendo um círculo de raio 40 m. Com π = 3,14, a área do círculo varrido é de", "pre": "", "o": ["1.256 m².", "5.024 m².", "2.512 m².", "10.048 m²."], "a": 1, "e": "A = π r² = 3,14 × 40² = 3,14 × 1.600 = 5.024 m².", "c": "g"}, {"q": "Um parque tem 14 aerogeradores de dois modelos: o modelo A produz 2 MW e o modelo B, 3 MW. A produção total é de 34 MW. O número de aerogeradores do modelo B é", "pre": "", "o": ["4.", "8.", "6.", "10."], "a": 2, "e": "Seja x o número do modelo A: 2x + 3(14 − x) = 34 → 42 − x = 34 → x = 8. Então B = 14 − 8 = 6. (Conferindo: 8×2 + 6×3 = 16 + 18 = 34.)", "c": "x"}, {"q": "As potências instaladas (em MW) de cinco usinas são: 12, 8, 20, 15 e 10. A mediana desses valores é", "pre": "", "o": ["10.", "12.", "13,0.", "15."], "a": 1, "e": "Ordenando: 8, 10, 12, 15, 20. O valor central (3º) é 12.", "c": "t"}, {"q": "No mesmo instante, um poste projeta uma sombra de 6 m e uma vara de 2 m projeta uma sombra de 1,5 m. A altura do poste é de", "pre": "", "o": ["8 m.", "7 m.", "6 m.", "9 m."], "a": 0, "e": "Triângulos semelhantes: H/6 = 2/1,5 → H = 12 ÷ 1,5 = 8 m.", "c": "g"}]}, {"n": "S4", "tema": "Simulado 4 · Mobilidade urbana, bicicletas e transporte coletivo", "textos": [{"label": "Texto 1", "titulo": "Cidades apostam em ciclovias e transporte coletivo para destravar o trânsito", "autor": "Reportagem", "paras": ["Em muitas cidades brasileiras, o trânsito se tornou sinônimo de estresse e de atraso. Segundo levantamento de uma entidade de mobilidade urbana, o trabalhador de uma grande capital gasta, em média, 2 horas por dia no deslocamento entre casa e trabalho. Isso significa mais de 500 horas por ano dentro de ônibus, carros e metrôs.", "Para enfrentar o problema, algumas prefeituras vêm ampliando as ciclovias e investindo em corredores exclusivos de ônibus. Em uma capital do Nordeste, por exemplo, a rede cicloviária cresceu 35% em três anos, e o número de ciclistas diários dobrou.", "Os benefícios vão além da rapidez. Meios de transporte coletivos e não motorizados emitem menos poluentes, reduzem o ruído e deixam as ruas mais seguras. Além disso, quem pedala ou caminha pratica atividade física, o que (1) ajuda a prevenir doenças como diabetes e hipertensão.", "Apesar dos avanços, ainda há obstáculos. Muitas ciclovias não se conectam entre si, e a falta de iluminação causa insegurança, sobretudo à noite. Já o transporte coletivo enfrenta críticas pela lotação e pelos atrasos. Especialistas defendem que as cidades planejem a mobilidade de forma integrada, pensando primeiro nas pessoas e não nos carros.", "A estudante Camila Lima, de 17 anos, trocou o carro da família pela bicicleta para ir à escola. “Chego mais rápido e mais disposta”, afirma."]}, {"label": "Texto 2", "titulo": "Cartaz de campanha: “Cidade em Movimento” (descrição da imagem)", "autor": "", "paras": ["<b>Imagem:</b> de um lado, uma longa fila de 40 carros, cada um com apenas uma pessoa; do lado, um único ônibus, cheio de passageiros, ocupando o mesmo comprimento de rua.", "<b>Texto verbal:</b> “40 carros ocupam o mesmo espaço que 1 ônibus. Vamos dividir a rua?”.", "<b>Rodapé:</b> “Escolha o transporte coletivo. A cidade agradece.”"]}], "qs": [{"q": "A leitura do Texto 1 permite inferir que", "pre": "", "o": ["o planejamento integrado da mobilidade pode melhorar a qualidade de vida e a saúde da população.", "o transporte por carro é a única solução para o trânsito.", "as ciclovias já resolveram todos os problemas de mobilidade no Brasil.", "o transporte coletivo não enfrenta nenhuma crítica."], "a": 0, "e": "O texto relaciona a mobilidade integrada a ruas mais seguras, menos poluição e prevenção de doenças. As outras alternativas contradizem o 4º parágrafo (“ainda há obstáculos”, “críticas pela lotação”).", "c": "I"}, {"q": "Quanto ao gênero textual, o Texto 1 é", "pre": "", "o": ["artigo de opinião.", "reportagem.", "editorial.", "carta do leitor."], "a": 1, "e": "Texto informativo, com dados de pesquisa, exemplos, depoimento (Camila) e fala de especialistas: reportagem.", "c": "G"}, {"q": "O 4º parágrafo do Texto 1 trata principalmente", "pre": "", "o": ["dos benefícios ambientais das ciclovias.", "do aumento do número de ciclistas.", "da história do transporte coletivo.", "dos obstáculos que ainda persistem na mobilidade urbana."], "a": 3, "e": "O parágrafo começa com “Apesar dos avanços, ainda há obstáculos” e enumera: ciclovias desconectadas, falta de iluminação, lotação e atrasos.", "c": "I"}, {"q": "De acordo com o Texto 1,", "pre": "", "o": ["o número de ciclistas diminuiu nas capitais.", "o trabalhador gasta, em média, 5 horas por dia no trajeto.", "a rede cicloviária de uma capital do Nordeste cresceu 35% em três anos.", "os corredores de ônibus aumentam a poluição."], "a": 2, "e": "Informação literal do 2º parágrafo. O tempo médio citado é de 2 horas por dia.", "c": "I"}, {"q": "No último parágrafo, a fala de Camila Lima aparece entre aspas para", "pre": "", "o": ["indicar ironia da jornalista.", "indicar um título.", "destacar uma palavra estrangeira.", "reproduzir o depoimento da estudante, que serve de exemplo concreto ao assunto."], "a": 3, "e": "As aspas marcam o discurso direto, a fala literal da personagem. O depoimento ilustra o tema e aproxima o leitor da realidade.", "c": "P"}, {"q": "Questões 6 a 9 – No trecho “quem pedala ou caminha pratica atividade física, o que (1) ajuda a prevenir doenças como diabetes e hipertensão”, a expressão O QUE (1) é", "pre": "", "o": ["uma conjunção integrante.", "um pronome relativo que retoma toda a oração anterior.", "um pronome interrogativo.", "uma conjunção causal."], "a": 1, "e": "“O que” equivale a “fato que / coisa que” e retoma a ideia inteira de “praticar atividade física”. É pronome relativo.", "c": "S"}, {"q": "A oração “o que ajuda a prevenir doenças como diabetes e hipertensão” é subordinada", "pre": "", "o": ["substantiva subjetiva.", "adverbial final.", "adjetiva explicativa.", "adjetiva restritiva."], "a": 2, "e": "Está separada por vírgula e acrescenta uma informação (comentário) sobre a oração anterior, sem restringir nenhum termo: adjetiva explicativa.", "c": "S"}, {"q": "A expressão ALÉM DISSO (início do período) tem valor de", "pre": "", "o": ["adição.", "oposição.", "conclusão.", "concessão."], "a": 0, "e": "Soma mais um benefício ao que foi dito antes: adição.", "c": "C"}, {"q": "A palavra COMO, em “doenças como diabetes e hipertensão”, introduz", "pre": "", "o": ["uma condição.", "uma causa.", "uma comparação.", "uma exemplificação."], "a": 3, "e": "“Como” introduz exemplos de doenças (diabetes e hipertensão). Não compara nem indica causa.", "c": "C"}, {"q": "Um antônimo para RAPIDEZ (3º parágrafo) é", "pre": "", "o": ["agilidade.", "pressa.", "lentidão.", "velocidade."], "a": 2, "e": "Rapidez = velocidade. O contrário é lentidão. Agilidade, pressa e velocidade são sinônimos ou palavras próximas.", "c": "M"}, {"q": "No 4º parágrafo, a palavra OBSTÁCULOS pode ser substituída, sem prejuízo de sentido, por", "pre": "", "o": ["benefícios.", "empecilhos.", "avanços.", "soluções."], "a": 1, "e": "Obstáculo = empecilho, dificuldade.", "c": "M"}, {"q": "No 1º parágrafo, o pronome ISSO (“Isso significa mais de 500 horas por ano”) retoma", "pre": "", "o": ["o fato de o trabalhador gastar, em média, 2 horas por dia no deslocamento.", "o trânsito das cidades pequenas.", "o aumento das ciclovias.", "o número de carros nas ruas."], "a": 0, "e": "Isso resume a informação anterior (2 horas diárias). A conta confirma: 2 h × cerca de 250 dias úteis = 500 horas.", "c": "C"}, {"q": "A expressão APESAR DOS AVANÇOS (4º parágrafo) estabelece relação de", "pre": "", "o": ["finalidade.", "causa.", "concessão.", "explicação."], "a": 2, "e": "Admite um fato (houve avanços) que não impede o que vem depois (ainda há obstáculos). Relação de concessão.", "c": "C"}, {"q": "No trecho “Já o transporte coletivo enfrenta críticas”, o termo JÁ tem valor de", "pre": "", "o": ["tempo (anterioridade).", "finalidade.", "explicação.", "contraste (oposição)."], "a": 3, "e": "Aqui “já” não indica tempo: marca contraste com a frase anterior (ciclovias × transporte coletivo), com valor semelhante a “por outro lado”.", "c": "C"}, {"q": "Têm acento gráfico pela mesma regra as palavras", "pre": "", "o": ["metrôs e ônibus.", "ônibus e rápido.", "metrôs e rápido.", "carros e ônibus."], "a": 1, "e": "Ônibus e rápido são proparoxítonas (todas levam acento). Metrôs é oxítona terminada em -o seguida de s; carros não tem acento.", "c": "A"}, {"q": "No trecho “Muitas ciclovias não se conectam entre si”, o pronome SE tem valor de", "pre": "", "o": ["partícula apassivadora.", "índice de indeterminação do sujeito.", "conjunção.", "pronome recíproco."], "a": 3, "e": "As ciclovias “não se conectam entre si” = uma não se liga à outra. A expressão “entre si” reforça a ideia de reciprocidade.", "c": "S"}, {"q": "O propósito comunicativo prioritário do Texto 2 é", "pre": "", "o": ["convencer a população a usar o transporte coletivo.", "criticar apenas os motoristas de ônibus.", "informar sobre a história do ônibus.", "narrar um engarrafamento."], "a": 0, "e": "Cartaz de campanha: busca persuadir, com argumento visual (40 carros × 1 ônibus) e frase de apelo.", "c": "I"}, {"q": "A frase “Vamos dividir a rua?” apresenta, predominantemente, a função da linguagem", "pre": "", "o": ["referencial.", "poética.", "apelativa (conativa).", "emotiva."], "a": 2, "e": "Há um convite direto ao interlocutor (verbo no imperativo/pergunta de chamamento): função apelativa, típica de textos publicitários.", "c": "L"}, {"q": "A relação entre os Textos 1 e 2 é a de que", "pre": "", "o": ["o Texto 2 critica as ciclovias.", "ambos defendem o uso de meios de transporte coletivos ou sustentáveis.", "o Texto 1 defende o uso exclusivo do carro.", "ambos narram a vida de uma estudante."], "a": 1, "e": "O Texto 1 informa sobre os benefícios do transporte coletivo e não motorizado; o Texto 2 convoca a população a escolher o transporte coletivo.", "c": "I"}, {"q": "Quanto ao gênero textual, os Textos 1 e 2 são, respectivamente,", "pre": "", "o": ["reportagem e cartaz de campanha.", "editorial e charge.", "notícia e tirinha.", "artigo de opinião e infográfico."], "a": 0, "e": "Texto 1: reportagem. Texto 2: cartaz de campanha (propaganda de interesse público), com imagem e slogan persuasivo.", "c": "G"}, {"q": "A frota de veículos de uma cidade é de 1.250.000. Em notação científica, esse valor é", "pre": "", "o": ["12,5 × 10<sup>5</sup>", "1,25 × 10<sup>5</sup>", "1,25 × 10<sup>6</sup>", "0,125 × 10<sup>7</sup>"], "a": 2, "e": "1.250.000 = 1,25 × 1.000.000 = 1,25 × 10<sup>6</sup>.", "c": "n"}, {"q": "Uma rede cicloviária de 80 km cresceu 35%. O novo comprimento da rede é de", "pre": "", "o": ["108 km.", "28 km.", "115 km.", "98 km."], "a": 0, "e": "35% de 80 = 28 km. Novo comprimento = 80 + 28 = 108 km (ou 80 × 1,35).", "c": "p"}, {"q": "Um ciclista percorre 12 km em 45 minutos. Sua velocidade média, em km/h, é de", "pre": "", "o": ["12.", "15.", "18.", "16."], "a": 3, "e": "45 min = 0,75 h. v = distância ÷ tempo = 12 ÷ 0,75 = 16 km/h.", "c": "q"}, {"q": "Um ônibus, a 40 km/h, faz um trajeto em 30 minutos. A 60 km/h, o mesmo trajeto será feito em", "pre": "", "o": ["15 minutos.", "20 minutos.", "45 minutos.", "60 minutos."], "a": 1, "e": "Velocidade e tempo são inversamente proporcionais: 40 × 30 = 60 × t → t = 1.200 ÷ 60 = 20 minutos.", "c": "r"}, {"q": "Uma bicicleta de R$ 1.200,00 foi parcelada a juros simples de 2% ao mês, durante 6 meses. O valor dos juros é de", "pre": "", "o": ["R$ 120,00.", "R$ 1.344,00.", "R$ 144,00.", "R$ 24,00."], "a": 2, "e": "J = 1.200 × 0,02 × 6 = R$ 144,00. (R$ 1.344,00 é o montante.)", "c": "j"}, {"q": "Uma corrida de táxi custa C(x) = 6 + 2,5x reais, em que x é o número de quilômetros rodados. Para 14 km, o valor é de", "pre": "", "o": ["R$ 35,00.", "R$ 20,50.", "R$ 47,00.", "R$ 41,00."], "a": 3, "e": "C(14) = 6 + 2,5 × 14 = 6 + 35 = R$ 41,00.", "c": "f"}, {"q": "Duas linhas de ônibus saem do terminal a cada 12 minutos e a cada 20 minutos, respectivamente. Se saíram juntas às 6h, voltarão a sair juntas às", "pre": "", "o": ["6h30.", "7h.", "7h20.", "8h."], "a": 1, "e": "MMC(12, 20) = 60 minutos (12 = 2²·3; 20 = 2²·5 → 2²·3·5 = 60). 6h + 60 min = 7h.", "c": "m"}, {"q": "Dois trechos de ciclovia medem 84 m e 126 m. Eles serão divididos em pedaços de mesmo comprimento, o maior possível, sem sobras. Cada pedaço medirá", "pre": "", "o": ["42 m.", "21 m.", "14 m.", "84 m."], "a": 0, "e": "MDC(84, 126) = 42 (84 = 2²·3·7; 126 = 2·3²·7 → 2·3·7 = 42).", "c": "m"}, {"q": "Uma ciclovia contorna uma praça retangular de 30 m por 20 m. O comprimento da ciclovia é de", "pre": "", "o": ["50 m.", "100 m.", "600 m.", "120 m."], "a": 1, "e": "Perímetro = 2 × (30 + 20) = 100 m. (600 m² seria a área.)", "c": "g"}, {"q": "Uma rampa de acesso tem desnível (altura) de 1,5 m e afastamento horizontal de 2 m. O comprimento da rampa é de", "pre": "", "o": ["2,0 m.", "3,5 m.", "2,5 m.", "4,0 m."], "a": 2, "e": "c² = 1,5² + 2² = 2,25 + 4 = 6,25 → c = 2,5 m.", "c": "g"}, {"q": "Três ruas paralelas são cortadas por duas avenidas transversais. Na primeira avenida, os segmentos medem 6 m e 9 m; na segunda, medem 8 m e x. O valor de x é", "pre": "", "o": ["10 m.", "11 m.", "14 m.", "12 m."], "a": 3, "e": "Teorema de Tales: 6/9 = 8/x → 6x = 72 → x = 12 m.", "c": "g"}, {"q": "Em um estacionamento há 50 veículos, entre carros (4 rodas) e bicicletas (2 rodas), totalizando 140 rodas. O número de carros é", "pre": "", "o": ["15.", "25.", "20.", "30."], "a": 2, "e": "c + b = 50 e 4c + 2b = 140. Substituindo b = 50 − c: 4c + 100 − 2c = 140 → 2c = 40 → c = 20 (e b = 30).", "c": "x"}, {"q": "O tempo de deslocamento (em minutos) de cinco alunos até a escola foi: 35, 50, 45, 30 e 40. A média foi de", "pre": "", "o": ["38.", "40.", "42.", "45."], "a": 1, "e": "Soma = 35 + 50 + 45 + 30 + 40 = 200. Média = 200 ÷ 5 = 40 minutos.", "c": "t"}, {"q": "Em uma escola com 600 alunos, 1/4 vai de bicicleta e 1/3 vai de ônibus. O número de alunos que usam outros meios de transporte é", "pre": "", "o": ["250.", "200.", "150.", "350."], "a": 0, "e": "1/4 de 600 = 150; 1/3 de 600 = 200. Juntos: 350. Outros meios: 600 − 350 = 250.", "c": "q"}, {"q": "Em um sorteio de uma bicicleta participam 200 pessoas, e cada bilhete dá uma chance. Ana comprou 4 bilhetes. A probabilidade de Ana ganhar é de", "pre": "", "o": ["1/200.", "4/5.", "1/4.", "1/50."], "a": 3, "e": "P = 4/200 = 1/50.", "c": "b"}, {"q": "Maria tem 5 caminhos para ir de casa ao terminal e 3 caminhos para ir do terminal à escola. O número de maneiras diferentes de fazer o trajeto casa → terminal → escola é", "pre": "", "o": ["8.", "30.", "15.", "53."], "a": 2, "e": "Princípio multiplicativo: 5 × 3 = 15.", "c": "b"}, {"q": "Um contêiner para bicicletas tem formato de paralelepípedo com 6 m de comprimento, 2,4 m de largura e 2,5 m de altura. Seu volume é de", "pre": "", "o": ["14,4 m³.", "36 m³.", "30 m³.", "40 m³."], "a": 1, "e": "V = 6 × 2,4 × 2,5 = 14,4 × 2,5 = 36 m³.", "c": "e"}, {"q": "Um terreno trapezoidal para um bicicletário tem bases de 20 m e 12 m e altura de 8 m. Sua área é de", "pre": "", "o": ["128 m².", "96 m².", "160 m².", "256 m²."], "a": 0, "e": "A = (B + b) · h ÷ 2 = (20 + 12) × 8 ÷ 2 = 32 × 4 = 128 m².", "c": "g"}, {"q": "O preço de uma passagem de R$ 5,00 sofreu aumento de 8%. O novo preço é de", "pre": "", "o": ["R$ 5,08.", "R$ 5,80.", "R$ 5,40.", "R$ 8,00."], "a": 2, "e": "8% de 5 = R$ 0,40. Novo preço = 5,00 + 0,40 = R$ 5,40.", "c": "p"}, {"q": "O número de ciclistas por dia em uma avenida, durante sete dias, foi: 120, 150, 120, 180, 130, 120 e 160. A moda (valor que mais se repete) desses dados é", "pre": "", "o": ["150.", "130.", "140.", "120."], "a": 3, "e": "O valor 120 aparece três vezes, mais do que qualquer outro: moda = 120. (A média seria 980 ÷ 7 = 140.)", "c": "t"}]}], "AS": {"I": "Interpretação de texto", "G": "Gêneros e tipologia", "C": "Coesão e conectivos", "S": "Sintaxe e classes gramaticais", "A": "Acentuação", "M": "Semântica (sinônimos e antônimos)", "P": "Pontuação", "V": "Verbos e colocação pronominal", "L": "Linguagem e registro", "F": "Formação de palavras", "n": "Notação científica", "p": "Porcentagem", "j": "Juros simples", "m": "MMC e MDC", "r": "Regra de três", "f": "Funções", "g": "Geometria plana", "e": "Geometria espacial", "t": "Estatística", "b": "Probabilidade e contagem", "q": "Frações, razão e proporção", "x": "Equações e sistemas", "H": "História e curiosidades"}, "G": [["Figuras de linguagem", "Metáfora", "Comparação implícita, sem conectivo: um termo é usado no sentido de outro.", "“Seus olhos são duas estrelas.”"], ["Figuras de linguagem", "Comparação", "Aproximação explícita entre dois elementos, com conectivo (como, tal qual).", "“Ela é forte como uma rocha.”"], ["Figuras de linguagem", "Metonímia", "Troca de um termo por outro com relação de proximidade (autor/obra, parte/todo, continente/conteúdo).", "“Li Machado de Assis.” / “Comi dois pratos.”"], ["Figuras de linguagem", "Antítese", "Aproximação de ideias opostas.", "“Era o melhor e o pior dos tempos.”"], ["Figuras de linguagem", "Paradoxo", "Ideias contraditórias que, juntas, revelam uma verdade (diferente da antítese, é uma contradição aparente).", "“Amor é fogo que arde sem se ver.”"], ["Figuras de linguagem", "Hipérbole", "Exagero intencional para dar ênfase.", "“Já te falei mil vezes!”"], ["Figuras de linguagem", "Eufemismo", "Suavização de uma ideia desagradável.", "“Ele nos deixou” (em vez de morreu)."], ["Figuras de linguagem", "Ironia", "Dizer o contrário do que se pensa, com intenção crítica ou humorística.", "“Que ótimo! Choveu justo no dia do passeio.”"], ["Figuras de linguagem", "Personificação (prosopopeia)", "Atribuir ações ou sentimentos humanos a seres não humanos.", "“O vento sussurrava segredos.”"], ["Figuras de linguagem", "Gradação", "Sequência de ideias em ordem crescente ou decrescente de intensidade.", "“Chorou, gritou, desabou.”"], ["Figuras de linguagem", "Pleonasmo", "Repetição de ideia já contida, para dar ênfase (pode ser vicioso quando só repete).", "“Vi com meus próprios olhos.”"], ["Figuras de linguagem", "Elipse", "Omissão de um termo facilmente identificável.", "“Fui ao mercado e [fui] à padaria.”"], ["Figuras de linguagem", /* ---------- OFENSIVA, RADAR, CORTE, HISTÓRIA, FÓRUM ---------- */
const ymd=d=>d.toLocaleDateString("sv");
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const streakNow=p=>p.slast===today()||p.slast===yday()?p.streak||0:0;
function countQ(n){const t=today();if(me.qday!==t){me.qday=t;me.qn=0}me.qn=(me.qn||0)+n;if(me.qn>=5&&me.slast!==t){me.streak=me.slast===yday()?(me.streak||0)+1:1;me.slast=t;me.sbest=Math.max(me.sbest||0,me.streak);toast("🔥 Ofensiva: "+me.streak+" dia"+(me.streak>1?"s":"")+"!")}}
function streakCard(){const sk=streakNow(me),done=me.slast===today(),f=Math.max(0,5-(me.qday===today()?me.qn||0:0));
 return`<div class="card"><h2>${done?"🔥":sk?"🕯️":"🪫"} Ofensiva: ${sk} dia${sk===1?"":"s"}</h2><div class="mu">${done?"Meta de hoje cumprida! Volte amanhã para manter a chama.":sk?`Resolva mais ${f} questão(ões) hoje para a chama não apagar!`:`Resolva ${f} questões hoje para acender a chama.`}</div><div class="bar" style="margin-top:6px"><i style="width:${done?100:(5-f)*20}%"></i></div></div>`}
const AX=[["Álgebra","fx"],["Geometria","ge"],["Aritmética","npjmrqtb"],["Interpretação","IGL"],["Gramática","CSAMPVF"]];
function axval(p,cs){let e=0,t=0;for(const c of cs){const x=(p.err||{})[c];if(x){e+=x[0];t+=x[1]}}return t?Math.round(100*(1-e/t)):null}
const axes=p=>[...AX.map(a=>[a[0],axval(p,a[1])]),["Redação",p.red==null?null:p.red*10]];
function radar(p){const A=axes(p),n=6,cx=150,cy=140,R=92,pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 const ring=k=>A.map((_,i)=>pt(i,R*k).join(",")).join(" ");
 return`<svg viewBox="0 0 300 285" style="width:100%;max-width:380px;display:block;margin:auto">${[.25,.5,.75,1].map(k=>`<polygon points="${ring(k)}" fill="none" stroke="var(--bd)"/>`).join("")}${A.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--bd)"/>`}).join("")}<polygon points="${A.map((a,i)=>pt(i,R*(a[1]||0)/100).join(",")).join(" ")}" fill="#5b5bf044" stroke="var(--pr)" stroke-width="2"/>${A.map((a,i)=>{const[x,y]=pt(i,R+20);return`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="var(--tx)">${a[0]}<tspan x="${x}" dy="13" fill="var(--mu)">${a[1]==null?"sem dados":a[1]+"%"}</tspan></text>`}).join("")}</svg>`}
function rPerfil(mb){const ks=axes(me).filter(a=>a[1]!=null).sort((a,b)=>a[1]-b[1]);
 mb.innerHTML=`<div class="card"><h2>📊 Radar de desempenho</h2>${radar(me)}<div class="mu" style="text-align:center">${ks.length?`Ponto mais fraco: <b>${ks[0][0]}</b> (${ks[0][1]}%).${ks.length>1?` Mais forte: ${ks[ks.length-1][0]} (${ks[ks.length-1][1]}%).`:""} Se o desenho ficar “torto”, treine o lado menor.`:"Resolva questões no quiz e nos simulados para montar seu radar."}</div></div>
 <div class="card"><h2>✍️ Redação</h2><div class="mu">Não há questão objetiva de redação, então esse eixo usa a nota de 0 a 10 que você se der (ou o professor der) na última redação.</div><input id="rd" type="number" min="0" max="10" step="0.5" value="${me.red??""}" placeholder="Nota 0 a 10"><button class="btn s" data-a="rds">Salvar</button></div>
 <div class="card"><h2>🔥 Ofensiva</h2>Atual: <b>${streakNow(me)}</b> dia(s) · Recorde: <b>${me.sbest||0}</b></div>`;
 ACT.rds=()=>{const x=parseFloat($("#rd").value);if(isNaN(x)||x<0||x>10)return toast("Digite uma nota de 0 a 10");me.red=x;save();rMais()}}
function rCorte(mb){const c=me.corte||{campus:"Natal-Central",vagas:"",cut:""};
 mb.innerHTML=`<div class="card"><h2>🏁 Simulador de corte da redação</h2><div class="mu">Regra considerada (confirme no edital do ano!): a redação só é corrigida se você não zerar nenhuma prova objetiva e ficar dentro de 3× o número de vagas do curso. <b>Não tenho os dados oficiais por campus</b>, então preencha com o resultado do ano passado do seu campus/curso (site do IFRN).</div>
 <select id="cc">${["Natal-Central","Mossoró","Parnamirim","Outro campus"].map(x=>`<option ${x===c.campus?"selected":""}>${x}</option>`).join("")}</select>
 <input id="cv" type="number" placeholder="Vagas do curso" value="${c.vagas}"><input id="ct" type="number" placeholder="Acertos (de 40) de quem ficou na última posição de corte no ano passado" value="${c.cut}">
 <button class="btn" data-a="cc2">Calcular com meu último simulado</button></div><div id="cr"></div>`;
 ACT.cc2=()=>{const h=(me.sims||[]).slice(-1)[0],v=+$("#cv").value,t=+$("#ct").value;me.corte={campus:$("#cc").value,vagas:v||"",cut:t||""};save();
  if(!h)return $("#cr").innerHTML='<div class="alert">Faça primeiro um simulado completo (40 questões).</div>';
  const pm=h.po!=null?h.ok-h.po:null;let m=[];
  if(h.po===0||pm===0)m.push('<div class="alert">❌ Você zerou uma prova objetiva: sua redação <b>não seria corrigida</b>.</div>');
  else{if(h.po==null)m.push('<div class="mu">(Simulado antigo: refaça para checar zero por prova.)</div>');
   if(t){const d=h.ok-t;m.push(d>=0?`<div class="alert" style="border-color:var(--ok)">✅ ${h.ok} acertos: <b>dentro do corte</b> do ano passado (${t}). Margem de ${d} questão(ões). Sua redação seria corrigida.</div>`:`<div class="alert">⚠️ ${h.ok} acertos: <b>${-d} abaixo</b> do corte do ano passado (${t}). A redação não seria corrigida. Foco nos pontos fracos!</div>`)}
   else m.push(`<div class="alert">Você fez ${h.ok}/40, sem zerar prova. Informe o corte do ano passado para saber se ficaria dentro.</div>`)}
  if(v)m.push(`<div class="mu">${$("#cc").value}: com ${v} vagas, a redação seria corrigida para até ${v*3} candidatos.</div>`);
  $("#cr").innerHTML=m.join("")}}
let hg=null;
const goQuiz=c=>{tab="quiz";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==="quiz"));qStart(c)};
function rHist(mb){if(hg)return hgR();
 mb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🏛️</div><h2>Máquina do Tempo</h2><div class="mu">História do Brasil e do RN de um jeito divertido.</div><br><button class="btn" data-a="hs">⚡ Qual veio primeiro?</button><button class="btn" data-a="hq">🧠 Quiz de História</button><button class="btn g" data-a="hl">📜 Linha do tempo</button></div><div id="hx"></div>`;
 ACT.hs=()=>{const e=shuf(EV);hg={i:0,sc:0,res:null,qs:Array.from({length:10},(_,i)=>[e[2*i],e[2*i+1]])};hgR()};ACT.hq=()=>goQuiz("H");
 ACT.hl=()=>{$("#hx").innerHTML=EV.map(e=>`<div class="card"><b>${e[0]}</b> · ${e[1]}<div class="mu">${e[2]}</div></div>`).join("")}}
function hgR(){const mb=$("#mb");
 if(hg.i>=10){mb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${hg.sc>=8?"🏆":"📜"}</div><h2>${hg.sc}/10</h2><div class="mu">Você acertou ${hg.sc} confrontos de datas.</div><button class="btn" data-a="hs">Jogar de novo</button><button class="btn g" data-a="hb">Voltar</button></div>`;ACT.hb=()=>{hg=null;rMais()};return}
 const[a,b]=hg.qs[hg.i],f=a[0]<b[0]?0:1,r=hg.res;
 mb.innerHTML=`<div class="card"><div class="mu">Rodada ${hg.i+1}/10 · ${hg.sc} acertos</div><h2>Qual aconteceu PRIMEIRO?</h2>${[a,b].map((e,k)=>`<button class="opt ${r!=null?(k===f?"ok":k===r?"no":""):""}" data-a="hp" data-v="${k}">${e[1]}${r!=null?`<div class="mu">${e[0]} — ${e[2]}</div>`:""}</button>`).join("")}${r!=null?`<button class="btn" data-a="hn">${hg.i<9?"Próxima ▶":"Ver resultado"}</button>`:""}</div>`;
 ACT.hp=v=>{if(hg.res!=null)return;hg.res=+v;if(+v===f){hg.sc++}countQ(1);hgR()};ACT.hn=()=>{hg.i++;hg.res=null;hgR()}}

/* ---------- QUIZ ---------- */
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function qStart(c){const pool=c?BANK.filter(q=>q.c===c):BANK;qz={c,n:Math.min(10,pool.length),i:0,sc:0,ok:0,st:0,t:20,qs:shuf(pool).slice(0,10).map(q=>{const ix=shuf([0,1,2,3]);return{...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}})};nextQ()}
function stopQ(){clearInterval(qt)}
function rQuiz(){
 if(!qz){const best=[me].filter(p=>p.best);
  $("#v").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:46px">🎮</div><h2>Quiz Relâmpago</h2><div class="mu">10 questões, 20s cada, com explicação a cada resposta. Sequência rende bônus!</div><br><button class="btn" data-a="qs">Jogar (geral)</button></div>
  <div class="card"><h2>Treinar por assunto</h2>${Object.keys(AS).map(c=>{const n=BANK.filter(q=>q.c===c).length;return n?`<button class="chip" data-a="qa" data-v="${c}">${AS[c]} (${n})</button>`:""}).join("")}</div>
  <div class="card"><h2>🏅 Seu recorde</h2>${best.map(p=>`<div class="row"><span class="av">${p.av}</span><div class="grow nm">${esc(p.name)}</div><b>${p.best}</b></div>`).join("")||'<div class="mu">Seja o primeiro!</div>'}</div>`;
  ACT.qs=()=>qStart();ACT.qa=v=>qStart(v);return}
 if(qz.done){$("#v").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:46px">${qz.ok>=8?"🏆":qz.ok>=5?"👏":"💪"}</div><h2>${qz.sc} pontos</h2><div class="mu">${qz.ok}/${qz.n} acertos</div><br><button class="btn" data-a="ag">Jogar de novo</button><button class="btn g" data-a="rk">Meu perfil</button></div>`;
  ACT.ag=()=>{qz=null;rQuiz()};ACT.rk=()=>{qz=null;tab="mais";msub="perfil";render()};return}
 const q=qz.qs[qz.i];
 $("#v").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="chip">${AS[q.c]}</span><b>${qz.sc} pts ${qz.st>1?"🔥"+qz.st:""}</b></div><div class="mu">Questão ${qz.i+1}/${qz.n}</div><div class="bar"><i id="qb" style="width:${qz.t*5}%"></i></div>
 <h2 style="margin-top:12px;font-size:17px">${q.q}</h2>${q.o.map((o,i)=>`<button class="opt" data-a="qo" data-v="${i}">${o}</button>`).join("")}<div id="qx"></div></div>`;
 ACT.qo=v=>ans(+v);ACT.qn=()=>{if(++qz.i>=qz.n){qz.done=true;me.xp+=qz.sc;me.rounds++;me.best=Math.max(me.best,qz.sc);save();rQuiz()}else nextQ()}}
function nextQ(){qz.t=20;qz.lock=false;stopQ();rQuiz();qt=setInterval(()=>{qz.t-=.25;const b=$("#qb");if(b)b.style.width=qz.t*5+"%";if(qz.t<=0)ans(-1)},250)}
function ans(i){if(qz.lock)return;qz.lock=true;stopQ();const q=qz.qs[qz.i],g=i===q.a;
 if(g){qz.ok++;qz.st++;qz.sc+=10+Math.ceil(qz.t/2)+Math.min(qz.st,5)}else qz.st=0;
 rec(q.c,!g);me.tot++;if(g)me.ok++;countQ(1);
 document.querySelectorAll(".opt").forEach((b,k)=>{if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("no")});
 $("#qx").innerHTML=`<div class="ex">${g?"✅ Boa!":i<0?"⏰ Tempo esgotado.":"❌ Não foi dessa vez."} 💡 ${q.e}</div><button class="btn" data-a="qn" style="margin-top:8px">Próxima ▶</button>`}

(()=>{me=ls.get("ij_me",null);draft=ls.get("ij_dr",null);if(me){me.err=me.err||{};me.sims=me.sims||[];start()}else onboard()})();
</script></body></html>
